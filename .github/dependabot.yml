# Dependabot: security updates for everything that ships, grouped so a scan
# never turns into a dozen PRs. Version (non-security) bumps stay manual —
# Tauri pins several crates tightly and a blind bump breaks the desktop build —
# which is what `open-pull-requests-limit: 0` does: it turns version updates
# off while the entry's grouping still shapes the security PRs.
version: 2
updates:
  # npm: the root manifest sees every workspace (tmuxy-ui, tmuxy-demo, ...)
  # and the `overrides` block, so one entry covers the lot.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "🔧"

  # cargo: one workspace lockfile at the root.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "🔧"

  # The workflows' own actions, every one pinned to a commit sha with its tag
  # as a trailing comment; Dependabot moves the sha and the comment together.
  # A release is a week old before it is proposed: a hijacked tag is usually
  # found and pulled within days, and the cooldown keeps that week off main.
  # GitHub's own `actions/*` and everyone else's come in separate PRs, because
  # `dependabot actions merge` merges only the first kind; a third-party bump
  # waits for a person to read what the new commit does.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["actions/*"]
      third-party-actions:
        patterns: ["*"]
        exclude-patterns: ["actions/*"]
    commit-message:
      prefix: "🔧"
