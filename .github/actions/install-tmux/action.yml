name: Install tmux
# A source-built tmux, cached by version. 3.7a is what the devcontainer and
# the v86 guest run — docs/TMUX.md targets it everywhere — and the nightly
# matrix builds each older version it covers the same way. The build is ~30-60s,
# the cache restore ~2s.
inputs:
  version:
    required: false
    default: '3.7a'
  # The cache key's namespace. `runner.os` serves one runner image; a job that
  # builds on several images of one OS (build-app.yml) passes `matrix.os`, so
  # the 22.04 and arm builds each link their own libevent.
  cache-key-namespace:
    required: false
    default: ${{ runner.os }}
runs:
  using: composite
  steps:
    - name: Cache tmux ${{ inputs.version }}
      id: tmux-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          /usr/local/bin/tmux
          /usr/local/share/tmux
        key: ${{ inputs.cache-key-namespace }}-tmux-${{ inputs.version }}-v1

    # The build's own apt dependencies are installed here, on a miss, so a job
    # that only ever restores the cache pays for no apt index refresh.
    - name: Build tmux ${{ inputs.version }} (cache miss)
      if: steps.tmux-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TMUX_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        "$GITHUB_WORKSPACE/bin/ci/apt-get" update
        "$GITHUB_WORKSPACE/bin/ci/apt-get" install -y --no-install-recommends libevent-dev libncurses-dev bison
        v="$TMUX_VERSION"
        curl -sL "https://github.com/tmux/tmux/releases/download/$v/tmux-$v.tar.gz" | tar xz
        cd "tmux-$v" && ./configure && make -j"$(nproc)" && sudo make install
        cd .. && rm -rf "tmux-$v"

    - name: Confirm tmux version
      shell: bash
      run: tmux -V
