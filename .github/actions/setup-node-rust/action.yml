name: Setup Node + Rust
inputs:
  node-version:
    required: false
    default: '22'
  rust-targets:
    required: false
    default: ''
  install-npm:
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      if: inputs.rust-targets != ''
      with:
        toolchain: stable
        targets: ${{ inputs.rust-targets }}

    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      if: inputs.rust-targets == ''
      with:
        toolchain: stable

    - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - uses: ./.github/actions/install-node-modules
      if: inputs.install-npm == 'true'
