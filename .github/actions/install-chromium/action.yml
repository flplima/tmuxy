name: Install Chromium
description: Playwright's Chromium with its download cached, and the fonts it renders with.
# The download is ~130MB and identical for one lockfile. The runner image
# ships Google Chrome, so the shared libraries Chromium loads are already
# there and `--with-deps` is not used (it has no package list for a runner
# release newer than Playwright, see bin/ci/playwright-install). What the
# image does NOT ship is the fonts it would bring — CJK, emoji, Unifont — and
# without them every wide-glyph check sees a narrow fallback, so those are
# installed on every run, from the image's own index (a refresh only if that
# index has gone stale).
inputs:
  # The story probes and the perf harnesses launch the full Chromium by path;
  # the E2E suites leave the variable unset and get Playwright's own headless
  # build, so only a job that asks has it set.
  export-path:
    description: "'true' to set PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH for the job's later steps"
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Chromium (cache miss)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bin/ci/playwright-install chromium

    # bin/chromium-fonts.txt is the list Playwright's own install-deps uses for
    # Chromium; bin/install-dev-tools installs the same one, so a container
    # and a runner measure a wide glyph the same way.
    - name: Install the fonts Chromium renders with
      shell: bash
      run: |
        fonts="$(cat bin/chromium-fonts.txt)"
        APT_ATTEMPTS=1 "$GITHUB_WORKSPACE/bin/ci/apt-get" install -y --no-install-recommends $fonts \
          || { "$GITHUB_WORKSPACE/bin/ci/apt-get" update && "$GITHUB_WORKSPACE/bin/ci/apt-get" install -y --no-install-recommends $fonts; }

    - name: Name the Chromium executable for later steps
      if: inputs.export-path == 'true'
      shell: bash
      run: |
        path="$(node -e "console.log(require('playwright').chromium.executablePath())")"
        echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$path" >> "$GITHUB_ENV"
