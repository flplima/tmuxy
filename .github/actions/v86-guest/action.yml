name: Build the v86 guest
description: tmuxy-wasm and the v86 guest assets (image and booted snapshot), the latter from cache when nothing that goes into them changed.
# Needs a Rust toolchain with the guest targets first (setup-node-rust with
# `rust: guest`) and the npm dependencies.
#
# The cache key hashes everything the snapshot is built from: the build
# scripts and their guest module, the CLI and the shipped confs baked into
# it, the tmuxy-group binary cross-compiled into it (tmuxy-group, the
# tmuxy-core it links, the lockfiles), and the v86 package that writes the
# snapshot. It used to be spelled in three workflows, none with the Rust
# inputs, so a core change re-ran the v86 probe against a stale guest.
runs:
  using: composite
  steps:
    # The CLI and the crate must agree EXACTLY on the bindgen schema, so the
    # version is read from the lockfile (bin/wasm-bindgen-version).
    - name: Read the wasm-bindgen version from Cargo.lock
      id: wasm-bindgen
      shell: bash
      run: echo "version=$("$GITHUB_WORKSPACE/bin/wasm-bindgen-version")" >> "$GITHUB_OUTPUT"

    - name: Install wasm-bindgen CLI
      uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
      with:
        tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

    - name: Build tmuxy-wasm
      shell: bash
      run: npm run build:wasm

    - name: Cache v86 guest assets
      id: v86-assets-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: packages/tmuxy-ui/v86-assets
        key: ${{ runner.os }}-v86-assets-${{ hashFiles('packages/tmuxy-ui/scripts/build-v86-snapshot.mjs', 'packages/tmuxy-ui/scripts/fetch-v86-image.mjs', 'packages/tmuxy-ui/scripts/lib/guest.mjs', 'packages/tmuxy-ui/scripts/lib/guest.gen.json', 'packages/tmuxy-cli/bin/tmuxy-cli', 'packages/tmuxy-cli/bin/tmuxy/**', 'packages/tmuxy-core/**', 'packages/tmuxy-group/**', 'Cargo.toml', 'Cargo.lock', 'package-lock.json') }}

    - name: Build v86 guest assets (cache miss)
      if: steps.v86-assets-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        "$GITHUB_WORKSPACE/bin/ci/apt-get" update && "$GITHUB_WORKSPACE/bin/ci/apt-get" install -y --no-install-recommends zstd
        npm run fetch:v86-image -w tmuxy-ui
        npm run build:v86-snapshot -w tmuxy-ui
