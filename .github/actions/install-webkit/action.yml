name: Install WebKit
description: Playwright's WebKit with its download cached, and its system libraries.
# WebKit's system libraries are not in the runner image, so `install-deps`
# runs on every job; what the cache saves is the download.
runs:
  using: composite
  steps:
    - name: Cache WebKit
      id: webkit-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright/webkit*
        key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('package-lock.json') }}

    - name: Install WebKit's system libraries
      shell: bash
      run: npx playwright install-deps webkit

    - name: Install WebKit (cache miss)
      if: steps.webkit-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bin/ci/playwright-install webkit
