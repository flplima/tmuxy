name: Install Linux dependencies
description: The WebKitGTK headers the desktop crate links against, for a job that compiles the whole workspace.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        "$GITHUB_WORKSPACE/bin/ci/apt-get" update
        # shellcheck disable=SC2046 # one package per word
        "$GITHUB_WORKSPACE/bin/ci/apt-get" install -y --no-install-recommends $("$GITHUB_WORKSPACE/bin/toolchain" packages webkit-dev)
