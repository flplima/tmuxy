name: Build the frontend
description: The UI bundle (packages/tmuxy-ui/dist), uploaded as the `frontend-dist` artifact.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node-rust
      with:
        rust: none

    - name: Build frontend
      shell: bash
      run: npm run build -w tmuxy-ui

    - name: Upload frontend dist
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: frontend-dist
        path: packages/tmuxy-ui/dist
        if-no-files-found: error
        retention-days: 1
