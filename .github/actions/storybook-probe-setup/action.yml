name: Set up a Storybook story probe
description: Node and the npm dependencies, Chromium, a Storybook dev server on :6006 and, for the v86 stories, their guest.
# PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH is set for the steps after it: the
# probes launch Chromium by path.
inputs:
  v86:
    description: "'true' to build tmuxy-wasm and the v86 guest assets"
    required: false
    default: 'false'
  storybook-log:
    description: Where the Storybook dev server writes its log
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node-rust
      with:
        rust: ${{ inputs.v86 == 'true' && 'guest' || 'none' }}

    - if: inputs.v86 == 'true'
      uses: ./.github/actions/v86-guest

    # Storybook mounts both as static dirs and will not start without them;
    # the deterministic stories never fetch from them.
    - if: inputs.v86 != 'true'
      name: Create placeholder v86 asset dirs
      shell: bash
      run: mkdir -p packages/tmuxy-ui/v86-assets packages/tmuxy-wasm/pkg

    - uses: ./.github/actions/install-chromium
      with:
        export-path: 'true'

    - name: Start Storybook (dev server)
      shell: bash
      env:
        STORYBOOK_LOG: ${{ inputs.storybook-log }}
      run: |
        npm run storybook -w tmuxy-ui -- --ci --quiet 2>"$STORYBOOK_LOG" &
        bin/ci/wait-for-server http://localhost:6006/index.json 180000
