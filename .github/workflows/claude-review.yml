name: claude review

# Runs only when flplima or laika-assistant comments `@claude review` on a pull
# request. It runs on flplima's Claude subscription token, which the agent's
# shell never holds: a proxy on loopback adds it to each API request
# (bin/ci/claude-api-proxy.mjs). Claude and every QA surface run as an
# unprivileged user fenced to loopback (bin/ci/claude-sandbox); a second job,
# which never holds the token, posts the review and its GIFs
# (bin/ci/claude-review-publish). Whoever triggers it vouches for the PR's code,
# whose build runs before the fence goes up.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: claude review
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    if: >-
      contains(fromJSON('["flplima", "laika-assistant"]'), github.actor) &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude review'))
      )
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      root_pr: ${{ steps.stack.outputs.root_pr }}

    steps:
      # The default branch, whatever the event: the fence comes from here, never
      # from the pull request it fences.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Keep the fence from the default branch
        run: |
          mkdir -p "$RUNNER_TEMP/trusted"
          cp bin/ci/claude-sandbox bin/ci/claude-api-proxy.mjs "$RUNNER_TEMP/trusted/"
          echo "SANDBOX=$RUNNER_TEMP/trusted/claude-sandbox" >> "$GITHUB_ENV"

      - name: Resolve PR stack and check out stack top
        id: stack
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --prune

          root_json="$(gh pr view "$ROOT_PR" --json number,title,headRefName,headRefOid,baseRefName,url,author,isDraft)"
          open_prs="$(gh pr list --state open --limit 200 --json number,title,headRefName,headRefOid,baseRefName,url,author,isDraft)"

          node - "$ROOT_PR" "$root_json" "$open_prs" <<'EOF'
          const fs = require('node:fs');
          const [, , rootNumStr, rootRaw, openRaw] = process.argv;
          const rootPr = JSON.parse(rootRaw);
          const openPrs = JSON.parse(openRaw);

          const byNumber = new Map(openPrs.map((p) => [p.number, p]));
          byNumber.set(rootPr.number, rootPr);

          const visited = new Set([rootPr.number]);
          const chain = [rootPr];

          // Walk down the stack: p_{i+1}.baseRefName == p_i.headRefName
          let current = rootPr;
          while (true) {
            const children = [...byNumber.values()]
              .filter((p) => !visited.has(p.number) && p.baseRefName === current.headRefName)
              .sort((a, b) => Number(a.isDraft) - Number(b.isDraft) || a.number - b.number);
            if (children.length === 0) break;
            const next = children[0];
            visited.add(next.number);
            chain.push(next);
            current = next;
          }

          const bottom = chain[0];
          const top = chain[chain.length - 1];

          const lines = [
            '# PR Stack Context',
            '',
            `- **Root (triggered) PR:** #${rootPr.number} (${rootPr.title})`,
            `- **Stack size:** ${chain.length} PR(s)`,
            `- **Stack base branch:** \`${bottom.baseRefName}\``,
            `- **Checked-out stack top:** #${top.number} (\`${top.headRefName}\` @ \`${top.headRefOid}\`)`,
            `- **Combined stack diff:** \`git diff origin/${bottom.baseRefName}...origin/${top.headRefName}\``,
            '',
            '## Stacked PRs (bottom to top)',
            '',
          ];

          chain.forEach((pr, idx) => {
            lines.push(
              `### ${idx + 1}. PR #${pr.number}: ${pr.title}`,
              `- **URL:** ${pr.url}`,
              `- **Author:** ${pr.author?.login ?? 'unknown'}${pr.isDraft ? ' (draft)' : ''}`,
              `- **Branches:** \`${pr.baseRefName}\` <- \`${pr.headRefName}\` (\`${pr.headRefOid}\`)`,
              `- **Per-PR diff:** \`git diff origin/${pr.baseRefName}...origin/${pr.headRefName}\``,
              `- **Per-PR files:** \`git diff --name-status origin/${pr.baseRefName}...origin/${pr.headRefName}\``,
              `- **Per-PR commits:** \`git log --oneline origin/${pr.baseRefName}..origin/${pr.headRefName}\``,
              '',
            );
          });

          fs.writeFileSync('/tmp/pr-stack.md', lines.join('\n'), 'utf8');

          const envLines = [
            `ROOT_PR=${rootPr.number}`,
            `TOP_PR=${top.number}`,
            `TOP_HEAD_REF=${top.headRefName}`,
            `TOP_HEAD_OID=${top.headRefOid}`,
            `STACK_BASE_REF=${bottom.baseRefName}`,
            `STACK_COUNT=${chain.length}`,
          ];
          const envText = `${envLines.join('\n')}\n`;
          fs.writeFileSync('/tmp/pr-stack.env', envText, 'utf8');
          fs.appendFileSync(process.env.GITHUB_ENV, envText, 'utf8');
          EOF

          cat /tmp/pr-stack.md
          # shellcheck disable=SC1091
          source /tmp/pr-stack.env
          echo "root_pr=$ROOT_PR" >> "$GITHUB_OUTPUT"
          git checkout -B "$TOP_HEAD_REF" "origin/$TOP_HEAD_REF"

      - uses: ./.github/actions/setup-node-rust
        with:
          rust: guest

      - uses: ./.github/actions/install-desktop-test-deps

      - uses: ./.github/actions/install-tmux

      - name: Install agent and desktop QA tools
        run: |
          bash bin/install-dev-tools
          bin/ci/apt-get install -y --no-install-recommends imagemagick xdotool

      - name: Build frontend bundle
        run: npm run build -w tmuxy-ui

      - name: Build tmuxy-server and link CLI
        run: |
          cargo build -p tmuxy-server
          sudo ln -sf "$GITHUB_WORKSPACE/packages/tmuxy-cli/bin/tmuxy-cli" /usr/local/bin/tmuxy
          tmuxy --version

      - name: Build Tauri Linux debug binary
        working-directory: packages/tmuxy-tauri-app
        run: npx tauri build --debug --no-bundle --config '{"build":{"beforeBuildCommand":""}}'

      - uses: ./.github/actions/start-xvfb

      - name: Fence the agent (its own user, loopback only, the token behind a proxy)
        env:
          CLAUDE_REVIEW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          "$SANDBOX" setup
          "$SANDBOX" proxy
          "$SANDBOX" lock
          "$SANDBOX" check

      - name: Boot live QA surfaces as the agent (webapp :9000, Storybook :6006, Tauri GUI :99 + tauri-driver :4444)
        env:
          DISPLAY: ':99'
        run: |
          set -euo pipefail
          cd "$QA_ROOT"

          # 1. tmuxy-server on :9000 with action trace; its tmux shells are the agent's
          "$SANDBOX" run env RUST_LOG='info,tmuxy_server::sse=debug' TMUXY_TRACE_LEVEL=labeled \
            ./target/debug/tmuxy-server --port 9000 --no-auth --trace /tmp/tmuxy-qa-trace.ndjson \
            2>/tmp/tmuxy-server.log &
          bin/ci/wait-for-server http://localhost:9000

          # 2. Storybook on :6006
          mkdir -p packages/tmuxy-ui/v86-assets packages/tmuxy-wasm/pkg
          "$SANDBOX" run npm run storybook -w tmuxy-ui -- --ci --quiet 2>/tmp/storybook.log &
          bin/ci/wait-for-server http://localhost:6006/index.json 180000

          # 3. tauri-driver on :4444 + Tauri debug binary on Xvfb :99
          "$SANDBOX" run tauri-driver --port 4444 2>/tmp/tauri-driver.log &
          bin/ci/wait-for-server http://localhost:4444/status
          "$SANDBOX" run ./target/debug/tmuxy 2>/tmp/tauri-app.log &

      - name: Run Claude review (Sonnet)
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        env:
          DISPLAY: ':99'
        with:
          # Claude runs as the fenced user, through the launcher the fence wrote.
          path_to_claude_code_executable: ${{ runner.temp }}/trusted/claude-launch
          # Not the token: the proxy holds that. The action only needs a value.
          claude_code_oauth_token: held-by-the-proxy
          github_token: ${{ github.token }}
          classify_inline_comments: 'false'
          # A rerun with debug logging shows Claude's own output, so a run that
          # fails before its first turn says why; a normal run keeps it hidden.
          show_full_output: ${{ runner.debug == '1' }}
          trigger_phrase: '@claude review'
          claude_args: >-
            --model sonnet
            --max-turns 60
            --allowedTools "Agent,Task,Bash,Read,Edit,Write,Glob,Grep"
          prompt: |
            You are running inside a live QA environment for `flplima/tmuxy`.
            Read `/tmp/pr-stack.md` first. It lists the triggered PR (`#${{ env.ROOT_PR }}`), the full open PR stack (if stacked), the checked-out stack top (`#${{ env.TOP_PR }}` on `${{ env.TOP_HEAD_REF }}`), and the exact `git diff origin/<base>...origin/<head>` command for each PR in the chain.

            ## 1. Sub-agent Code Review (Sonnet)
            - Spawn parallel sub-agents via the `Agent`/`Task` tool (configured to run on `sonnet`): one sub-agent per PR listed in `/tmp/pr-stack.md` (and focussed sub-agents by domain if a single PR is large).
            - Each sub-agent must inspect its PR's diff (`git diff origin/<base>...origin/<head>`) and check compliance with `AGENTS.md`, `docs/INVARIANTS.md`, `docs/TMUX.md`, `docs/STATE-MANAGEMENT.md`, `docs/DATA-FLOW.md`, `docs/TESTS.md`, and `docs/SECURITY.md`.
            - Flag bugs, race conditions, control-mode hazards, blind waits, DOM-only test assertions without bounding-rect checks, security issues, and invariant violations.

            ## 2. Live End-to-End QA
            All live QA surfaces are already booted from the stack top:
            The machine has no network beyond these local servers: no GitHub, no web, no `gh`. Everything you need is in the checkout and `/tmp/pr-stack.md`. The binaries are already built from the stack top; `cargo` and `npm install` cannot fetch anything, so do not build or run the Rust tests.
            - **Webapp (`http://localhost:9000`) + CLI (`/usr/local/bin/tmuxy`)**: drive with `agent-browser --session qa-web open http://localhost:9000` (snapshot, click, type, screenshot, check bounding rects and console errors) and run `tmuxy` CLI commands against the live session. Inspect `/tmp/tmuxy-qa-trace.ndjson` and `/tmp/tmuxy-server.log` (`./target/debug/tmuxy-server trace --check /tmp/tmuxy-qa-trace.ndjson`).
            - **Storybook (`http://localhost:6006`)**: drive stories touched by the stack with `agent-browser --session qa-sb` (`/tmp/storybook.log`).
            - **Tauri Linux GUI (`target/debug/tmuxy` on `Xvfb :99`, `tauri-driver` on `http://localhost:4444`)**: capture screenshots with `DISPLAY=:99 import -window root /tmp/claude-review/raw/tauri.png`, send input with `DISPLAY=:99 xdotool`, or run WebDriver checks against `:4444` (`/tmp/tauri-app.log`, `/tmp/tauri-driver.log`).

            ## 3. GIFs of what changed
            Record up to three short GIFs (3 to 10 seconds each) that show what the stack changes: a new feature working, a fixed bug no longer happening, or a bug you found happening.
            - Webapp or Storybook: `agent-browser --session qa-web set viewport 1100 620`, then `agent-browser --session qa-web record start /tmp/claude-review/raw/<name>.webm`, drive it, `agent-browser --session qa-web record stop`.
            - Tauri GUI: `ffmpeg -y -f x11grab -video_size 1280x720 -t 8 -i :99 /tmp/claude-review/raw/<name>.webm` while you drive it with `xdotool`.
            - Convert each to a GIF at most 800 px wide and 10 fps: `ffmpeg -y -i /tmp/claude-review/raw/<name>.webm -vf "fps=10,scale=800:-1:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse" /tmp/claude-review/gifs/<name>.gif`. Names are lowercase letters, digits and dashes. Keep each GIF under 5 MB.
            - The terminal takes keys only after a click inside the pane (`agent-browser --session qa-web click ".terminal-content"`, then `keyboard type` and `press Enter`). When typed keys still do not arrive, drive the app from your shell with `tmuxy pane send` or `tmuxy run` while the recording runs: the GIF shows the UI reacting either way.
            - Record at least one GIF whenever the stack changes anything visible; skip them only when it changes nothing visible.

            ## 4. Output
            Write the whole report to `/tmp/claude-review/review.md`, in Markdown, under 60,000 bytes. Another job posts it on PR `#${{ env.ROOT_PR }}`; you post nothing yourself. Cover:
              1. Per-PR code review findings across the stack, each with its file and line.
              2. Live QA results (webapp, CLI, Storybook, Tauri GUI, trace health) with concrete observations.
              3. Each GIF where it belongs, as `![what it shows](gif:<name>.gif)`, with a sentence on what to look at.
              4. Verdict (pass, pass with notes, or changes requested).

      - name: Trace health check
        if: always()
        run: |
          if [ -f /tmp/tmuxy-qa-trace.ndjson ] && [ -x ./target/debug/tmuxy-server ]; then
            ./target/debug/tmuxy-server trace --check --github /tmp/tmuxy-qa-trace.ndjson || true
          fi

      - name: Upload QA logs and trace on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: claude-review-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/pr-stack.md
            /tmp/tmuxy-qa-trace.ndjson
            /tmp/tmuxy-server.log
            /tmp/storybook.log
            /tmp/tauri-driver.log
            /tmp/tauri-app.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop background QA services
        if: always()
        run: |
          "${SANDBOX:-true}" stop
          if [ -n "${XVFB_PID:-}" ]; then
            kill "$XVFB_PID" 2>/dev/null || true
          fi

      # Only the report and the GIFs cross to the publishing job.
      - name: Collect the review
        run: |
          mkdir -p "$RUNNER_TEMP/review/gifs"
          sudo cp /tmp/claude-review/review.md "$RUNNER_TEMP/review/" 2>/dev/null || true
          sudo find /tmp/claude-review/gifs -maxdepth 1 -type f -name '*.gif' -exec cp {} "$RUNNER_TEMP/review/gifs/" \;
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/review"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: claude-review-output-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review
          retention-days: 7

  publish:
    name: claude review / publish
    needs: review
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: claude-review-output-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review

      - name: Post the review and its GIFs
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_PR: ${{ needs.review.outputs.root_pr }}
        run: bin/ci/claude-review-publish "$RUNNER_TEMP/review" "$ROOT_PR"
