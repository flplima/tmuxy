name: nightly v86 sweep

# The full ~110-story v86 probe. It used to hang off the per-commit
# `storybook-v86-probe` job behind a step-level `continue-on-error`: 20 minutes
# on the critical path of every pull request, producing a result no one was
# obliged to look at. Here it runs once a night, it BLOCKS nothing, and a
# failure opens (or updates) an issue so the result actually reaches someone.
#
# The three blocking gate stories still run per commit in lint-and-tests.yml.
#
# There is no quarantine list for this sweep. A story that fails is run again
# that night on a FRESH runner (the `reconfirm-*` jobs), and `report` decides
# from both runs and the nights before (scripts/nightly-ledger.mjs): a story
# that fails twice is reported that night; one that passes the second time is
# a flake, kept in the ledger, and reported once it flakes on 2 of the last 7
# nights. Issues #87-#145 were each one story failing once on a loaded
# runner: an issue a night, closed by the next green run, which taught that
# the issue means nothing. docs/TESTS-STORYBOOK.md § "When the nightly reports".

on:
  schedule:
    # 04:30 UTC daily — after the day's merges, before the next morning.
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-v86
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      failed: ${{ steps.failed.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/storybook-probe-setup
        with:
          v86: 'true'
          storybook-log: /tmp/storybook.log

      # PROBE_TIMINGS_JSON is the per-story timing record (docs/PERFORMANCE.md
      # Axis A). The step's failure does not end the night: the stories it
      # names are re-run on a fresh runner, and `report` decides.
      - name: Probe v86 stories (shared engine, single page)
        continue-on-error: true
        run: |
          mkdir -p perf
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          PROBE_TIMINGS_JSON="$PWD/tests/perf/v86-probe-timings.json" \
          PROBE_RESULTS_JSON="$RUNNER_TEMP/results-sweep.json" \
            npm run test-storybook:v86 -w tmuxy-ui

      - name: Stories that failed
        id: failed
        run: bin/ci/failed-stories "$RUNNER_TEMP/results-sweep.json" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-results-sweep
          path: ${{ runner.temp }}/results-sweep.json
          if-no-files-found: warn

      - name: Upload probe timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: v86-probe-timings-${{ github.run_id }}
          path: tests/perf/v86-probe-timings.json
          if-no-files-found: error

      - name: Upload probe artifacts and the Storybook log
        if: steps.failed.outputs.ids != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: v86-sweep-artifacts-${{ github.run_id }}
          path: |
            packages/tmuxy-ui/probe-artifacts
            /tmp/storybook.log
          if-no-files-found: ignore

  # The deterministic (DemoAdapter) stories a push leaves out — the ones
  # tagged `nightly` — and the axe accessibility pass over every story, which
  # the per-commit probe skips. docs/TESTS-LAYERS.md § Tiers.
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      failed: ${{ steps.failed.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/storybook-probe-setup
        with:
          storybook-log: /tmp/storybook-deterministic.log

      - name: Probe every deterministic story, with the a11y pass
        continue-on-error: true
        env:
          PROBE_TIER: all
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          PROBE_RESULTS_JSON="$RUNNER_TEMP/results-deterministic.json" \
            npm run test-storybook -w tmuxy-ui

      - name: Stories that failed
        id: failed
        run: bin/ci/failed-stories "$RUNNER_TEMP/results-deterministic.json" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-results-deterministic
          path: ${{ runner.temp }}/results-deterministic.json
          if-no-files-found: warn

      - name: Upload probe artifacts and the Storybook log
        if: steps.failed.outputs.ids != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-deterministic-artifacts-${{ github.run_id }}
          path: |
            packages/tmuxy-ui/probe-artifacts
            /tmp/storybook-deterministic.log
          if-no-files-found: ignore

  # Tonight's failures again, alone, on a runner that ran nothing else: a
  # story that fails here too is a defect, one that passes was the sweep's
  # machine. PROBE_EXACT keeps an id from also taking the stories it prefixes.
  reconfirm-v86:
    needs: sweep
    if: needs.sweep.outputs.failed != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/storybook-probe-setup
        with:
          v86: 'true'
          storybook-log: /tmp/storybook.log
      - name: Probe tonight's failing v86 stories
        continue-on-error: true
        env:
          IDS: ${{ needs.sweep.outputs.failed }}
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          # shellcheck disable=SC2086 # one id per word
          PROBE_EXACT=1 PROBE_RESULTS_JSON="$RUNNER_TEMP/results-reconfirm-v86.json" \
            npm run test-storybook:v86 -w tmuxy-ui -- $IDS
      # Alone in its artifact, so it lands where `report` reads it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: nightly-results-reconfirm-v86
          path: ${{ runner.temp }}/results-reconfirm-v86.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: reconfirm-v86-artifacts-${{ github.run_id }}
          path: packages/tmuxy-ui/probe-artifacts
          if-no-files-found: ignore

  reconfirm-deterministic:
    needs: deterministic
    if: needs.deterministic.outputs.failed != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/storybook-probe-setup
        with:
          storybook-log: /tmp/storybook-deterministic.log
      - name: Probe tonight's failing deterministic stories
        continue-on-error: true
        env:
          IDS: ${{ needs.deterministic.outputs.failed }}
          PROBE_TIER: all
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          # shellcheck disable=SC2086 # one id per word
          PROBE_EXACT=1 PROBE_RESULTS_JSON="$RUNNER_TEMP/results-reconfirm-deterministic.json" \
            npm run test-storybook -w tmuxy-ui -- $IDS
      # Alone in its artifact, so it lands where `report` reads it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: nightly-results-reconfirm-deterministic
          path: ${{ runner.temp }}/results-reconfirm-deterministic.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: reconfirm-deterministic-artifacts-${{ github.run_id }}
          path: packages/tmuxy-ui/probe-artifacts
          if-no-files-found: ignore

  # One issue is kept open and commented on, rather than a new one every
  # night, and only for what the ledger says is a defect. A night with nothing
  # to report closes it (bin/ci/nightly-issue); a manual run counts, since
  # re-running the sweep after a fix is how one is confirmed. Only a scheduled
  # night opens the issue or enters the ledger's history.
  report:
    needs: [sweep, deterministic, reconfirm-v86, reconfirm-deterministic]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-results-*
          path: results

      # The ledger's memory: one verdict file per scheduled night, carried
      # from cache to cache (a cache key cannot be overwritten, so each night
      # saves under its own and restores the newest).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ledger
          key: ${{ runner.os }}-nightly-ledger-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-nightly-ledger-

      - name: Decide tonight's verdict
        id: ledger
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p ledger
          node packages/tmuxy-ui/scripts/nightly-ledger.mjs \
            --sweep results/nightly-results-sweep/results-sweep.json \
                    results/nightly-results-deterministic/results-deterministic.json \
            --reconfirm results/nightly-results-reconfirm-v86/results-reconfirm-v86.json \
                        results/nightly-results-reconfirm-deterministic/results-reconfirm-deterministic.json \
            --history ledger \
            --verdicts-out "$RUNNER_TEMP/tonight.json" \
            --body-out "$RUNNER_TEMP/report.md"

      # A sweep job that crashed before writing its results told us nothing,
      # and nothing is not a pass.
      - name: Both sweeps wrote results
        run: |
          test -s results/nightly-results-sweep/results-sweep.json
          test -s results/nightly-results-deterministic/results-deterministic.json

      - name: Report a sweep that wrote no results
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="A sweep job ended without writing its results, so tonight has no verdict: it crashed, timed out, or never started. The run's job list says which.

          Run: $RUN_URL
          Commit: ${{ github.sha }}" bin/ci/nightly-issue report "Nightly v86 sweep is failing"

      - name: Keep tonight in the ledger
        if: github.event_name == 'schedule'
        run: |
          cp "$RUNNER_TEMP/tonight.json" "ledger/${{ github.run_id }}.json"
          # Fourteen nights is twice the window; older ones only add bytes.
          ls -1t ledger/*.json | tail -n +15 | xargs -r rm --

      - if: github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ledger
          key: ${{ runner.os }}-nightly-ledger-${{ github.run_id }}

      - name: Open or update the tracking issue
        if: steps.ledger.outputs.report == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: BODY="$(cat "$RUNNER_TEMP/report.md")" bin/ci/nightly-issue report "Nightly v86 sweep is failing"

      - name: Close the tracking issue
        if: steps.ledger.outputs.report == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bin/ci/nightly-issue resolve "Nightly v86 sweep is failing"

      # The run's colour is the ledger's verdict: red for a defect, green for
      # a clean night or a one-off flake (named in the step above's log).
      - name: Fail on a reported defect
        if: steps.ledger.outputs.report == 'true'
        run: |
          cat "$RUNNER_TEMP/report.md"
          exit 1
