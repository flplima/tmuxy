name: ci node checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  demo-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/install-node-modules
      # That the site compiles. Without `prebuild`, which stages the v86
      # guest's assets for the page to load at runtime: building those is
      # Deploy Demo's, and a compile check has no use for them.
      - name: Build demo
        run: npm run build --ignore-scripts -w tmuxy-demo

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/install-node-modules
      - name: Vitest
        run: npm test -- --run

  cli-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/install-node-modules
      - name: CLI suite
        run: npm run test:cli
