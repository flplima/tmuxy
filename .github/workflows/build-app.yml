name: build app

# Tags publish. The daily run is the safety net: `desktop` in lint-and-tests
# already proves per-commit that the Linux release binary builds and launches,
# so what is left for this workflow to catch is macOS and arm64 breakage and
# the installer/bundle paths (DMG, AppImage, .deb, the upgrade path) — real
# risks, but ones a day of latency is fine for.
#
# The one job that PUBLISHES, `release`, is gated on a tag, so a scheduled
# run builds and smoke-tests only. What a tag publishes is a PRE-release;
# promoting it is what bumps the brew tap (publish-brew.yml).
on:
  push:
    tags: ['v*']
  schedule:
    # 06:30 UTC — after the three nightlies, so they do not contend for runners.
    - cron: '30 6 * * *'
  workflow_dispatch:

# Read-only by default. Only `release` writes to this repository (it creates
# the GitHub Release). Every other
# job runs build scripts from npm and crates.io, and none of them needs a token
# that can push a commit or a tag.
permissions:
  contents: read

jobs:
  # The full test suite, run against the TAG ref itself: `lint and tests`
  # triggers on pushes to main and on pull requests, never on a tag.
  #
  # `workflow_call` rather than adding `push: tags` to lint-and-tests.yml: a
  # separate tag-triggered run is a different run that `release` cannot depend
  # on, so the gate would have to be a poll-and-hope step. Called as a job, the
  # dependency is enforced by Actions itself, and a red suite leaves the tag
  # with no GitHub Release and no tap bump at all.
  tests:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/lint-and-tests.yml
    # The called workflow's `ci` job reads the run's job logs, which
    # needs `actions: read` — and a reusable workflow may only ask for what
    # its caller grants, or the WHOLE run fails at start-up (even with this
    # job skipped off a tag). A dispatched build on main died that way.
    permissions:
      contents: read
      actions: read
    with:
      # Every tier before a release, the nightly one included.
      e2e-tier: full

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            os: ubuntu-22.04
            rust-targets: ''
            tauri-args: ''
            binary: target/release/tmuxy
          - platform: linux
            arch: arm64
            os: ubuntu-22.04-arm
            rust-targets: ''
            tauri-args: ''
            binary: target/release/tmuxy
          - platform: macos
            arch: universal
            os: macos-26
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: '--target universal-apple-darwin'
            binary: target/universal-apple-darwin/release/tmuxy

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    # macOS signing + notarization credentials live on the three steps that
    # use them (stage the key, `tauri build`, notarize the DMG), never on the
    # job: every other step runs code from npm and crates.io — `npm ci`'s
    # install scripts, every crate's build.rs in `cargo test`, the
    # `cargo install` of the smoke-test driver — and none of it needs a
    # Developer ID. The key file is deleted as soon as notarization is done.
    #
    # Every one is OPTIONAL: with no APPLE_CERTIFICATE the CLI skips signing
    # entirely, so forks and any build made before the secrets exist still
    # produce a working (unsigned) DMG rather than failing. NOTARIZE says
    # whether the key is there without carrying it.
    env:
      NOTARIZE: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # node_modules by its own `npm ci` below, after the Linux packages.
      - uses: ./.github/actions/setup-node-rust
        with:
          rust-targets: ${{ matrix.rust-targets }}
          install-npm: 'false'

      # With their recommended packages, as every release so far was built.
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          bin/ci/apt-get update
          # shellcheck disable=SC2046 # one package per word
          bin/ci/apt-get install -y $(bin/toolchain packages webkit-dev)

      - run: npm ci

      # The Rust suite on a Mac, against Homebrew's tmux, daily: the
      # per-commit `macos-tests` job only runs it when a push touches
      # macOS-specific code (lint-and-tests.yml), and macOS minutes cost ten
      # Linux ones. On a tag, the `tests` job above runs it (macos-tests runs
      # cargo test on every tag), so it is not run twice.
      - name: Cargo test (macOS)
        if: matrix.platform == 'macos' && !startsWith(github.ref, 'refs/tags/')
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          mkdir -p packages/tmuxy-ui/dist
          cargo test --workspace

      # Notarization wants the App Store Connect key as a file, and secrets are
      # strings — so materialise it and hand the CLI its path. Skipped (with the
      # build then unsigned) whenever the key secret is absent.
      - name: Stage the notarization key (macOS)
        if: env.NOTARIZE == 'true'
        run: |
          KEY_DIR="$HOME/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_DIR/AuthKey_$APPLE_API_KEY.p8"
          chmod 600 "$KEY_DIR/AuthKey_$APPLE_API_KEY.p8"
          echo "APPLE_API_KEY_PATH=$KEY_DIR/AuthKey_$APPLE_API_KEY.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      # Read by the Tauri CLI itself: it imports the cert into a throwaway
      # keychain (deleted when it is done), signs the bundle with the hardened
      # runtime, then notarizes and staples. Empty on Linux.
      - name: Build Tauri app
        run: npx tauri build ${{ matrix.tauri-args }}
        working-directory: packages/tmuxy-tauri-app
        env:
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          # App Store Connect API key — preferred over APPLE_ID/APPLE_PASSWORD
          # because it carries no 2FA and can be revoked on its own.
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY || '' }}

      # The Tauri CLI notarizes and staples the .app, then wraps it in a DMG —
      # so the DMG itself carries a Developer ID signature and no ticket of its
      # own. Mounted, the app is accepted; but a DMG downloaded in a BROWSER is
      # quarantined, and Gatekeeper assesses the image before anything inside
      # it: `spctl` rejects it with `source=Unnotarized Developer ID` and the
      # user gets the "cannot be opened" dialog on the thing they just
      # downloaded. So the image is submitted too, and the ticket stapled INTO
      # it. Homebrew is unaffected either way (the cask strips the quarantine
      # attribute) — this is for the person who clicks the asset on the
      # releases page.
      - name: Notarize and staple the DMG itself (macOS)
        if: env.NOTARIZE == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          DMG=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          echo "submitting $DMG"
          # --wait, because the ticket has to exist before it can be stapled;
          # notarytool exits non-zero on anything but Accepted.
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          # Prove it on the spot: a stapled image validates offline, which is
          # the whole point — the ticket travels with the file.
          xcrun stapler validate "$DMG"

      # Nothing after this point signs, so nothing after it gets the key. Run
      # on failure too: a failed notarization must not leave it for the next
      # step either.
      - name: Delete the notarization key (macOS)
        if: always() && env.NOTARIZE == 'true'
        run: rm -rf "$HOME/private_keys"

      # GUI smoke test drivers. Linux: tauri-driver (WebKitGTK's driver) under
      # Xvfb. macOS has no WebKit driver, so tauri-webdriver proxies W3C
      # WebDriver to a plugin embedded in a debug build.

      - uses: ./.github/actions/install-desktop-test-deps
        if: matrix.platform == 'linux'
        with:
          cache-key-namespace: ${{ matrix.os }}

      # The same source-built pinned tmux as lint-and-tests.yml rather than
      # ubuntu-22.04's apt 3.2a, keyed per runner image so the 22.04 and arm
      # builds link their own libevent.
      - uses: ./.github/actions/install-tmux
        if: matrix.platform == 'linux'
        with:
          cache-key-namespace: ${{ matrix.os }}

      # Pinned and --locked like tauri-driver: an unpinned install builds
      # whatever crates.io serves today, its dependencies included, on the
      # runner that just held the signing credentials. Keep the version in
      # step with the `tauri-plugin-webdriver` minor the app's `webdriver`
      # feature uses.
      - name: Install smoke test deps (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install tmux
          cargo install tauri-webdriver --version 0.2.0 --locked

      - name: Build smoke test binary (macOS)
        if: matrix.platform == 'macos'
        run: npx tauri build --debug --no-bundle --features webdriver
        working-directory: packages/tmuxy-tauri-app

      - uses: ./.github/actions/start-xvfb
        if: matrix.platform == 'linux'

      - name: Run smoke test (Linux)
        if: matrix.platform == 'linux'
        env:
          DISPLAY: ':99'
          BINARY: ${{ matrix.binary }}
        run: |
          tauri-driver --port 4444 &
          DRIVER_PID=$!
          bin/ci/wait-for-server http://localhost:4444/status

          node tests/smoke/smoke-test.js "$BINARY"
          RESULT=$?

          kill $DRIVER_PID 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

          exit $RESULT

      - name: Run smoke test (macOS)
        if: matrix.platform == 'macos'
        run: |
          tauri-webdriver --port 4444 &
          DRIVER_PID=$!
          bin/ci/wait-for-server tcp://localhost:4444

          node tests/smoke/smoke-test.js target/debug/tmuxy
          RESULT=$?

          kill $DRIVER_PID 2>/dev/null || true

          exit $RESULT

      # Sparse-PATH regression test for the macOS Finder-launch failure.
      # Runs the *release* universal binary (which contains the production
      # PATH-augmentation code path) under launchd-style stripped env, with
      # a tmux.conf that requires a Homebrew-only binary to stay alive.
      # If gui.rs's PATH augmentation regresses, this test reconnect-storms
      # or FATALs out within seconds.
      - name: Install sparse-PATH test helper (macOS)
        if: matrix.platform == 'macos'
        run: |
          sudo tee /opt/homebrew/bin/tmuxy-stay-alive > /dev/null << 'EOF'
          #!/bin/sh
          exec sleep 36000
          EOF
          sudo chmod +x /opt/homebrew/bin/tmuxy-stay-alive

      - name: Run sparse-PATH regression test (macOS)
        if: matrix.platform == 'macos'
        run: node tests/smoke/macos-sparse-path-test.js "${{ matrix.binary }}"

      # --- Smoke-test the artifacts that actually ship ---
      #
      # Everything above runs `target/release/tmuxy` (or the debug build),
      # which is not what any user installs. These steps exercise the DMG, the
      # AppImage and the .deb themselves — the bundle layout, the bundled
      # resources and, for the .deb, its declared dependencies.

      - name: Smoke-test the shipped DMG (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          DMG=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          MOUNT=$(mktemp -d "${RUNNER_TEMP}/tmuxy-dmg.XXXXXX")
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT

          APP="$MOUNT/tmuxy.app"
          BIN="$APP/Contents/MacOS/tmuxy"
          test -x "$BIN"

          # Launched out of the mounted image, exactly as a user's first run
          # does before dragging it to /Applications.
          VERSION_LINE=$("$BIN" --version)
          echo "$VERSION_LINE"
          case "$VERSION_LINE" in
            "tmuxy "*) ;;
            *) echo "unexpected --version output from the DMG"; exit 1 ;;
          esac

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            EXPECTED="tmuxy ${GITHUB_REF_NAME#v}"
            [ "$VERSION_LINE" = "$EXPECTED" ] || {
              echo "DMG reports '$VERSION_LINE', tag says '$EXPECTED'"; exit 1; }
          fi

          hdiutil detach "$MOUNT"
          trap - EXIT

      # Signing and notarization are silent no-ops when the Apple secrets are
      # absent (see the env block above), so an unsigned DMG looks identical in
      # the logs. On a tag that is a release nobody can install without the
      # Gatekeeper dialog, so it fails here.
      - name: Assert the DMG is signed, notarized and stapled (macOS, tags)
        if: matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          DMG=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          MOUNT=$(mktemp -d "${RUNNER_TEMP}/tmuxy-sign.XXXXXX")
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT
          APP="$MOUNT/tmuxy.app"

          echo "--- codesign ---"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # The signing identity must be a Developer ID, not an ad-hoc or
          # Apple Development cert — those verify but fail on every other Mac.
          codesign -dvv "$APP" 2>&1 | tee "${RUNNER_TEMP}/codesign-info.txt"
          grep -q 'Authority=Developer ID Application' "${RUNNER_TEMP}/codesign-info.txt"

          echo "--- spctl ---"
          set +e
          spctl -a -vvv -t exec "$APP" > "${RUNNER_TEMP}/spctl.txt" 2>&1
          SPCTL_STATUS=$?
          set -e
          cat "${RUNNER_TEMP}/spctl.txt"
          [ "$SPCTL_STATUS" -eq 0 ] || { echo "spctl rejected the app"; exit 1; }
          grep -q 'accepted' "${RUNNER_TEMP}/spctl.txt"
          grep -q 'source=Notarized Developer ID' "${RUNNER_TEMP}/spctl.txt"

          echo "--- stapler ---"
          xcrun stapler validate "$APP"

          hdiutil detach "$MOUNT"
          trap - EXIT

          # And the image itself, which is the file a browser downloads and
          # quarantines. Asserted with the `open` context and the primary
          # signature — the same assessment Gatekeeper makes on a mount — so a
          # DMG that carries no ticket of its own fails here rather than
          # greeting a user with "cannot be opened".
          echo "--- the DMG itself ---"
          set +e
          spctl -a -vvv -t open --context context:primary-signature "$DMG" \
            > "${RUNNER_TEMP}/spctl-dmg.txt" 2>&1
          DMG_STATUS=$?
          set -e
          cat "${RUNNER_TEMP}/spctl-dmg.txt"
          [ "$DMG_STATUS" -eq 0 ] || { echo "spctl rejected the DMG"; exit 1; }
          grep -q 'source=Notarized Developer ID' "${RUNNER_TEMP}/spctl-dmg.txt"
          xcrun stapler validate "$DMG"

      - name: Smoke-test the shipped AppImage (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          chmod +x "$APPIMAGE"

          # FUSE is usually unavailable on the runners; the AppImage runtime
          # then has to unpack itself instead of mounting.
          if ! VERSION_LINE=$("$APPIMAGE" --version 2>/dev/null); then
            echo "direct launch failed (no FUSE?), retrying with extract-and-run"
            VERSION_LINE=$(APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --appimage-extract-and-run --version)
          fi
          echo "$VERSION_LINE"
          case "$VERSION_LINE" in
            "tmuxy "*) ;;
            *) echo "unexpected --version output from the AppImage"; exit 1 ;;
          esac

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            EXPECTED="tmuxy ${GITHUB_REF_NAME#v}"
            [ "$VERSION_LINE" = "$EXPECTED" ] || {
              echo "AppImage reports '$VERSION_LINE', tag says '$EXPECTED'"; exit 1; }
          fi

      # A tmux tmuxy cannot run on ends in a dialog that says so, not in a
      # silent exit. The dialog is GTK's own; through rfd's default backend it
      # needed `zenity`, and on a machine without it (the AppImage catalog's
      # test runner) the app quit within a second with nothing on screen. So
      # zenity goes first, a stub stands in for an old tmux, and the dialog has
      # to show up under Xvfb while the app waits on it.
      - name: A too-old tmux is reported in a dialog (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          bin/ci/apt-get update
          bin/ci/apt-get install -y --no-install-recommends xvfb xdotool
          if command -v zenity >/dev/null; then sudo apt-get remove -y zenity; fi
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          SCRATCH=$(mktemp -d "${RUNNER_TEMP}/tmuxy-old-tmux.XXXXXX")
          printf '#!/bin/sh\necho "tmux 3.1c"\n' > "$SCRATCH/tmux"
          chmod +x "$SCRATCH/tmux"
          cat > "$SCRATCH/run.sh" <<'EOF'
          set -u
          HOME="$SCRATCH/home" TMUX_BIN="$SCRATCH/tmux" TMUX_SOCKET=tmuxy-old-tmux \
            APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" > "$SCRATCH/app.log" 2>&1 &
          APP=$!
          # Polls until the dialog is up or the app is gone; the deadline only
          # bounds a hang, it is not a guess at how fast the runner is.
          for _ in $(seq 1 120); do
            if xdotool search --name "tmuxy can't start" >/dev/null 2>&1; then
              echo "dialog is up"; kill "$APP"; exit 0
            fi
            kill -0 "$APP" 2>/dev/null || { echo "the app exited without showing the dialog"; cat "$SCRATCH/app.log"; exit 1; }
            sleep 1
          done
          echo "no dialog within the deadline"; cat "$SCRATCH/app.log"; kill "$APP"; exit 1
          EOF
          mkdir -p "$SCRATCH/home"
          SCRATCH="$SCRATCH" APPIMAGE="$GITHUB_WORKSPACE/$APPIMAGE" xvfb-run -a bash "$SCRATCH/run.sh"

      # A verb the CLI runs through the AppImage starts in the bundle
      # ($APPDIR/usr), not where it was called from, and every tmux client it
      # starts gets that directory: `tmuxy tab create` and `tmuxy pane float`
      # opened their pane in a mount gone once the verb exited (v0.1.5's
      # candidate). tmuxy-core moves a verb back to $OWD
      # (control_mode::leave_appimage_mount); this runs the shipped bundle's own
      # verb, the way the CLI does, from a known directory.
      - name: A tab the CLI makes opens where it was asked (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          APPIMAGE="$GITHUB_WORKSPACE/$(ls target/release/bundle/appimage/*.AppImage | head -1)"
          chmod +x "$APPIMAGE"
          SCRATCH=$(mktemp -d "${RUNNER_TEMP}/tmuxy-owd.XXXXXX")
          mkdir -p "$SCRATCH/caller" "$SCRATCH/home"
          export TMUX_SOCKET=tmuxy-owd HOME="$SCRATCH/home"
          tmux -L "$TMUX_SOCKET" new-session -d -s owd
          (cd "$SCRATCH/caller" && APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" server new-tab --json -- owd-check)
          WANT=$(cd "$SCRATCH/caller" && pwd -P)
          GOT=""
          # Polls until tmux lists the tab; the deadline only bounds a hang.
          for _ in $(seq 1 30); do
            GOT=$(tmux -L "$TMUX_SOCKET" list-panes -a -F '#{window_name} #{pane_current_path}' | sed -n 's/^owd-check //p')
            [ -n "$GOT" ] && break
            sleep 1
          done
          tmux -L "$TMUX_SOCKET" kill-server
          echo "the new tab's pane is in: ${GOT:-(no tab)}"
          [ "$GOT" = "$WANT" ] || { echo "expected $WANT"; exit 1; }

      # What the AppImage catalog's appdir-lint checks, checked here first. The
      # Tauri CLI before 2.11.3 wrote `.DirIcon` as an ABSOLUTE symlink into
      # the build runner's workspace: dangling once the image left the runner,
      # so desktops showed a generic icon and AppImageHub refused the entry
      # (AppImage/appimage.github.io#9427). Every link at the AppDir root has
      # to be relative and resolve inside the image.
      - name: Lint the AppImage's AppDir (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          WORK=$(mktemp -d "${RUNNER_TEMP}/tmuxy-appdir.XXXXXX")
          (cd "$WORK" && "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract >/dev/null)
          ROOT="$WORK/squashfs-root"
          for name in .DirIcon tmuxy.desktop tmuxy.png; do
            [ -L "$ROOT/$name" ] || [ -f "$ROOT/$name" ] || { echo "$name is missing from the AppDir"; exit 1; }
            if [ -L "$ROOT/$name" ]; then
              target=$(readlink "$ROOT/$name")
              case "$target" in
                /*) echo "$name is an absolute symlink ($target): dangling outside the build machine"; exit 1 ;;
              esac
            fi
            [ -e "$ROOT/$name" ] || { echo "$name does not resolve inside the AppDir"; exit 1; }
          done
          test -x "$ROOT/AppRun"
          grep -q '^Icon=tmuxy$' "$ROOT/tmuxy.desktop"
          echo "AppDir root: $(ls -A "$ROOT" | tr '\n' ' ')"

      # In a clean container, not on the runner: the runner already has every
      # Tauri build dependency installed, so a `Depends:` line missing from the
      # .deb cannot fail there. Here apt has to resolve the package's declared
      # dependencies on a bare debian, and the binary then has to dynamically
      # link against exactly what those pulled in.
      - name: Install the shipped .deb in a clean container (Linux amd64)
        if: matrix.platform == 'linux' && matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          ls -lh target/release/bundle/deb/
          docker run --rm -v "$PWD/target/release/bundle/deb:/w:ro" debian:bookworm \
            sh -euc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y /w/tmuxy_*_amd64.deb
              command -v tmuxy
              tmuxy --version
            ' | tee "${RUNNER_TEMP}/deb-install.txt"
          grep -q '^tmuxy ' "${RUNNER_TEMP}/deb-install.txt"

      - name: Upload AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tmuxy-linux-appimage-${{ matrix.arch }}
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload .deb
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tmuxy-linux-deb-${{ matrix.arch }}
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload .dmg
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tmuxy-macos-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # --- Upgrade path: the previous release, replaced by this build ---
  #
  # The bug class here is f1905d7 (a stopping server deleted the pid file of
  # the one that replaced it, so the replacement reported itself as not
  # running) and 722bd14 (a client that could not be served sat on
  # "Connecting…" forever). Both are cross-version: they only appear when a
  # build that is already installed and running is replaced by a new one, which
  # is exactly the sequence no other job performs.
  #
  # Runs on the daily build too, not only tags, so a regression surfaces before
  # the tag rather than at it. With no previous release published (the very first tag,
  # or a fork) the job says so and passes.
  upgrade-path:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust
        with:
          rust: none
          install-npm: 'false'

      # The AppImage is the desktop app, and it links the GUI stack even when
      # all it is asked to do is `server` — without these it dies with
      # `libEGL.so.1: cannot open shared object file` before it binds a port.
      - name: Install tmux and the runtime libraries the AppImage links
        run: |
          bin/ci/apt-get update
          bin/ci/apt-get install -y --no-install-recommends \
            tmux libwebkit2gtk-4.1-0 libgtk-3-0t64 libsoup-3.0-0 \
            libegl1 libgl1 libgbm1 libasound2t64
          tmux -V

      - name: Download the AppImage built here
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tmuxy-linux-appimage-amd64
          path: new-build

      - name: Fetch the previous release's AppImage
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
                   --json tagName,isDraft \
                   --jq '[.[] | select(.isDraft | not) | .tagName]
                         | map(select(. != env.GITHUB_REF_NAME)) | .[0] // ""')
          if [ -z "$PREV" ]; then
            echo "no previous release to upgrade from; skipping"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "previous release: $PREV"
          mkdir -p old-build
          gh release download "$PREV" --repo "$GITHUB_REPOSITORY" \
            --pattern '*amd64.AppImage' --dir old-build
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Previous release runs, new build takes over, open tab recovers
        if: steps.previous.outputs.tag != ''
        env:
          TMUX_SOCKET: tmuxy-upgrade
          # The default port (tmuxy_core::constants::DEFAULT_SERVER_PORT), as
          # a user runs it: it is the port whose pid file an older build named
          # differently, so a takeover on it is the one that proves the new
          # build finds the old server by its port.
          PORT: '9000'
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1

          OLD=$(ls old-build/*.AppImage | head -1)
          NEW=$(ls new-build/*.AppImage | head -1)
          chmod +x "$OLD" "$NEW"
          echo "old: $("$OLD" --version)"
          echo "new: $("$NEW" --version)"

          wait_for_page() {
            for _ in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${PORT}/" | grep -qi '<html'; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for_line() {
            for _ in $(seq 1 "$1"); do
              grep -q "$2" "$3" && return 0
              sleep 1
            done
            return 1
          }

          # 1. The previous release is installed and running.
          "$OLD" server --port "$PORT" > "${RUNNER_TEMP}/old-server.log" 2>&1 &
          wait_for_page || { echo "previous release never served the page"; \
            cat "${RUNNER_TEMP}/old-server.log"; exit 1; }
          "$OLD" server --port "$PORT" status | tee "${RUNNER_TEMP}/old-status.txt"
          grep -q 'Server is running' "${RUNNER_TEMP}/old-status.txt"

          # 2. A tab is open against it: hold the SSE stream the frontend
          #    holds, and record that it was delivering state before the swap.
          export SSE_LOG="${RUNNER_TEMP}/sse.log"
          : > "$SSE_LOG"
          node -e '
            const port = process.env.PORT;
            const out = require("fs").createWriteStream(process.env.SSE_LOG);
            let reconnects = 0;
            const connect = async () => {
              try {
                const res = await fetch(`http://127.0.0.1:${port}/events`);
                out.write(`open ${res.status}\n`);
                // Since 0.1.5 a stream never creates its session: the
                // frontend answers a 404 with `ensure_session` and reconnects.
                if (res.status === 404) {
                  await res.body?.cancel();
                  const created = await fetch(`http://127.0.0.1:${port}/commands`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ cmd: "ensure_session", args: {} }),
                  });
                  out.write(`ensure_session ${created.status}\n`);
                  if (created.ok) return connect();
                }
                for await (const chunk of res.body) {
                  const text = Buffer.from(chunk).toString();
                  for (const line of text.split("\n")) {
                    if (line.startsWith("event:")) out.write(line.trim() + "\n");
                  }
                }
              } catch (e) {
                out.write(`error ${e.message}\n`);
              }
              out.write("closed\n");
              // Exactly what the frontend does when the stream drops.
              if (++reconnects <= 60) setTimeout(connect, 1000);
            };
            connect();
            setTimeout(() => process.exit(0), 90000);
          ' &
          SSE_PID=$!
          wait_for_line 30 'event:[[:space:]]*connection-info' "${RUNNER_TEMP}/sse.log" \
            || { echo "the tab never got a stream from the old build"; \
                 cat "${RUNNER_TEMP}/sse.log"; exit 1; }

          # 3. The new build takes over. Started immediately, with no sleep:
          #    f1905d7 was a race between the old server's exit and the new
          #    server's pid file.
          "$NEW" server --port "$PORT" stop | tee "${RUNNER_TEMP}/stop.txt"
          grep -q 'Sent SIGTERM' "${RUNNER_TEMP}/stop.txt" \
            || { echo "the new build did not recognise the running server"; exit 1; }
          "$NEW" server --port "$PORT" > "${RUNNER_TEMP}/new-server.log" 2>&1 &
          OLD_PID=$(sed -n 's/.*pid \([0-9]*\).*/\1/p' "${RUNNER_TEMP}/old-status.txt")

          # The old server keeps the port, and keeps answering on it, until
          # its shutdown is done; the new one waits for the port meanwhile.
          # So the page proves nothing until the old process is gone.
          # Whether it goes on its own is a property of the already published
          # binary, which this branch cannot change, so it is reported and not
          # asserted. Step 6 asserts it of the new build.
          # A zombie counts as gone: the old server is a child of this shell,
          # so it stays in the table until the shell reaps it.
          for _ in $(seq 1 30); do
            OLD_STAT=$(ps -p "$OLD_PID" -o stat= 2>/dev/null | tr -d ' ' || true)
            case "${OLD_STAT:-gone}" in
              gone|Z*) break ;;
            esac
            sleep 1
          done
          case "${OLD_STAT:-gone}" in
            gone|Z*) echo "the previous release exited after the takeover" ;;
            *)
              # Releases before the graceful-shutdown fix hold their streams
              # open past SIGTERM, which keeps the tab attached to a server
              # that is no longer serving the port. Put it down so the next
              # step measures the reconnect rather than that old defect.
              echo "note: the previous release is still running ($OLD_STAT); killing it"
              kill -9 "$OLD_PID" 2>/dev/null || true
              ;;
          esac

          wait_for_page || { echo "the new build never served the page"; \
            cat "${RUNNER_TEMP}/new-server.log"; exit 1; }

          # 4. The takeover is complete: status names the NEW server, not a
          #    stale or deleted pid file (f1905d7).
          "$NEW" server --port "$PORT" status | tee "${RUNNER_TEMP}/new-status.txt"
          grep -q 'Server is running' "${RUNNER_TEMP}/new-status.txt" \
            || { echo "the replacement server reports itself as not running"; exit 1; }
          NEW_PID=$(sed -n 's/.*pid \([0-9]*\).*/\1/p' "${RUNNER_TEMP}/new-status.txt")
          [ -n "$NEW_PID" ] && [ "$OLD_PID" != "$NEW_PID" ] \
            || { echo "pid file still names the old server ($OLD_PID)"; exit 1; }

          # 5. The open tab recovers rather than hanging on "Connecting…"
          #    (722bd14).
          for _ in $(seq 1 30); do
            if [ "$(grep -c '^open 200' "${RUNNER_TEMP}/sse.log")" -ge 2 ] \
               && [ "$(grep -c 'event:[[:space:]]*connection-info' "${RUNNER_TEMP}/sse.log")" -ge 2 ]; then
              RECOVERED=1
              break
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/sse.log"
          [ "${RECOVERED:-}" = 1 ] \
            || { echo "the open tab never got a stream back from the new build"; exit 1; }

          # 6. The new build shuts down with that tab still attached. While the
          #    live stream ignored the shutdown signal, the open connection kept
          #    axum's graceful shutdown waiting and the server never exited.
          "$NEW" server --port "$PORT" stop || true
          for _ in $(seq 1 30); do
            NEW_STAT=$(ps -p "$NEW_PID" -o stat= 2>/dev/null | tr -d ' ' || true)
            case "${NEW_STAT:-gone}" in
              gone|Z*) break ;;
            esac
            sleep 1
          done
          kill $SSE_PID 2>/dev/null || true
          case "${NEW_STAT:-gone}" in
            gone|Z*) ;;
            *) echo "the new build never exited with a tab attached ($NEW_STAT)"; exit 1 ;;
          esac

      - name: Server logs (debug)
        if: failure()
        run: |
          tail -200 "${RUNNER_TEMP}/old-server.log" 2>/dev/null || true
          tail -200 "${RUNNER_TEMP}/new-server.log" 2>/dev/null || true

  release:
    needs: [build, tests, upgrade-path]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: all-artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          mkdir -p release-assets
          find all-artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) \
            -exec cp {} release-assets/ \;

          ls -lh release-assets/

          # PRE-release, deliberately. The tap is not bumped from here, so
          # nothing reaches a `brew upgrade` until a human has used the build
          # and promoted it — which is the whole point of the soak. Promote
          # with: gh release edit "$TAG" --prerelease=false --latest
          gh release create "$TAG" release-assets/* \
            --title "tmuxy $TAG" \
            --notes "Release candidate — not yet promoted to brew. Install the asset for your platform below to try it; \`brew upgrade\` still serves the last promoted build until this one is promoted." \
            --prerelease
