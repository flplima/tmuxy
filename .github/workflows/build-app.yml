name: Build App

# Tags publish. The daily run is the safety net: `desktop` in lint-and-tests
# already proves per-commit that the Linux release binary builds and launches,
# so what is left for this workflow to catch is macOS and arm64 breakage and
# the installer/bundle paths (DMG, AppImage, .deb, the upgrade path) — real
# risks, but ones a day of latency is fine for. It used to run on every push
# to main, putting a 3-platform build and notarization behind every commit.
#
# Everything that PUBLISHES (release, bump-cask, bump-formula, verify) is
# gated on a tag ref, so a scheduled run builds and smoke-tests only.
on:
  push:
    tags: ['v*']
  schedule:
    # 06:30 UTC — after the three nightlies, so they do not contend for runners.
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The full test suite, run against the TAG ref itself.
  #
  # `lint and tests` triggers on pushes to main and on pull requests, so a tag
  # push used to run nothing but this workflow: the artifacts that became a
  # release had never been tested as tagged. The release skill's CI gate checks
  # the version-bump *sha*, which is close but not the same thing and is not
  # structural — a `needs:` is.
  #
  # `workflow_call` rather than adding `push: tags` to lint-and-tests.yml: a
  # separate tag-triggered run is a different run that `release` cannot depend
  # on, so the gate would have to be a poll-and-hope step. Called as a job, the
  # dependency is enforced by Actions itself, and a red suite leaves the tag
  # with no GitHub Release and no tap bump at all.
  tests:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/lint-and-tests.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            os: ubuntu-22.04
            rust-targets: ''
            tauri-args: ''
            binary: target/release/tmuxy
          - platform: linux
            arch: arm64
            os: ubuntu-22.04-arm
            rust-targets: ''
            tauri-args: ''
            binary: target/release/tmuxy
          - platform: macos
            arch: universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: '--target universal-apple-darwin'
            binary: target/universal-apple-darwin/release/tmuxy

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    # macOS signing + notarization credentials. Read by the Tauri CLI itself
    # during `tauri build` — it imports the cert into a throwaway keychain,
    # signs the bundle with the hardened runtime, then notarizes and staples.
    #
    # Every one is OPTIONAL: with no APPLE_CERTIFICATE the CLI skips signing
    # entirely, so forks and any build made before the secrets exist still
    # produce a working (unsigned) DMG rather than failing.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      # App Store Connect API key — preferred over APPLE_ID/APPLE_PASSWORD
      # because it carries no 2FA and can be revoked on its own.
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev

      # `npm ci` (not `npm install`): the release build must use exactly the
      # locked dependency tree, not whatever the ranges resolve to today.
      - run: npm ci

      # --- Build ---

      # Notarization wants the App Store Connect key as a file, and secrets are
      # strings — so materialise it and hand the CLI its path. Skipped (with the
      # build then unsigned) whenever the key secret is absent.
      - name: Stage the notarization key (macOS)
        if: matrix.platform == 'macos' && env.APPLE_API_KEY != ''
        run: |
          KEY_DIR="$HOME/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_DIR/AuthKey_$APPLE_API_KEY.p8"
          chmod 600 "$KEY_DIR/AuthKey_$APPLE_API_KEY.p8"
          echo "APPLE_API_KEY_PATH=$KEY_DIR/AuthKey_$APPLE_API_KEY.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      - name: Build Tauri app
        run: npx tauri build ${{ matrix.tauri-args }}
        working-directory: packages/tmuxy-tauri-app

      # --- Smoke Test (Linux + macOS) ---
      # Both platforms use WebdriverIO for full GUI verification: launch app,
      # type a command, verify output appears in the terminal UI.
      # Linux: tauri-driver (WebKitGTK driver) + Xvfb
      # macOS: tauri-webdriver (embeds WebDriver in the app via plugin)

      - name: Install smoke test deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libevent-dev libncurses-dev bison webkit2gtk-driver xvfb x11-utils

      - name: Cache tauri-driver (Linux)
        if: matrix.platform == 'linux'
        id: tauri-driver-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri-driver
          key: ${{ matrix.os }}-tauri-driver-2.0.6

      - name: Install tauri-driver (Linux, cache miss)
        if: matrix.platform == 'linux' && steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.0.6 --locked --force

      # ubuntu-22.04's apt tmux is 3.2a, below the 3.3 the app refuses to
      # launch without. Same source-built 3.7a as lint-and-tests.yml, keyed
      # per runner image so the 22.04 and arm builds link their own libevent.
      - name: Cache tmux 3.7a (Linux)
        if: matrix.platform == 'linux'
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/bin/tmux
            /usr/local/share/tmux
          key: ${{ matrix.os }}-tmux-3.7a-v1

      - name: Build tmux 3.7a (Linux, cache miss)
        if: matrix.platform == 'linux' && steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/tmux/tmux/releases/download/3.7a/tmux-3.7a.tar.gz | tar xz
          cd tmux-3.7a && ./configure && make -j$(nproc) && sudo make install
          cd .. && rm -rf tmux-3.7a
          tmux -V

      - name: Install smoke test deps (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install tmux
          cargo install tauri-webdriver

      - name: Build smoke test binary (macOS)
        if: matrix.platform == 'macos'
        run: npx tauri build --debug --no-bundle --features webdriver
        working-directory: packages/tmuxy-tauri-app

      - name: Run smoke test (Linux)
        if: matrix.platform == 'linux'
        run: |
          # Start virtual display
          Xvfb :99 -screen 0 1280x720x24 -ac -nolisten tcp &
          XVFB_PID=$!
          export DISPLAY=:99

          # Wait for display
          for i in $(seq 1 20); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.25
          done

          # Start tauri-driver
          tauri-driver --port 4444 &
          DRIVER_PID=$!
          sleep 2

          # Run smoke test
          node tests/smoke/smoke-test.js "${{ matrix.binary }}"
          RESULT=$?

          # Cleanup
          kill $DRIVER_PID 2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true

          exit $RESULT

      - name: Run smoke test (macOS)
        if: matrix.platform == 'macos'
        run: |
          # Start tauri-webdriver (proxies W3C WebDriver to the embedded plugin)
          tauri-webdriver --port 4444 &
          DRIVER_PID=$!
          sleep 2

          # Run smoke test using the debug binary (has webdriver plugin)
          node tests/smoke/smoke-test.js target/debug/tmuxy
          RESULT=$?

          # Cleanup
          kill $DRIVER_PID 2>/dev/null || true

          exit $RESULT

      # Sparse-PATH regression test for the macOS Finder-launch failure.
      # Runs the *release* universal binary (which contains the production
      # PATH-augmentation code path) under launchd-style stripped env, with
      # a tmux.conf that requires a Homebrew-only binary to stay alive.
      # If gui.rs's PATH augmentation regresses, this test reconnect-storms
      # or FATALs out within seconds.
      - name: Install sparse-PATH test helper (macOS)
        if: matrix.platform == 'macos'
        run: |
          sudo tee /opt/homebrew/bin/tmuxy-stay-alive > /dev/null << 'EOF'
          #!/bin/sh
          exec sleep 36000
          EOF
          sudo chmod +x /opt/homebrew/bin/tmuxy-stay-alive

      - name: Run sparse-PATH regression test (macOS)
        if: matrix.platform == 'macos'
        run: node tests/smoke/macos-sparse-path-test.js "${{ matrix.binary }}"

      # --- Smoke-test the artifacts that actually ship ---
      #
      # Everything above runs `target/release/tmuxy` (or the debug build),
      # which is not what any user installs. These steps exercise the DMG, the
      # AppImage and the .deb themselves — the bundle layout, the bundled
      # resources and, for the .deb, its declared dependencies. They are an
      # extra layer on top of tests/smoke/smoke-test.js, not a replacement:
      # that one drives the GUI, these one prove the package is installable
      # and launchable.

      - name: Smoke-test the shipped DMG (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          DMG=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          MOUNT=$(mktemp -d "${RUNNER_TEMP}/tmuxy-dmg.XXXXXX")
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT

          APP="$MOUNT/tmuxy.app"
          BIN="$APP/Contents/MacOS/tmuxy"
          test -x "$BIN"

          # Launched out of the mounted image, exactly as a user's first run
          # does before dragging it to /Applications.
          VERSION_LINE=$("$BIN" --version)
          echo "$VERSION_LINE"
          case "$VERSION_LINE" in
            "tmuxy "*) ;;
            *) echo "unexpected --version output from the DMG"; exit 1 ;;
          esac

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            EXPECTED="tmuxy ${GITHUB_REF_NAME#v}"
            [ "$VERSION_LINE" = "$EXPECTED" ] || {
              echo "DMG reports '$VERSION_LINE', tag says '$EXPECTED'"; exit 1; }
          fi

          hdiutil detach "$MOUNT"
          trap - EXIT

      # Signing and notarization are silent no-ops when the Apple secrets are
      # absent (see the env block above), so an unsigned DMG looks identical in
      # the logs. On a tag that is a release nobody can install without the
      # Gatekeeper dialog — assert it, and fail. No continue-on-error, no
      # `|| true`: a release that cannot be verified is not a release.
      - name: Assert the DMG is signed, notarized and stapled (macOS, tags)
        if: matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          DMG=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          MOUNT=$(mktemp -d "${RUNNER_TEMP}/tmuxy-sign.XXXXXX")
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT
          APP="$MOUNT/tmuxy.app"

          echo "--- codesign ---"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # The signing identity must be a Developer ID, not an ad-hoc or
          # Apple Development cert — those verify but fail on every other Mac.
          codesign -dvv "$APP" 2>&1 | tee "${RUNNER_TEMP}/codesign-info.txt"
          grep -q 'Authority=Developer ID Application' "${RUNNER_TEMP}/codesign-info.txt"

          echo "--- spctl ---"
          set +e
          spctl -a -vvv -t exec "$APP" > "${RUNNER_TEMP}/spctl.txt" 2>&1
          SPCTL_STATUS=$?
          set -e
          cat "${RUNNER_TEMP}/spctl.txt"
          [ "$SPCTL_STATUS" -eq 0 ] || { echo "spctl rejected the app"; exit 1; }
          grep -q 'accepted' "${RUNNER_TEMP}/spctl.txt"
          grep -q 'source=Notarized Developer ID' "${RUNNER_TEMP}/spctl.txt"

          echo "--- stapler ---"
          xcrun stapler validate "$APP"

          hdiutil detach "$MOUNT"
          trap - EXIT

      - name: Smoke-test the shipped AppImage (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          chmod +x "$APPIMAGE"

          # FUSE is usually unavailable on the runners; the AppImage runtime
          # then has to unpack itself instead of mounting.
          if ! VERSION_LINE=$("$APPIMAGE" --version 2>/dev/null); then
            echo "direct launch failed (no FUSE?), retrying with extract-and-run"
            VERSION_LINE=$(APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --appimage-extract-and-run --version)
          fi
          echo "$VERSION_LINE"
          case "$VERSION_LINE" in
            "tmuxy "*) ;;
            *) echo "unexpected --version output from the AppImage"; exit 1 ;;
          esac

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            EXPECTED="tmuxy ${GITHUB_REF_NAME#v}"
            [ "$VERSION_LINE" = "$EXPECTED" ] || {
              echo "AppImage reports '$VERSION_LINE', tag says '$EXPECTED'"; exit 1; }
          fi

      # In a clean container, not on the runner: the runner already has every
      # Tauri build dependency installed, so a `Depends:` line missing from the
      # .deb cannot fail there. Here apt has to resolve the package's declared
      # dependencies on a bare debian, and the binary then has to dynamically
      # link against exactly what those pulled in.
      - name: Install the shipped .deb in a clean container (Linux amd64)
        if: matrix.platform == 'linux' && matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          ls -lh target/release/bundle/deb/
          docker run --rm -v "$PWD/target/release/bundle/deb:/w:ro" debian:bookworm \
            sh -euc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y /w/tmuxy_*_amd64.deb
              command -v tmuxy
              tmuxy --version
            ' | tee "${RUNNER_TEMP}/deb-install.txt"
          grep -q '^tmuxy ' "${RUNNER_TEMP}/deb-install.txt"

      # --- Collect & Upload Artifacts ---
      # Linux uploads .deb and .AppImage as separate artifacts

      - name: Upload AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: tmuxy-linux-appimage-${{ matrix.arch }}
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload .deb
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: tmuxy-linux-deb-${{ matrix.arch }}
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload .dmg
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: tmuxy-macos-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # --- Release (only on tag push, after all builds + smoke tests pass) ---

  # --- Upgrade path: the previous release, replaced by this build ---
  #
  # The bug class here is f1905d7 (a stopping server deleted the pid file of
  # the one that replaced it, so the replacement reported itself as not
  # running) and 722bd14 (a client that could not be served sat on
  # "Connecting…" forever). Both are cross-version: they only appear when a
  # build that is already installed and running is replaced by a new one, which
  # is exactly the sequence no other job performs.
  #
  # Runs on every push, not only tags, so a regression surfaces before the tag
  # rather than at it. With no previous release published (the very first tag,
  # or a fork) the job says so and passes.
  upgrade-path:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The AppImage is the desktop app, and it links the GUI stack even when
      # all it is asked to do is `server` — without these it dies with
      # `libEGL.so.1: cannot open shared object file` before it binds a port.
      - name: Install tmux and the runtime libraries the AppImage links
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tmux libwebkit2gtk-4.1-0 libgtk-3-0 libsoup-3.0-0 \
            libegl1 libgl1 libgbm1 libasound2t64
          tmux -V

      - name: Download the AppImage built here
        uses: actions/download-artifact@v8
        with:
          name: tmuxy-linux-appimage-amd64
          path: new-build

      - name: Fetch the previous release's AppImage
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The newest published release that is not the tag being built.
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
                   --json tagName,isDraft \
                   --jq '[.[] | select(.isDraft | not) | .tagName]
                         | map(select(. != env.GITHUB_REF_NAME)) | .[0] // ""')
          if [ -z "$PREV" ]; then
            echo "no previous release to upgrade from; skipping"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "previous release: $PREV"
          mkdir -p old-build
          gh release download "$PREV" --repo "$GITHUB_REPOSITORY" \
            --pattern '*amd64.AppImage' --dir old-build
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Previous release runs, new build takes over, open tab recovers
        if: steps.previous.outputs.tag != ''
        env:
          TMUX_SOCKET: tmuxy-upgrade
          PORT: '9123'
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1

          OLD=$(ls old-build/*.AppImage | head -1)
          NEW=$(ls new-build/*.AppImage | head -1)
          chmod +x "$OLD" "$NEW"
          echo "old: $("$OLD" --version)"
          echo "new: $("$NEW" --version)"

          wait_for_page() {
            for _ in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${PORT}/" | grep -qi '<html'; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          # $1 = how many seconds to keep looking, $2 = pattern, $3 = file.
          wait_for_line() {
            for _ in $(seq 1 "$1"); do
              grep -q "$2" "$3" && return 0
              sleep 1
            done
            return 1
          }

          # 1. The previous release is installed and running.
          "$OLD" server --port "$PORT" > "${RUNNER_TEMP}/old-server.log" 2>&1 &
          wait_for_page || { echo "previous release never served the page"; \
            cat "${RUNNER_TEMP}/old-server.log"; exit 1; }
          "$OLD" server --port "$PORT" status | tee "${RUNNER_TEMP}/old-status.txt"
          grep -q 'Server is running' "${RUNNER_TEMP}/old-status.txt"

          # 2. A tab is open against it: hold the SSE stream the frontend
          #    holds, and record that it was delivering state before the swap.
          export SSE_LOG="${RUNNER_TEMP}/sse.log"
          : > "$SSE_LOG"
          node -e '
            const port = process.env.PORT;
            const out = require("fs").createWriteStream(process.env.SSE_LOG);
            let reconnects = 0;
            const connect = async () => {
              try {
                const res = await fetch(`http://127.0.0.1:${port}/events`);
                out.write(`open ${res.status}\n`);
                for await (const chunk of res.body) {
                  const text = Buffer.from(chunk).toString();
                  for (const line of text.split("\n")) {
                    if (line.startsWith("event:")) out.write(line.trim() + "\n");
                  }
                }
              } catch (e) {
                out.write(`error ${e.message}\n`);
              }
              out.write("closed\n");
              // Exactly what the frontend does when the stream drops.
              if (++reconnects <= 60) setTimeout(connect, 1000);
            };
            connect();
            setTimeout(() => process.exit(0), 90000);
          ' &
          SSE_PID=$!
          wait_for_line 30 'event:[[:space:]]*connection-info' "${RUNNER_TEMP}/sse.log" \
            || { echo "the tab never got a stream from the old build"; \
                 cat "${RUNNER_TEMP}/sse.log"; exit 1; }

          # 3. The new build takes over: its own binary stops the running
          #    server through the pid file, then binds the same port. Started
          #    immediately, with no sleep — f1905d7 was a race between the
          #    old server's exit and the new server's pid file.
          "$NEW" server --port "$PORT" stop | tee "${RUNNER_TEMP}/stop.txt"
          grep -q 'Sent SIGTERM' "${RUNNER_TEMP}/stop.txt" \
            || { echo "the new build did not recognise the running server"; exit 1; }
          "$NEW" server --port "$PORT" > "${RUNNER_TEMP}/new-server.log" 2>&1 &
          wait_for_page || { echo "the new build never served the page"; \
            cat "${RUNNER_TEMP}/new-server.log"; exit 1; }

          # 4. The takeover is complete: status names the NEW server, not a
          #    stale or deleted pid file (f1905d7).
          "$NEW" server --port "$PORT" status | tee "${RUNNER_TEMP}/new-status.txt"
          grep -q 'Server is running' "${RUNNER_TEMP}/new-status.txt" \
            || { echo "the replacement server reports itself as not running"; exit 1; }
          OLD_PID=$(sed -n 's/.*pid \([0-9]*\).*/\1/p' "${RUNNER_TEMP}/old-status.txt")
          NEW_PID=$(sed -n 's/.*pid \([0-9]*\).*/\1/p' "${RUNNER_TEMP}/new-status.txt")
          [ -n "$NEW_PID" ] && [ "$OLD_PID" != "$NEW_PID" ] \
            || { echo "pid file still names the old server ($OLD_PID)"; exit 1; }
          # Whether the OLD process also exits is a property of the already
          # published binary, which this branch cannot change, so it is
          # reported and not asserted. Step 6 asserts it of the new build.
          # A zombie counts as gone: the old server is a child of this shell,
          # so it stays in the table until the shell reaps it.
          for _ in $(seq 1 30); do
            OLD_STAT=$(ps -p "$OLD_PID" -o stat= 2>/dev/null | tr -d ' ' || true)
            case "${OLD_STAT:-gone}" in
              gone|Z*) break ;;
            esac
            sleep 1
          done
          case "${OLD_STAT:-gone}" in
            gone|Z*) echo "the previous release exited after the takeover" ;;
            *)
              # Releases before the graceful-shutdown fix hold their streams
              # open past SIGTERM, which keeps the tab attached to a server
              # that is no longer serving the port. Put it down so the next
              # step measures the reconnect rather than that old defect.
              echo "note: the previous release is still running ($OLD_STAT); killing it"
              kill -9 "$OLD_PID" 2>/dev/null || true
              ;;
          esac

          # 5. The open tab recovers: the stream it reconnects to delivers a
          #    fresh snapshot rather than hanging on "Connecting…" (722bd14).
          for _ in $(seq 1 30); do
            if [ "$(grep -c '^open 200' "${RUNNER_TEMP}/sse.log")" -ge 2 ] \
               && [ "$(grep -c 'event:[[:space:]]*connection-info' "${RUNNER_TEMP}/sse.log")" -ge 2 ]; then
              RECOVERED=1
              break
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/sse.log"
          [ "${RECOVERED:-}" = 1 ] \
            || { echo "the open tab never got a stream back from the new build"; exit 1; }

          # 6. The new build shuts down with that tab still attached. While the
          #    live stream ignored the shutdown signal, the open connection kept
          #    axum's graceful shutdown waiting and the server never exited.
          "$NEW" server --port "$PORT" stop || true
          for _ in $(seq 1 30); do
            NEW_STAT=$(ps -p "$NEW_PID" -o stat= 2>/dev/null | tr -d ' ' || true)
            case "${NEW_STAT:-gone}" in
              gone|Z*) break ;;
            esac
            sleep 1
          done
          kill $SSE_PID 2>/dev/null || true
          case "${NEW_STAT:-gone}" in
            gone|Z*) ;;
            *) echo "the new build never exited with a tab attached ($NEW_STAT)"; exit 1 ;;
          esac

      - name: Server logs (debug)
        if: failure()
        run: |
          tail -200 "${RUNNER_TEMP}/old-server.log" 2>/dev/null || true
          tail -200 "${RUNNER_TEMP}/new-server.log" 2>/dev/null || true

  release:
    needs: [build, tests, upgrade-path]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: all-artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Flatten all platform artifacts into one directory
          mkdir -p release-assets
          find all-artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) \
            -exec cp {} release-assets/ \;

          ls -lh release-assets/

          # Create release with all assets
          gh release create "$TAG" release-assets/* \
            --title "tmuxy $TAG" \
            --notes "See the assets below to download and install tmuxy for your platform." \
            --latest

  # --- Bump Homebrew Cask (only on tag push, after release publishes) ---
  #
  # Pushes an updated Casks/tmuxy.rb to flplima/homebrew-tap so users can
  # `brew install --cask flplima/tap/tmuxy`. Brew strips the macOS quarantine
  # xattr automatically on cask install, so the unsigned DMG is usable
  # without the "tmuxy is damaged" Gatekeeper dialog. Requires
  # HOMEBREW_TAP_TOKEN secret (PAT with Contents:Write on flplima/homebrew-tap).

  bump-cask:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tmuxy-macos-dmg
          path: dmg

      - name: Compute version + sha256
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DMG=$(ls dmg/*.dmg | head -1)
          SHA=$(sha256sum "$DMG" | awk '{print $1}')
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA"       >> "$GITHUB_OUTPUT"
          echo "Bumping cask: v$VERSION sha256=$SHA from $(basename "$DMG")"

      - name: Push updated cask to flplima/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/flplima/homebrew-tap.git" tap
          cd tap
          mkdir -p Casks

          # Single-quoted heredoc so bash leaves Ruby `#{version}` and
          # `#{appdir}` interpolation untouched. Placeholders sed-replaced.
          cat > Casks/tmuxy.rb <<'CASK'
          cask "tmuxy" do
            version "__VERSION__"
            sha256 "__SHA256__"

            url "https://github.com/flplima/tmuxy/releases/download/v#{version}/tmuxy_#{version}_universal.dmg"
            name "tmuxy"
            desc "Web-based tmux interface"
            homepage "https://github.com/flplima/tmuxy"

            auto_updates false

            depends_on formula: "tmux"

            app "tmuxy.app"

            # Homebrew marks the downloaded app with Gatekeeper's quarantine
            # attribute, which puts a confirmation dialog in front of the first
            # launch. Removing it keeps that first launch frictionless.
            postflight_steps do
              run "/usr/bin/xattr",
                  args: ["-dr", "com.apple.quarantine", "{{appdir}}/tmuxy.app"],
                  must_succeed: false

              # Record the app binary path and install a CLI wrapper at
              # ~/.local/bin/tmuxy so `tmuxy pane list` etc. work immediately
              # after install, without opening the GUI first.
              write_file "~/.config/tmuxy/launcher",
                         "{{appdir}}/tmuxy.app/Contents/MacOS/tmuxy\n"

              write_file "~/.local/bin/tmuxy", <<~'WRAPPER'
                #!/bin/sh
                set -eu
                LAUNCHER_FILE="${XDG_CONFIG_HOME:-$HOME/.config}/tmuxy/launcher"
                if [ ! -f "$LAUNCHER_FILE" ]; then
                  echo 'tmuxy: no launcher recorded — open the app once first.' >&2
                  exit 1
                fi
                EXEC_PATH="$(cat "$LAUNCHER_FILE")"
                if [ "$#" -gt 0 ]; then exec "$EXEC_PATH" "$@"; fi
                APP_PATH="${EXEC_PATH%%/Contents/MacOS/*}"
                if [ "$APP_PATH" != "$EXEC_PATH" ] && [ -d "$APP_PATH" ]; then
                  exec /usr/bin/open "$APP_PATH"
                fi
                exec "$EXEC_PATH"
              WRAPPER
              set_permissions "~/.local/bin/tmuxy", "0755"
            end

            zap trash: [
              "~/.config/tmuxy",
              "~/.local/bin/tmuxy",
              "~/Library/Application Support/com.tmuxy.app",
              "~/Library/Preferences/com.tmuxy.app.plist",
              "~/Library/Saved Application State/com.tmuxy.app.savedState",
              "~/tmuxy-debug.log",
            ]
          end
          CASK

          sed -i "s/__VERSION__/${VERSION}/g" Casks/tmuxy.rb
          sed -i "s/__SHA256__/${SHA256}/g"  Casks/tmuxy.rb

          git config user.name  "tmuxy-cask-bumper[bot]"
          git config user.email "tmuxy-cask-bumper@users.noreply.github.com"
          git add Casks/tmuxy.rb

          if git diff --staged --quiet; then
            echo "Cask already at v${VERSION}; nothing to push."
          else
            git commit -m "chore: bump tmuxy to v${VERSION}"
            git push origin HEAD
          fi

  # --- Bump Homebrew Formula (only on tag push, after the cask is pushed) ---
  #
  # Homebrew casks are macOS-only; Linux Homebrew installs from formulae.
  # This pushes a Formula/tmuxy.rb to flplima/homebrew-tap so Linux users can
  # `brew install flplima/tap/tmuxy`. The formula installs the release
  # AppImage as the `tmuxy` binary. Runs after bump-cask (not in parallel) so
  # the two jobs don't race pushing to the same tap repo.

  bump-formula:
    needs: [release, bump-cask]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tmuxy-linux-appimage-amd64
          path: appimage-amd64

      - uses: actions/download-artifact@v8
        with:
          name: tmuxy-linux-appimage-arm64
          path: appimage-arm64

      - name: Compute version + sha256
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          AMD=$(ls appimage-amd64/*.AppImage | head -1)
          ARM=$(ls appimage-arm64/*.AppImage | head -1)
          SHA_AMD=$(sha256sum "$AMD" | awk '{print $1}')
          SHA_ARM=$(sha256sum "$ARM" | awk '{print $1}')
          echo "version=$VERSION"      >> "$GITHUB_OUTPUT"
          echo "sha256_amd=$SHA_AMD"   >> "$GITHUB_OUTPUT"
          echo "sha256_arm=$SHA_ARM"   >> "$GITHUB_OUTPUT"
          echo "Bumping formula: v$VERSION amd64=$SHA_AMD arm64=$SHA_ARM"

      - name: Push updated formula to flplima/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256_AMD: ${{ steps.meta.outputs.sha256_amd }}
          SHA256_ARM: ${{ steps.meta.outputs.sha256_arm }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/flplima/homebrew-tap.git" tap
          cd tap
          mkdir -p Formula

          # Single-quoted heredoc so bash leaves Ruby `#{version}` interpolation
          # untouched. Placeholders sed-replaced below.
          cat > Formula/tmuxy.rb <<'FORMULA'
          class Tmuxy < Formula
            desc "Web-based tmux interface"
            homepage "https://github.com/flplima/tmuxy"
            version "__VERSION__"

            depends_on :linux
            depends_on "tmux"

            on_arm do
              url "https://github.com/flplima/tmuxy/releases/download/v#{version}/tmuxy_#{version}_aarch64.AppImage"
              sha256 "__SHA256_ARM__"
            end

            on_intel do
              url "https://github.com/flplima/tmuxy/releases/download/v#{version}/tmuxy_#{version}_amd64.AppImage"
              sha256 "__SHA256_AMD__"
            end

            def install
              bin.install Dir["tmuxy_*.AppImage"].first => "tmuxy"
            end

            # The applications-menu entry cannot be installed from here:
            # Homebrew 6 sandboxes post_install with a read-only $HOME, and
            # Homebrew's own share/applications is not on XDG_DATA_DIRS. The
            # app registers itself on launch instead (see
            # packages/tmuxy-tauri-app/src/desktop.rs).
            def caveats
              <<~EOS
                Run `tmuxy` once to add it to your applications menu.
                Set TMUXY_NO_DESKTOP_ENTRY=1 to skip that.
              EOS
            end

            # `assert_path_exists` only proved a file landed — it would pass on
            # a truncated download, an AppImage for the wrong arch, or a build
            # that cannot start. This runs the thing: version out of the binary
            # that was installed, then the server serving its page on a free
            # port. APPIMAGE_EXTRACT_AND_RUN because `brew test` has no FUSE.
            test do
              assert_path_exists bin/"tmuxy"

              ENV["APPIMAGE_EXTRACT_AND_RUN"] = "1"
              assert_match "tmuxy #{version}", shell_output("#{bin}/tmuxy --version")

              port = free_port
              # `spawn` wants Strings; `bin/"tmuxy"` is a Pathname.
              pid = spawn((bin/"tmuxy").to_s, "server", "--port", port.to_s)
              begin
                page = nil
                20.times do
                  sleep 1
                  # `|| true` so a connection refused while the server is still
                  # binding is a retry, not an exception. The assert below is
                  # what decides the test.
                  page = shell_output("curl -fsS http://127.0.0.1:#{port}/ || true")
                  break if page.include?("<html")
                end
                assert_match "<html", page.to_s
              ensure
                Process.kill "TERM", pid
                Process.wait pid
              end
            end
          end
          FORMULA

          sed -i "s/__VERSION__/${VERSION}/g"      Formula/tmuxy.rb
          sed -i "s/__SHA256_AMD__/${SHA256_AMD}/g" Formula/tmuxy.rb
          sed -i "s/__SHA256_ARM__/${SHA256_ARM}/g" Formula/tmuxy.rb

          git config user.name  "tmuxy-cask-bumper[bot]"
          git config user.email "tmuxy-cask-bumper@users.noreply.github.com"
          git add Formula/tmuxy.rb

          if git diff --staged --quiet; then
            echo "Formula already at v${VERSION}; nothing to push."
          else
            git commit -m "chore: bump tmuxy formula to v${VERSION}"
            git push origin HEAD
          fi

  # --- Verify the published install path (only on tag push, after the bumps) ---
  #
  # Everything above verifies bytes we built. This verifies what a user gets:
  # a clean macOS runner with no tmuxy on it, installing the cask straight from
  # the tap the job above just pushed, and then running it. It is the only step
  # that exercises the whole chain — release assets reachable, cask sha256
  # matching the published DMG, the postflight wrapper landing on PATH, the app
  # launching from /Applications.
  #
  # It runs AFTER the tap is bumped, so it cannot prevent a bad cask from being
  # published — it tells you within minutes that the published one is bad,
  # which is the difference between a same-hour fix and a user bug report.
  verify-brew-cask:
    needs: [release, bump-cask, bump-formula]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Refuse to start with tmuxy already present
        run: |
          set -euo pipefail
          test ! -e /Applications/tmuxy.app
          test ! -e "$HOME/.local/bin/tmuxy"

      # The cask the bump job pushed seconds ago; brew's tap clone can serve a
      # cached ref, so fetch before installing.
      - name: Install the cask from flplima/homebrew-tap
        run: |
          set -euo pipefail
          brew tap flplima/tap
          git -C "$(brew --repository flplima/tap)" fetch --depth 1 origin HEAD
          git -C "$(brew --repository flplima/tap)" reset --hard FETCH_HEAD
          brew install --cask flplima/tap/tmuxy

      - name: The installed CLI reports the tag's version
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          command -v tmuxy
          VERSION_LINE=$(tmuxy --version)
          echo "$VERSION_LINE"
          EXPECTED="tmuxy ${GITHUB_REF_NAME#v}"
          [ "$VERSION_LINE" = "$EXPECTED" ] || {
            echo "brew installed '$VERSION_LINE', tag says '$EXPECTED'"; exit 1; }

      - name: The installed build serves its page
        env:
          PORT: '9124'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          tmuxy server --port "$PORT" > "${RUNNER_TEMP}/brew-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORT}/" | grep -qi '<html'; then
              SERVED=1
              break
            fi
            sleep 1
          done
          [ "${SERVED:-}" = 1 ] || {
            echo "the brew-installed build never served its page"
            cat "${RUNNER_TEMP}/brew-server.log"; exit 1; }
          tmuxy server --port "$PORT" status | grep -q 'Server is running'
          tmuxy server --port "$PORT" stop

      - name: Server logs (debug)
        if: failure()
        run: tail -200 "${RUNNER_TEMP}/brew-server.log" 2>/dev/null || true
