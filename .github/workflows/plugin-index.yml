name: plugin index

# The plugin index (docs/PLUGINS.md, "The index"): every public repository
# with the topic `tmuxy-plugin` whose manifests pass `tmuxy plugin check`,
# published as plugins.json on the `plugin-index` branch, where
# `tmuxy plugin search`, `tmuxy plugin install <name>` and tmuxy.sh/plugins
# read it. Committed only when something but the timestamp changed.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust
        with:
          install-npm: 'false'

      # The checker is main's: the installer that reads the index is at
      # least as strict as the one that built it. The server embeds the
      # frontend, which `plugin check` never serves, so an empty dist does.
      - name: Build the checker
        run: |
          mkdir -p packages/tmuxy-ui/dist
          cargo build --release -p tmuxy-server

      - name: Build the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          node bin/ci/plugin-index.mjs
          --tmuxy target/release/tmuxy-server
          --out "$RUNNER_TEMP/plugins.json"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Publish on the plugin-index branch
        run: |
          set -euo pipefail
          idx="$RUNNER_TEMP/idx"
          if git fetch --quiet --depth 1 origin plugin-index; then
            git worktree add --quiet --detach "$idx" FETCH_HEAD
            old=$(jq -S 'del(.generated)' "$idx/plugins.json" 2>/dev/null || echo null)
          else
            git worktree add --quiet --detach "$idx"
            git -C "$idx" switch --quiet --orphan plugin-index
            git -C "$idx" rm -rfq --ignore-unmatch .
            old=null
          fi
          new=$(jq -S 'del(.generated)' "$RUNNER_TEMP/plugins.json")
          if [ "$old" = "$new" ]; then
            echo "The index is unchanged."
            exit 0
          fi
          cp "$RUNNER_TEMP/plugins.json" "$idx/plugins.json"
          git -C "$idx" add plugins.json
          git -C "$idx" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m 'Update the plugin index'
          git -C "$idx" push --quiet origin HEAD:refs/heads/plugin-index
