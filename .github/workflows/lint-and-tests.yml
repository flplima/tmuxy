name: lint and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No job here writes to the repository: nothing uses GITHUB_TOKEN, and
# uploading an artifact does not need write access to the contents.
permissions:
  contents: read

# Supersede an in-flight run only when a new commit lands on the SAME pull
# request. Pushes to main (and anything else) get a group keyed by run_id,
# which is unique per run, so they can never cancel each other — every commit
# that lands on main keeps its own complete, uncancelled result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # tmuxy-wasm only compiles for wasm32; clippy on it needs the target.
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      # --- Formatting ---

      - name: Prettier check
        run: npx prettier --check src
        working-directory: packages/tmuxy-ui

      # `npm run format` already rewrites these; without a check nothing
      # enforced it, so test files drifted out of Prettier's shape silently.
      - name: Prettier check (tests)
        run: npx prettier --check 'tests/**/*.js'

      - name: Rust format check
        run: |
          cargo fmt --check -p tmuxy-core -p tmuxy-server -p tmuxy-tauri-app \
            -p tmuxy-tree -p tmuxy-connect -p tmuxy-wasm

      # --- Linting ---

      - name: ESLint
        run: npm run lint -w tmuxy-ui

      - name: ESLint (E2E tests)
        run: npm run lint:tests

      - name: Clippy
        run: |
          mkdir -p packages/tmuxy-ui/dist
          cargo clippy -p tmuxy-core -p tmuxy-server -p tmuxy-tauri-app \
            -p tmuxy-tree -p tmuxy-connect -- -D warnings

      # tmuxy-wasm has no host build: same target and feature set as the
      # `build:wasm` script, so clippy sees the code as it actually ships.
      - name: Clippy (tmuxy-wasm)
        run: |
          cargo clippy -p tmuxy-wasm --target wasm32-unknown-unknown \
            --no-default-features -- -D warnings

      # --- Type Check ---

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: packages/tmuxy-ui

  # The frontend bundle and the release server, built ONCE and handed to every
  # job that needs them. Both used to be rebuilt inside each of the e2e matrix
  # entries and the latency job — the same two builds a dozen times over, for
  # the largest share of this workflow's runner minutes.
  #
  # Every consumer runs on ubuntu-latest, so one linux-x86_64 binary serves
  # them all. Artifacts do not carry the executable bit; consumers chmod it.
  build-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w tmuxy-ui

      - name: Build server (release)
        run: cargo build --release -p tmuxy-server

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: packages/tmuxy-ui/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload server binary
        uses: actions/upload-artifact@v7
        with:
          name: tmuxy-server-release
          path: target/release/tmuxy-server
          if-no-files-found: error
          retention-days: 1

  # The demo site was only ever built by deploy-demo.yml, post-merge and
  # path-filtered — so a demo break landed on main before anyone saw it.
  demo-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build demo
        run: npm run build -w tmuxy-demo

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Vitest
        run: npm test -- --run

  # macOS is the primary user platform, and every test job above runs on Linux
  # only — a macOS-only bug (feab950) reached a release because nothing on CI
  # ever executed this code on a Mac. Same three cheap suites, one runner.
  macos-tests:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      # The three tmuxy-core integration tests drive a real `tmux -CC`.
      # Homebrew's tmux, not a source build: this job exists to catch macOS
      # platform differences, and brew's is what macOS users actually run.
      - name: Install tmux
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          tmux -V

      - name: Install npm dependencies
        run: npm ci

      - name: Vitest
        run: npm test -- --run

      - name: CLI suite
        run: npm run test:cli

      # The tauri crate's build script expects a frontend dist to exist.
      - name: Frontend dist placeholder
        run: mkdir -p packages/tmuxy-ui/dist

      - name: Cargo test
        run: cargo test --workspace

  # Rust unit + integration tests across the workspace. Previously nothing ran
  # `cargo test` in CI, so every `#[cfg(test)]` module went unexecuted.
  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libevent-dev libncurses-dev bison \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev

      # initial_state.rs, reply_channel.rs and pinned_split_race.rs drive a
      # real `tmux -CC`, so this job was testing against whatever tmux the
      # runner image happened to ship. Same source-built, cache-shared 3.7a
      # the e2e/latency/tauri jobs pin — one cache entry serves all of them.
      - name: Cache tmux 3.7a
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/bin/tmux
            /usr/local/share/tmux
          key: ${{ runner.os }}-tmux-3.7a-v1

      - name: Build tmux 3.7a (cache miss)
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/tmux/tmux/releases/download/3.7a/tmux-3.7a.tar.gz | tar xz
          cd tmux-3.7a && ./configure && make -j$(nproc) && sudo make install
          cd .. && rm -rf tmux-3.7a

      - name: Confirm tmux version
        run: tmux -V

      # Clippy/build for the tauri crate expects the frontend dist to exist.
      - name: Frontend dist placeholder
        run: mkdir -p packages/tmuxy-ui/dist

      - name: Cargo test
        run: cargo test --workspace

  # CLI dispatcher suite — hermetic (mocked tmux), enforces tmux-socket
  # isolation. It has its own jest config and was referenced by no workflow.
  cli-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: CLI suite
        run: npm run test:cli

  # E2E + snapshot suites run in parallel — one matrix entry per suite,
  # one runner per suite. Previously these were serial inside a single
  # job (~10 min total); matrix puts walltime at max-of-suites.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-artifacts
    strategy:
      fail-fast: false
      matrix:
        # `filter` (jest -t) splits one oversized file across two runners.
        # 2-layout is 3,181 lines / 22 flows and the longest suite here once
        # the v86 job stops being the critical path. jest's own --shard only
        # divides at FILE granularity, so it cannot split a single file;
        # a name filter on the top-level `Scenario N:` describes can.
        # The second half is a negative lookahead on the first, so a newly
        # added scenario always lands in a shard instead of silently
        # running nowhere.
        suite:
          - { name: snapshots, path: 'tests/snapshots/' }
          - { name: '1-input', path: 'tests/1-input-interaction.test.js' }
          - name: '2-layout-a'
            path: 'tests/2-layout-navigation.test.js'
            filter: '^Scenario (4|4b|4c|4d|4e|4f|4g|5|6|6b|6c):'
          - name: '2-layout-b'
            path: 'tests/2-layout-navigation.test.js'
            filter: '^Scenario (?!(4|4b|4c|4d|4e|4f|4g|5|6|6b|6c):)'
          - { name: '3-rendering', path: 'tests/3-rendering-protocols.test.js' }
          - { name: '4-session', path: 'tests/4-session-connectivity.test.js' }
          - { name: '5-stress', path: 'tests/5-stress-stability.test.js' }
          - { name: '6-nvim', path: 'tests/6-nvim-performance.test.js' }
          - { name: '7-regression', path: 'tests/7-regression-bugs.test.js' }
          - { name: '8-tui', path: 'tests/8-tui-alternate-screen.test.js' }
          - { name: '10-read-only', path: 'tests/10-read-only.test.js' }
          # WebKit is the only proxy CI has for WKWebView, where the selection
          # and focus bugs escaped. It needs its own browser download, so only
          # this entry pays for it.
          - { name: '11-webkit', path: 'tests/11-webkit.test.js', webkit: true }
          - { name: '12-touch', path: 'tests/12-touch.test.js' }
    name: e2e (${{ matrix.suite.name }})

    # The suite's own tmux socket, for the server started below as much as for
    # the tests: the two are the halves of every round trip, so a server on a
    # different socket makes every test fail at "session not found". Matches
    # DEFAULT_SOCKET in tests/helpers/tmux-socket.js — the tests pin it
    # themselves, this is what puts the server on it too.
    env:
      TMUX_SOCKET: tmuxy-test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # No Rust toolchain here any more: the release server arrives as an
      # artifact from `build-artifacts`, and nothing else in this job compiles.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libevent-dev libncurses-dev bison fzf neovim

      # Cache the tmux binary so we don't recompile from source every run.
      # Build cost is ~30-60s; cache restore is ~2s. 3.7a matches the
      # devcontainer and the v86 guest — docs/TMUX.md targets it everywhere.
      - name: Cache tmux 3.7a
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/bin/tmux
            /usr/local/share/tmux
          key: ${{ runner.os }}-tmux-3.7a-v1

      - name: Build tmux 3.7a (cache miss)
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/tmux/tmux/releases/download/3.7a/tmux-3.7a.tar.gz | tar xz
          cd tmux-3.7a && ./configure && make -j$(nproc) && sudo make install
          cd .. && rm -rf tmux-3.7a

      - name: Confirm tmux version
        run: tmux -V

      - name: Install npm dependencies
        run: npm ci

      # The browser download is ~130MB and identical every run; only the apt
      # side of `--with-deps` still has to happen on a hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      # Only the WebKit suite; every other entry would pay the download for a
      # browser it never launches.
      - name: Install WebKit
        if: matrix.suite.webkit
        run: npx playwright install webkit --with-deps

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: packages/tmuxy-ui/dist

      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: tmuxy-server-release
          path: target/release

      # Artifacts do not preserve the executable bit.
      - name: Make the server executable
        run: chmod +x target/release/tmuxy-server

      # Put the `tmuxy` CLI on PATH so panes spawned by the server (e.g. the
      # sidebar's `tmuxy tree` TUI) resolve it — mirrors brew/AppImage installs.
      - name: Link tmuxy CLI onto PATH
        run: sudo ln -sf "$GITHUB_WORKSPACE/bin/tmuxy-cli" /usr/local/bin/tmuxy

      - name: Start server
        run: |
          ./target/release/tmuxy-server 2>/tmp/tmuxy-server.log &
          node -e "
            const start = Date.now();
            const timeout = 30000;
            const check = async () => {
              while (Date.now() - start < timeout) {
                try {
                  const res = await fetch('http://localhost:9000');
                  if (res.ok) { process.exit(0); }
                } catch {}
                await new Promise(r => setTimeout(r, 500));
              }
              process.exit(1);
            };
            check();
          "

      # No --forceExit: it masked leaked handles by killing the process before
      # jest could report them.
      - name: Run ${{ matrix.suite.name }}
        run: npx jest ${{ matrix.suite.path }} ${{ matrix.suite.filter && format('--testNamePattern={0}', toJSON(matrix.suite.filter)) || '' }}

      - name: Server logs (debug)
        if: failure()
        run: cat /tmp/tmuxy-server.log | tail -2000

  # Interaction latency. Drives the handful of things a user does constantly
  # (type, move between panes, split, zoom, switch tab) through the real
  # keyboard path and records how long each takes to become visible.
  #
  # The gate is the RATIO of each interaction to the keystroke round trip
  # measured in the same run — a loaded runner inflates both, so the ratio is
  # what survives GitHub's noise. The raw milliseconds are uploaded as an
  # artifact and diffed against the committed per-platform baseline for trend
  # only; they never fail the build. See docs/PERFORMANCE.md.
  interaction-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-artifacts

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libevent-dev libncurses-dev bison

      # Same tmux the e2e job pins — the binding set and the run-shell cost
      # this harness measures are version-sensitive.
      - name: Cache tmux 3.7a
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/bin/tmux
            /usr/local/share/tmux
          key: ${{ runner.os }}-tmux-3.7a-v1

      - name: Build tmux 3.7a (cache miss)
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/tmux/tmux/releases/download/3.7a/tmux-3.7a.tar.gz | tar xz
          cd tmux-3.7a && ./configure && make -j$(nproc) && sudo make install
          cd .. && rm -rf tmux-3.7a

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: packages/tmuxy-ui/dist

      # Release, not debug: a debug server's own slowness would swamp the
      # differences between interactions this harness exists to see. Built
      # once in `build-artifacts` with the same release profile.
      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: tmuxy-server-release
          path: target/release

      - name: Make the server executable
        run: chmod +x target/release/tmuxy-server

      - name: Link tmuxy CLI onto PATH
        run: sudo ln -sf "$GITHUB_WORKSPACE/bin/tmuxy-cli" /usr/local/bin/tmuxy

      - name: Start server
        run: |
          ./target/release/tmuxy-server 2>/tmp/tmuxy-server.log &
          node -e "
            const start = Date.now();
            const check = async () => {
              while (Date.now() - start < 30000) {
                try {
                  const res = await fetch('http://localhost:9000');
                  if (res.ok) process.exit(0);
                } catch {}
                await new Promise(r => setTimeout(r, 500));
              }
              process.exit(1);
            };
            check();
          "

      - name: Measure interactions
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run perf:interactions -- \
            --url http://localhost:9000 \
            --samples 12 \
            --label ci \
            --out perf/interaction-report.json

      - name: Compare against budgets and baseline
        run: npm run perf:compare -- --report perf/interaction-report.json

      - name: Upload interaction report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interaction-latency-${{ github.sha }}
          path: perf/interaction-report.json

      - name: Server logs (debug)
        if: failure()
        run: tail -2000 /tmp/tmuxy-server.log

  # Tauri E2E runs as its own parallel job. Previously chained after the
  # E2E suite, adding ~3 min to the critical path. Still builds a debug
  # Tauri binary (different profile from build-app's release), but no
  # longer sits on the longest job.
  tauri-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libevent-dev libncurses-dev bison \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            webkit2gtk-driver xvfb x11-utils

      # Match the `e2e` job's tmux version (3.7a — the devcontainer / v86
      # guest / docs/TMUX.md target). Ubuntu's apt ships tmux 3.4, which has a
      # race where the initial auto-adopt of `@tmuxy-window-type=tab` gets
      # clobbered by an in-flight list-windows response under the load the
      # Ctx/Tower Tauri path puts on the CC stream at startup.
      - name: Cache tmux 3.7a
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/bin/tmux
            /usr/local/share/tmux
          key: ${{ runner.os }}-tmux-3.7a-v1

      - name: Build tmux 3.7a (cache miss)
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/tmux/tmux/releases/download/3.7a/tmux-3.7a.tar.gz | tar xz
          cd tmux-3.7a && ./configure && make -j$(nproc) && sudo make install
          cd .. && rm -rf tmux-3.7a

      - name: Confirm tmux version
        run: tmux -V

      # `cargo install tauri-driver` compiles from source on every run
      # (~2 min). Pinned so the cache key describes exactly what is in it.
      - name: Cache tauri-driver
        id: tauri-driver-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri-driver
          key: ${{ runner.os }}-tauri-driver-2.0.6

      - name: Install tauri-driver (cache miss)
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (debug)
        run: npx tauri build --debug --no-bundle
        working-directory: packages/tmuxy-tauri-app

      - name: Tauri E2E tests
        run: npm run test:tauri

  # Storybook probes. Both jobs drive stories in a real Chromium against a
  # `storybook dev` server — dev (not static) on purpose: no build step, and
  # stories compile on demand.
  storybook-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      # The v86 staticDirs point at gitignored dirs; non-v86 stories never
      # fetch from them, but Storybook refuses to start if they're missing.
      - name: Create placeholder v86 asset dirs
        run: mkdir -p packages/tmuxy-ui/v86-assets packages/tmuxy-wasm/pkg

      - name: Start Storybook (dev server)
        run: |
          npm run storybook -w tmuxy-ui -- --ci --quiet 2>/tmp/storybook.log &
          node -e "
            const start = Date.now();
            const check = async () => {
              while (Date.now() - start < 180000) {
                try {
                  const res = await fetch('http://localhost:6006/index.json');
                  if (res.ok) process.exit(0);
                } catch {}
                await new Promise(r => setTimeout(r, 1000));
              }
              process.exit(1);
            };
            check();
          "

      - name: Probe deterministic stories
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run test-storybook -w tmuxy-ui

      # A screenshot, a DOM dump and the real stack for every story that
      # failed — the probe used to report only `playFunctionThrewException`,
      # which nobody could act on.
      - name: Probe failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-probe-artifacts
          path: packages/tmuxy-ui/probe-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Storybook logs (debug)
        if: failure()
        run: tail -200 /tmp/storybook.log

  storybook-v86-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the blocking GATE (three optimistic-UX stories the pane-stability
    # review promoted once the correlation fixes proved stable) runs per
    # commit. The full ~110-story sweep used to run here too, behind a
    # step-level continue-on-error — 20 minutes on the critical path producing
    # a result nobody was obliged to read. It moved to nightly-v86.yml, where
    # a failure opens an issue and the per-story timings are kept.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32 for tmuxy-wasm; i686-musl for the guest tmuxy-tree binary
          # that build-v86-snapshot.mjs cross-compiles on a cache miss.
          targets: wasm32-unknown-unknown,i686-unknown-linux-musl

      - uses: swatinem/rust-cache@v2

      # The CLI and the crate must agree EXACTLY on the bindgen schema, so the
      # version is read from the lockfile rather than written here. A hand-kept
      # pin drifts the moment anything runs `cargo update`, and the failure is
      # a schema-mismatch error a long way from the change that caused it.
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{f=1; next} f && /^version = /{gsub(/["]/,""); sub(/version = /,""); print; exit}' Cargo.lock)
          test -n "$version" || { echo "no wasm-bindgen in Cargo.lock"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build tmuxy-wasm
        run: npm run build:wasm

      # The guest kernel/BIOS + pre-booted machine snapshot. Rebuilt only when
      # the build scripts or the baked-in tmuxy CLI/config change.
      - name: Cache v86 guest assets
        id: v86-assets-cache
        uses: actions/cache@v6
        with:
          path: packages/tmuxy-ui/v86-assets
          key: ${{ runner.os }}-v86-assets-${{ hashFiles('packages/tmuxy-ui/scripts/build-v86-snapshot.mjs', 'packages/tmuxy-ui/scripts/fetch-v86-image.mjs', 'bin/tmuxy-cli', 'bin/tmuxy/**') }}

      - name: Build v86 guest assets (cache miss)
        if: steps.v86-assets-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd
          npm run fetch:v86-image -w tmuxy-ui
          npm run build:v86-snapshot -w tmuxy-ui

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Start Storybook (dev server)
        run: |
          npm run storybook -w tmuxy-ui -- --ci --quiet 2>/tmp/storybook.log &
          node -e "
            const start = Date.now();
            const check = async () => {
              while (Date.now() - start < 180000) {
                try {
                  const res = await fetch('http://localhost:6006/index.json');
                  if (res.ok) process.exit(0);
                } catch {}
                await new Promise(r => setTimeout(r, 1000));
              }
              process.exit(1);
            };
            check();
          "

      - name: Gate stories (blocking)
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run test-storybook:v86 -w tmuxy-ui -- 6006 split-optimistic-timeline split-rejected-rollback resize-pane-drag

      # A screenshot, a DOM dump and the real stack for every story that
      # failed — the probe used to report only `playFunctionThrewException`,
      # which nobody could act on.
      - name: Probe failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-v86-probe-artifacts
          path: packages/tmuxy-ui/probe-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Storybook logs (debug)
        if: failure()
        run: tail -200 /tmp/storybook.log

  # Dependency audits, scoped to what ships: production npm dependencies
  # (dev tooling — Storybook, Puppeteer, wdio — is audited by Dependabot but
  # would keep this job permanently red) and the Rust workspace, with the
  # policy and its reasons in .cargo/audit.toml.
  # The packaged desktop app used to be exercised only by build-app.yml, which
  # never runs on a pull request — so a launch-environment regression (6 of the
  # last 8 Build App failures, 5 of them on dependabot Tauri bumps) was found
  # only after it had already landed on main. This runs the same Linux smoke
  # test against a release --no-bundle build, per commit and per PR.
  desktop-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libevent-dev libncurses-dev bison \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            webkit2gtk-driver xvfb x11-utils

      # The app refuses to launch below tmux 3.3; apt's is older on some
      # images. Same source-built 3.7a and cache key as every other job.
      - name: Cache tmux 3.7a
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/bin/tmux
            /usr/local/share/tmux
          key: ${{ runner.os }}-tmux-3.7a-v1

      - name: Build tmux 3.7a (cache miss)
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/tmux/tmux/releases/download/3.7a/tmux-3.7a.tar.gz | tar xz
          cd tmux-3.7a && ./configure && make -j$(nproc) && sudo make install
          cd .. && rm -rf tmux-3.7a

      - name: Confirm tmux version
        run: tmux -V

      - name: Cache tauri-driver
        id: tauri-driver-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri-driver
          key: ${{ runner.os }}-tauri-driver-2.0.6

      - name: Install tauri-driver (cache miss)
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Install npm dependencies
        run: npm ci

      # Release profile like build-app.yml (that is the binary users launch),
      # but without the bundlers — the smoke test runs the raw executable.
      - name: Build Tauri app (release)
        run: npx tauri build --no-bundle
        working-directory: packages/tmuxy-tauri-app

      - name: Run smoke test
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac -nolisten tcp &
          XVFB_PID=$!
          export DISPLAY=:99

          for i in $(seq 1 20); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.25
          done

          tauri-driver --port 4444 &
          DRIVER_PID=$!
          sleep 2

          node tests/smoke/smoke-test.js target/release/tmuxy
          RESULT=$?

          kill $DRIVER_PID 2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true

          exit $RESULT

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit
