name: lint and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable as a job, so another workflow can make a real `needs:` dependency
  # on this suite. `Build App` calls it on the TAG ref: the artifacts that
  # become a release are then gated on the same tests, for the same ref —
  # every test, including the [nightly] tier a push skips (docs/TESTS.md
  # § Tiers).
  workflow_call:
    inputs:
      e2e-tier:
        description: "'commit' skips the [nightly] E2E tier; 'full' runs everything"
        type: string
        default: commit

# No job here writes to the repository: nothing uses GITHUB_TOKEN, and
# uploading an artifact does not need write access to the contents.
permissions:
  contents: read

# Supersede an in-flight run only when a new commit lands on the SAME pull
# request. Pushes to main (and anything else) get a group keyed by run_id,
# which is unique per run, so they can never cancel each other — every commit
# that lands on main keeps its own complete, uncancelled result.
#
# A `workflow_call` run inherits the CALLER's event and run_id, so a tag build
# lands in the run_id branch too: unique per run, never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/ci-lint.yml

  # The frontend bundle and the test server, each built ONCE and handed to
  # every job that needs them. They used to be rebuilt inside each of the e2e
  # matrix entries — the same two builds a dozen times over, for the largest
  # share of this workflow's runner minutes.
  #
  # Two jobs so the desktop job, which only needs the dist, starts as soon as
  # the frontend is built rather than after the server too. The server job
  # still waits for the dist: the server embeds it at compile time
  # (rust-embed in tmuxy-server/src/server.rs), and the E2E suites hit the
  # embedded copy.
  #
  # Every consumer runs on ubuntu-latest, so one linux-x86_64 binary serves
  # them all. Artifacts do not carry the executable bit; consumers chmod it.
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w tmuxy-ui

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: packages/tmuxy-ui/dist
          if-no-files-found: error
          retention-days: 1

  # The `ci` profile (Cargo.toml): release optimisation without the fat-LTO,
  # single-codegen-unit link that is most of the release build's minute and
  # that no functional test can tell apart. The artifact keeps the
  # `target/release/` path its consumers expect.
  build-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-frontend

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: packages/tmuxy-ui/dist

      - name: Build server (ci profile)
        run: cargo build --profile ci -p tmuxy-server

      - name: Upload server binary
        uses: actions/upload-artifact@v7
        with:
          name: tmuxy-server-release
          path: target/ci/tmuxy-server
          if-no-files-found: error
          retention-days: 1

  node-checks:
    uses: ./.github/workflows/ci-node-checks.yml

  # macOS is the primary user platform, and every test job above runs on Linux
  # only — a macOS-only bug (feab950) reached a release because nothing on CI
  # ever executed this code on a Mac.
  #
  # Only the platform-SENSITIVE suites: the CLI (shell, paths, PATH lookup) and
  # cargo test (a real `tmux -CC` against Homebrew's tmux). Vitest ran here too
  # and was dropped — it is pure JS logic with no platform surface, already
  # covered by `node-checks / unit-tests`.
  macos-tests:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      # The five tmuxy-core integration tests drive a real `tmux -CC`.
      # Homebrew's tmux, not a source build: this job exists to catch macOS
      # platform differences, and brew's is what macOS users actually run.
      - name: Install tmux
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          tmux -V

      - name: Install npm dependencies
        run: npm ci

      - name: CLI suite
        run: npm run test:cli

      # The tauri crate's build script expects a frontend dist to exist.
      - name: Frontend dist placeholder
        run: mkdir -p packages/tmuxy-ui/dist

      - name: Cargo test
        run: cargo test --workspace

  rust-tests:
    uses: ./.github/workflows/ci-rust-tests.yml

  # The E2E matrix for this run's tier, from tests/e2e-suites.json: on a push
  # the suites a [nightly] test does not fill, each with a jest name pattern
  # that skips the tagged tests; on a tag build (`e2e-tier: full`) every suite
  # and every test. A tiny job of its own so the list is data a script can
  # test, and so the list and the patterns are composed in one place
  # (bin/e2e-plan.mjs) rather than once per matrix entry here.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: echo "suites=$(node bin/e2e-plan.mjs '${{ inputs.e2e-tier || 'commit' }}')" >> "$GITHUB_OUTPUT"

  # E2E + snapshot suites run in parallel — one matrix entry per suite,
  # one runner per suite. Previously these were serial inside a single
  # job (~10 min total); matrix puts walltime at max-of-suites.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan, build-server]
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    name: e2e (${{ matrix.suite.name }})

    # The suite's own tmux socket, for the server started below as much as for
    # the tests: the two are the halves of every round trip, so a server on a
    # different socket makes every test fail at "session not found". Matches
    # DEFAULT_SOCKET in tests/helpers/tmux-socket.js — the tests pin it
    # themselves, this is what puts the server on it too.
    env:
      TMUX_SOCKET: tmuxy-test
      # And the suite's own port, for the same reason — matches DEFAULT_PORT in
      # tests/helpers/config.js, which is where the tests look for the server.
      TMUXY_PORT: 9100
      # The shared server neither saves nor rebuilds sessions (see tmuxEnv in
      # tests/helpers/tmux-socket.js): a session re-made under a name a test
      # used before must come up empty. The snapshot suite starts a server of
      # its own with both cleared.
      TMUXY_NO_SNAPSHOT: '1'
      TMUXY_NO_RESTORE: '1'
      # The server log is printed when a shard fails. Each client's size is
      # what decides a pane's size, and a pane too small to show a prompt
      # looks exactly like a shell that never started.
      RUST_LOG: 'info,tmuxy_server::sse=debug'
      # The server's action trace (docs/TELEMETRY.md), with a marker at each
      # test's start and end (tests/helpers/trace-environment.js). Read by the
      # health check below on every job, uploaded when a shard fails.
      TMUXY_E2E_TRACE: /tmp/tmuxy-e2e-trace.ndjson

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # No Rust toolchain here any more: the release server arrives as an
      # artifact from `build-server`, and nothing else in this job compiles.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libevent-dev libncurses-dev bison fzf neovim

      - uses: ./.github/actions/install-tmux

      - name: Install npm dependencies
        run: npm ci

      - uses: ./.github/actions/install-chromium

      # Only the WebKit suite; every other entry would pay the download for a
      # browser it never launches.
      - name: Install WebKit
        if: matrix.suite.webkit
        run: npx playwright install webkit --with-deps

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: packages/tmuxy-ui/dist

      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: tmuxy-server-release
          path: target/release

      # Artifacts do not preserve the executable bit.
      - name: Make the server executable
        run: chmod +x target/release/tmuxy-server

      # Put the `tmuxy` CLI on PATH so panes spawned by the server (e.g. the
      # sidebar's `tmuxy tree` TUI) resolve it — mirrors brew/AppImage installs.
      - name: Link tmuxy CLI onto PATH
        run: sudo ln -sf "$GITHUB_WORKSPACE/bin/tmuxy-cli" /usr/local/bin/tmuxy

      - name: Start server
        run: |
          TMUXY_TRACE_LEVEL=labeled ./target/release/tmuxy-server --port "$TMUXY_PORT" \
            --trace "$TMUXY_E2E_TRACE" 2>/tmp/tmuxy-server.log &
          bin/wait-for-server "http://localhost:$TMUXY_PORT"

      # No --forceExit: it masked leaked handles by killing the process before
      # jest could report them.
      - name: Run ${{ matrix.suite.name }}
        env:
          SUITE_PATH: ${{ matrix.suite.path }}
          # The tier's lookahead plus this suite's shard filter, composed by
          # bin/e2e-plan.mjs; empty when every test in the file is wanted.
          SUITE_PATTERN: ${{ matrix.suite.pattern }}
        run: |
          set -o pipefail
          npx jest "$SUITE_PATH" ${SUITE_PATTERN:+--testNamePattern "$SUITE_PATTERN"} 2>&1 | tee /tmp/jest-output.log

      # On every job, passing or not: a pane that never spoke is a fault even
      # in a test that never waited on it, and a shard that went green on a
      # re-run still had it. Findings are warnings on the run, not failures.
      - name: Trace health check
        if: always()
        run: ./target/release/tmuxy-server trace --check --github "$TMUXY_E2E_TRACE" || true

      - name: Server logs (debug)
        if: failure()
        run: cat /tmp/tmuxy-server.log | tail -2000

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.suite.name }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/tmuxy-e2e-trace.ndjson
            /tmp/tmuxy-server.log
            /tmp/jest-output.log
          retention-days: 14
          if-no-files-found: ignore

  # Interaction latency. Drives the handful of things a user does constantly
  # (type, move between panes, split, zoom, switch tab) through the real
  # keyboard path and records how long each takes to become visible.
  #
  # The gate is the RATIO of each interaction to the keystroke round trip
  # measured in the same run — a loaded runner inflates both, so the ratio is
  # what survives GitHub's noise. The raw milliseconds are uploaded as an
  # artifact and diffed against the committed per-platform baseline for trend
  # only; they never fail the build. See docs/PERFORMANCE.md.
  # Storybook probes. Both jobs drive stories in a real Chromium against a
  # `storybook dev` server — dev (not static) on purpose: no build step, and
  # stories compile on demand.
  storybook-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - uses: ./.github/actions/install-chromium

      # The v86 staticDirs point at gitignored dirs; non-v86 stories never
      # fetch from them, but Storybook refuses to start if they're missing.
      - name: Create placeholder v86 asset dirs
        run: mkdir -p packages/tmuxy-ui/v86-assets packages/tmuxy-wasm/pkg

      - name: Start Storybook (dev server)
        run: |
          npm run storybook -w tmuxy-ui -- --ci --quiet 2>/tmp/storybook.log &
          bin/wait-for-server http://localhost:6006/index.json 180000

      # The per-commit tier: stories tagged `nightly` (frame-sampled
      # animations, render-count budgets, language sweeps) run in the nightly
      # v86 workflow's deterministic job instead, which also runs the axe
      # accessibility pass over every story. Skipped here because it was a
      # third of the job's time and, with every blocking rule quarantined,
      # gated nothing a commit could fail on.
      - name: Probe deterministic stories
        env:
          PROBE_TIER: commit
          PROBE_A11Y: '0'
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run test-storybook -w tmuxy-ui

      # A screenshot, a DOM dump and the real stack for every story that
      # failed — the probe used to report only `playFunctionThrewException`,
      # which nobody could act on.
      - name: Probe failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-probe-artifacts
          path: packages/tmuxy-ui/probe-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Storybook logs (debug)
        if: failure()
        run: tail -200 /tmp/storybook.log

  storybook-v86-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the blocking GATE (three optimistic-UX stories the pane-stability
    # review promoted once the correlation fixes proved stable) runs per
    # commit. The full ~110-story sweep used to run here too, behind a
    # step-level continue-on-error — 20 minutes on the critical path producing
    # a result nobody was obliged to read. It moved to nightly-v86.yml, where
    # a failure opens an issue and the per-story timings are kept.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32 for tmuxy-wasm; i686-musl for the guest tmuxy-tree binary
          # that build-v86-snapshot.mjs cross-compiles on a cache miss.
          targets: wasm32-unknown-unknown,i686-unknown-linux-musl

      - uses: swatinem/rust-cache@v2

      # The CLI and the crate must agree EXACTLY on the bindgen schema, so the
      # version is read from the lockfile rather than written here. A hand-kept
      # pin drifts the moment anything runs `cargo update`, and the failure is
      # a schema-mismatch error a long way from the change that caused it.
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{f=1; next} f && /^version = /{gsub(/["]/,""); sub(/version = /,""); print; exit}' Cargo.lock)
          test -n "$version" || { echo "no wasm-bindgen in Cargo.lock"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build tmuxy-wasm
        run: npm run build:wasm

      # The guest kernel/BIOS + pre-booted machine snapshot. Rebuilt only when
      # the build scripts or the baked-in tmuxy CLI/config change.
      - name: Cache v86 guest assets
        id: v86-assets-cache
        uses: actions/cache@v6
        with:
          path: packages/tmuxy-ui/v86-assets
          key: ${{ runner.os }}-v86-assets-${{ hashFiles('packages/tmuxy-ui/scripts/build-v86-snapshot.mjs', 'packages/tmuxy-ui/scripts/fetch-v86-image.mjs', 'bin/tmuxy-cli', 'bin/tmuxy/**', '.devcontainer/.tmuxy.defaults.conf') }}

      - name: Build v86 guest assets (cache miss)
        if: steps.v86-assets-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd
          npm run fetch:v86-image -w tmuxy-ui
          npm run build:v86-snapshot -w tmuxy-ui

      - uses: ./.github/actions/install-chromium

      - name: Start Storybook (dev server)
        run: |
          npm run storybook -w tmuxy-ui -- --ci --quiet 2>/tmp/storybook.log &
          bin/wait-for-server http://localhost:6006/index.json 180000

      - name: Gate stories (blocking)
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run test-storybook:v86 -w tmuxy-ui -- 6006 split-optimistic-timeline split-rejected-rollback resize-pane-drag

      # A screenshot, a DOM dump and the real stack for every story that
      # failed — the probe used to report only `playFunctionThrewException`,
      # which nobody could act on.
      - name: Probe failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-v86-probe-artifacts
          path: packages/tmuxy-ui/probe-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Storybook logs (debug)
        if: failure()
        run: tail -200 /tmp/storybook.log

  # Dependency audits, scoped to what ships: production npm dependencies
  # (dev tooling — Storybook, Puppeteer, wdio — is audited by Dependabot but
  # would keep this job permanently red) and the Rust workspace, with the
  # policy and its reasons in .cargo/audit.toml.
  # The packaged desktop app: built ONCE, then both desktop suites run against
  # that one binary.
  #
  # These were two jobs — `tauri-e2e` (debug build, WebdriverIO suite) and
  # `desktop-smoke` (release build, launch smoke test). They installed the same
  # WebKitGTK/Xvfb apt set, shared the same tauri-driver and tmux 3.7a caches,
  # and compiled the Tauri app twice between them, for the two jobs that
  # between them produced most of this workflow's failures.
  #
  # The smoke test runs FIRST and brings its own tauri-driver up and down; the
  # jest suite then starts its own on the same port.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libevent-dev libncurses-dev bison \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            webkit2gtk-driver xvfb x11-utils

      # Match the `e2e` job's tmux version (3.7a — the devcontainer / v86
      # guest / docs/TMUX.md target). Ubuntu's apt ships tmux 3.4, which has a
      # race where the initial auto-adopt of `@tmuxy-window-type=tab` gets
      # clobbered by an in-flight list-windows response under the load the
      # Ctx/Tower Tauri path puts on the CC stream at startup. The app also
      # refuses to launch below tmux 3.3.
      - uses: ./.github/actions/install-tmux

      # `cargo install tauri-driver` compiles from source on every run
      # (~2 min). Pinned so the cache key describes exactly what is in it.
      - name: Cache tauri-driver
        id: tauri-driver-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri-driver
          key: ${{ runner.os }}-tauri-driver-2.0.6

      - name: Install tauri-driver (cache miss)
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.0.6 --locked --force

      - name: Install npm dependencies
        run: npm ci

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: packages/tmuxy-ui/dist

      # Without the bundlers — both suites run the raw executable — and in the
      # debug profile: the release profile's LTO link alone is a minute or
      # more, and neither the smoke test nor the Tauri E2E depends on it. The
      # release build is still exercised daily and on every tag by
      # build-app.yml, and the desktop latency measurement that does need it
      # lives in nightly-perf.yml.
      # Reuses the frontend-dist artifact from build-frontend instead of rebuilding.
      - name: Build Tauri app (debug)
        run: npx tauri build --debug --no-bundle --config '{"build":{"beforeBuildCommand":""}}'
        working-directory: packages/tmuxy-tauri-app

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac -nolisten tcp &
          echo "XVFB_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.25
          done

      - name: Run smoke test
        env:
          DISPLAY: ':99'
        run: |
          tauri-driver --port 4444 &
          DRIVER_PID=$!
          sleep 2

          node tests/smoke/smoke-test.js target/debug/tmuxy
          RESULT=$?

          kill $DRIVER_PID 2>/dev/null || true
          exit $RESULT

      - name: Tauri E2E tests
        env:
          DISPLAY: ':99'
          TAURI_BINARY: ${{ github.workspace }}/target/debug/tmuxy
        run: npm run test:tauri

      - name: Stop Xvfb
        if: always()
        run: kill "$XVFB_PID" 2>/dev/null || true

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit
