name: lint and tests

on:
  # A change to prose alone runs nothing: no test reads docs/ or a README,
  # and main has no required check that a skipped run would leave pending.
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  # Callable as a job, so another workflow can make a real `needs:` dependency
  # on this suite. `Build App` calls it on the TAG ref: the artifacts that
  # become a release are then gated on the same tests, for the same ref —
  # every test, including the [nightly] tier a push skips
  # (docs/TESTS-LAYERS.md § Tiers).
  workflow_call:
    inputs:
      e2e-tier:
        description: "'commit' skips the [nightly] E2E tier; 'full' runs everything"
        type: string
        default: commit

# No job here writes to the repository: nothing uses GITHUB_TOKEN, and
# uploading an artifact does not need write access to the contents.
permissions:
  contents: read

# Supersede an in-flight run only when a new commit lands on the SAME pull
# request. Pushes to main (and anything else) get a group keyed by run_id,
# which is unique per run, so they can never cancel each other — every commit
# that lands on main keeps its own complete, uncancelled result.
#
# A `workflow_call` run inherits the CALLER's event and run_id, so a tag build
# lands in the run_id branch too: unique per run, never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The lint gate, step by step. WHAT is checked lives in bin/lint-gate — the
  # same list the pre-commit and pre-push hooks run — and so does the list of
  # steps: the job asks the gate for it, so a step added there runs here too.
  # Each runs even after one fails, and a red run names every failed step.
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust
        with:
          rust: guest

      - uses: ./.github/actions/install-linux-deps

      - name: Lint gate
        run: |
          failed=""
          for step in $(bin/lint-gate steps); do
            echo "::group::bin/lint-gate check $step"
            bin/lint-gate check "$step" || failed="$failed $step"
            echo "::endgroup::"
          done
          for step in $failed; do
            echo "::error title=lint-gate $step::bin/lint-gate check $step failed"
          done
          [ -z "$failed" ]

  # What this push touched, for the jobs below that need not run on every
  # push: the desktop build, the v86 probe, the Mac cargo test and the
  # dependency audit each skip a push that changed nothing they cover, and the
  # [nightly] E2E tier runs only for a push that edited the web suites. The
  # rules are bin/ci/ci-changes.mjs (tested beside it); a base this
  # checkout cannot reach — a force-push, a tag build — runs everything.
  #
  # The same job composes the E2E matrix for this run's tier, from
  # tests/e2e-suites.json via bin/ci/e2e-plan.mjs: on a push the suites a
  # [nightly] test does not fill, each with a jest name pattern that skips
  # the tagged tests; on a tag build (`e2e-tier: full`) every suite and every
  # test. A push that edited the web suites also gets the [nightly] tier.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.changes.outputs.desktop }}
      v86: ${{ steps.changes.outputs.v86 }}
      macos-rust: ${{ steps.changes.outputs.macos-rust }}
      audit: ${{ steps.changes.outputs.audit }}
      nightly-e2e: ${{ steps.changes.outputs.nightly-e2e }}
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node bin/ci/ci-changes.mjs "$BASE" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          TIER: ${{ inputs.e2e-tier || 'commit' }}
          WITH_NIGHTLY: ${{ steps.changes.outputs.nightly-e2e == 'true' && '--with-nightly' || '' }}
        run: echo "suites=$(node bin/ci/e2e-plan.mjs "$TIER" $WITH_NIGHTLY)" >> "$GITHUB_OUTPUT"

  # The frontend bundle and the test server, each built ONCE and handed to
  # every job that needs them. Two jobs so the desktop job, which only needs
  # the dist, starts as soon as the frontend is built. The server job still
  # waits for the dist: the server embeds it at compile time (rust-embed in
  # tmuxy-server/src/server/lifecycle.rs), and the E2E suites hit the
  # embedded copy.
  #
  # Every consumer runs on ubuntu-26.04, so one linux-x86_64 binary serves
  # them all.
  build-frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/build-frontend

  # The `ci` profile (Cargo.toml): release optimisation without the fat-LTO,
  # single-codegen-unit link that is most of the release build's minute and
  # that no functional test can tell apart. The artifact keeps the
  # `target/release/` path its consumers expect.
  build-server:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: build-frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/build-server
        with:
          profile: ci

  demo-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-rust
        with:
          rust: none
      # That the site compiles. Without `prebuild`, which stages the v86
      # guest's assets for the page to load at runtime: building those is
      # Deploy Demo's, and a compile check has no use for them.
      - name: Build demo
        run: npm run build --ignore-scripts -w tmuxy-demo

  unit-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-rust
        with:
          rust: none
      - name: Vitest
        run: npm test

  cli-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Rust for the one suite that builds a real binary: the guests'
      # tmuxy-verbs (tests/cli/cli-guest-verbs.test.js).
      - uses: ./.github/actions/setup-node-rust
      - name: CLI suite
        run: npm run test:cli

  # macOS is the primary user platform, and every test job above runs on Linux
  # only — a macOS-only bug (feab950) reached a release because nothing on CI
  # ever executed this code on a Mac.
  #
  # Only the platform-SENSITIVE suites: the CLI (shell, paths, PATH lookup) and
  # cargo test (a real `tmux -CC` against Homebrew's tmux).
  #
  # The CLI suite runs on every push: it is cheap and the shell is where the
  # platform shows. The Rust suite runs only when the push touches the code
  # that has a macOS branch — the desktop app, the pty spawn of `tmux -CC`,
  # the CLI scripts, any Rust file with a `target_os = "macos"`, the Cargo
  # manifests (`macos-rust` in bin/ci/ci-changes.mjs) — and always on a tag
  # build. A Mac minute costs ten Linux ones, and the ~500
  # platform-neutral tests are run on Linux per commit already; build-app.yml
  # runs the whole suite on a Mac daily as the net.
  macos-tests:
    runs-on: macos-26
    timeout-minutes: 30
    needs: changes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust

      # The tmuxy-core integration tests drive a real `tmux -CC`.
      # Homebrew's tmux, not a source build: this job exists to catch macOS
      # platform differences, and brew's is what macOS users actually run.
      - name: Install tmux
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          tmux -V

      - name: CLI suite
        run: npm run test:cli

      # The tauri crate's build script expects a frontend dist to exist.
      - name: Frontend dist placeholder
        if: needs.changes.outputs.macos-rust == 'true' || startsWith(github.ref, 'refs/tags/')
        run: mkdir -p packages/tmuxy-ui/dist

      - name: Cargo test
        if: needs.changes.outputs.macos-rust == 'true' || startsWith(github.ref, 'refs/tags/')
        run: cargo test --workspace

  rust-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust
        with:
          install-npm: 'false'

      - uses: ./.github/actions/install-linux-deps

      - uses: ./.github/actions/install-tmux

      - name: Frontend dist placeholder
        run: mkdir -p packages/tmuxy-ui/dist

      - name: Cargo test
        run: cargo test --workspace

  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [changes, build-server]
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    name: e2e (${{ matrix.suite.name }})

    # The suite's own socket, port, wait scale and snapshot policy are set by
    # start-test-server, for the server and for every step after it.
    env:
      # The server log is printed when a shard fails. Each client's size is
      # what decides a pane's size, and a pane too small to show a prompt
      # looks exactly like a shell that never started.
      RUST_LOG: 'info,tmuxy_server::sse=debug'
      # The server's action trace (docs/TRACING.md), with a marker at each
      # test's start and end (tests/helpers/trace-environment.js). Read by the
      # health check below on every job, uploaded when a shard fails.
      TMUXY_E2E_TRACE: /tmp/tmuxy-e2e-trace.ndjson

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The server arrives as an artifact from `build-server`, and nothing
      # else in this job compiles.
      - uses: ./.github/actions/setup-node-rust
        with:
          rust: none

      # The runner image's apt index is used as it is; a refresh is ~10s on
      # every runner, and only needed when the image's lists have gone stale.
      - name: Install system dependencies
        run: |
          APT_ATTEMPTS=1 bin/ci/apt-get install -y --no-install-recommends fzf neovim \
            || { bin/ci/apt-get update && bin/ci/apt-get install -y --no-install-recommends fzf neovim; }

      # The pin (bin/toolchain), except for the entry that runs the smoke
      # suites on the tmux Ubuntu ships (3.4): two product bugs were 3.4-only
      # and the nightly matrix was the first to see them.
      - uses: ./.github/actions/install-tmux
        with:
          version: ${{ matrix.suite.tmux }}

      - uses: ./.github/actions/install-chromium

      - uses: ./.github/actions/install-webkit
        if: matrix.suite.webkit

      - uses: ./.github/actions/start-test-server
        with:
          e2e: 'true'
          trace: ${{ env.TMUXY_E2E_TRACE }}

      # No --forceExit: it masked leaked handles by killing the process before
      # jest could report them.
      - name: Run ${{ matrix.suite.name }}
        env:
          SUITE_PATH: ${{ matrix.suite.path }}
          # The tier's jest name pattern, composed by
          # bin/ci/e2e-plan.mjs; empty when every test in the file is wanted.
          SUITE_PATTERN: ${{ matrix.suite.pattern }}
          # The runner that installs WebKit fails a WebKit suite that cannot
          # launch it, instead of reporting it as not run.
          TMUXY_E2E_REQUIRE_WEBKIT: ${{ matrix.suite.webkit && '1' || '' }}
        run: |
          set -o pipefail
          npx jest "$SUITE_PATH" ${SUITE_PATTERN:+--testNamePattern "$SUITE_PATTERN"} 2>&1 | tee /tmp/jest-output.log

      # On every job, passing or not: a pane that never spoke is a fault even
      # in a test that never waited on it, and a shard that went green on a
      # re-run still had it. Findings are warnings on the run, not failures.
      - name: Trace health check
        if: always()
        run: ./target/release/tmuxy-server trace --check --github "$TMUXY_E2E_TRACE" || true

      - name: Server logs (debug)
        if: failure()
        run: cat /tmp/tmuxy-server.log | tail -2000

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-${{ matrix.suite.name }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/tmuxy-e2e-trace.ndjson
            /tmp/tmuxy-server.log
            /tmp/jest-output.log
          retention-days: 14
          if-no-files-found: ignore

  # Storybook probes. Both jobs drive stories in a real Chromium against a
  # `storybook dev` server — dev (not static) on purpose: no build step, and
  # stories compile on demand.
  # Two runners, each a stride of the story list (PROBE_SHARD): the probe is
  # the longest job on a push, and a second runner's setup (~90s) is cheaper
  # than the half it takes over.
  storybook-probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    name: storybook-probe (${{ matrix.shard }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/storybook-probe-setup
        with:
          storybook-log: /tmp/storybook.log

      # The per-commit tier: stories tagged `nightly` (frame-sampled
      # animations, render-count budgets, language sweeps) run in the nightly
      # v86 workflow's deterministic job instead. The axe accessibility pass
      # runs here too: when it was nightly-only, five of thirteen probe misses
      # were accessibility regressions nobody saw until the morning.
      - name: Probe deterministic stories
        env:
          PROBE_TIER: commit
          PROBE_SHARD: ${{ matrix.shard }}
        run: npm run test-storybook -w tmuxy-ui

      # A screenshot, a DOM dump and the real stack for every failed story:
      # the test runner itself reports only `playFunctionThrewException`.
      - name: Probe failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-probe-artifacts-${{ strategy.job-index }}
          path: packages/tmuxy-ui/probe-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Storybook logs (debug)
        if: failure()
        run: tail -200 /tmp/storybook.log

  storybook-v86-probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Skipped for a push that touched nothing the probe loads (the `changes`
    # job): the E2E suites, the server, the desktop crate, prose.
    needs: changes
    if: needs.changes.outputs.v86 == 'true'
    # Only the blocking GATE (the stories tagged `gate`) runs per commit; the
    # full sweep (~20 minutes) is nightly-v86.yml's, where a failure opens an
    # issue and the per-story timings are kept.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The guest kernel/BIOS + pre-booted machine snapshot come from cache
      # unless something the guest is built from changed (the v86-guest action).
      - uses: ./.github/actions/storybook-probe-setup
        with:
          v86: 'true'
          storybook-log: /tmp/storybook.log

      - name: Gate stories (blocking)
        run: PROBE_TIER=gate npm run test-storybook:v86 -w tmuxy-ui -- 6006

      # A screenshot, a DOM dump and the real stack for every failed story:
      # the test runner itself reports only `playFunctionThrewException`.
      - name: Probe failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-v86-probe-artifacts
          path: packages/tmuxy-ui/probe-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Storybook logs (debug)
        if: failure()
        run: tail -200 /tmp/storybook.log

  # The desktop app, built ONCE for both desktop suites. The smoke test runs
  # FIRST and brings its own tauri-driver up and down; the
  # jest suite then starts its own on the same port.
  desktop:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # Skipped for a push that touched nothing the app is built from or tested
    # by (the `changes` job): the web E2E suites, the demo, stories, prose.
    needs: [changes, build-frontend]
    if: needs.changes.outputs.desktop == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust

      - uses: ./.github/actions/install-desktop-test-deps

      # Match the `e2e` job's tmux version (the pin in bin/toolchain, the
      # devcontainer's and docs/TMUX.md's target). Ubuntu's apt ships tmux
      # 3.4, which has a race where the initial auto-adopt of
      # `@tmuxy-window-type=tab` gets clobbered by an in-flight list-windows
      # response under the load the Tauri app puts on the control-mode stream
      # at startup.
      - uses: ./.github/actions/install-tmux

      - name: Download frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: packages/tmuxy-ui/dist

      # Without the bundlers — both suites run the raw executable — and in the
      # debug profile: the release profile's LTO link alone is a minute or
      # more, and neither the smoke test nor the Tauri E2E depends on it. The
      # release build is still exercised daily and on every tag by
      # build-app.yml, and the desktop latency measurement that does need it
      # lives in nightly-perf.yml.
      - name: Build Tauri app (debug)
        run: npx tauri build --debug --no-bundle --config '{"build":{"beforeBuildCommand":""}}'
        working-directory: packages/tmuxy-tauri-app

      - uses: ./.github/actions/start-xvfb

      - name: Run smoke test
        env:
          DISPLAY: ':99'
        run: |
          tauri-driver --port 4444 &
          DRIVER_PID=$!
          bin/ci/wait-for-server http://localhost:4444/status

          node tests/smoke/smoke-test.js target/debug/tmuxy
          RESULT=$?

          kill $DRIVER_PID 2>/dev/null || true
          exit $RESULT

      - name: Tauri E2E tests
        env:
          DISPLAY: ':99'
          TAURI_BINARY: ${{ github.workspace }}/target/debug/tmuxy
        run: npm run test:tauri

      - name: Stop Xvfb
        if: always()
        run: kill "$XVFB_PID" 2>/dev/null || true

  # Dependency audits, scoped to what ships: production npm dependencies
  # (dev tooling — Storybook, Puppeteer, wdio — is audited by Dependabot but
  # would keep this job permanently red) and the Rust workspace, with the
  # policy and its reasons in .cargo/audit.toml.
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Only when a lockfile moved (the `changes` job): an advisory published
    # against a dependency no push touched made this job red for commits that
    # had nothing to do with it. The Sunday sweep hands those to the agent.
    needs: changes
    if: needs.changes.outputs.audit == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust
        with:
          install-npm: 'false'

      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  # Where the run's time went, on the run's summary page: jobs, steps and the
  # slowest tests, read back from the logs by bin/ci/ci-timing.mjs. Runs after
  # everything else whatever their result, and never fails the run itself.
  timing:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    if: always()
    needs:
      [
        lint,
        demo-build,
        unit-tests,
        cli-tests,
        macos-tests,
        rust-tests,
        e2e,
        storybook-probe,
        storybook-v86-probe,
        desktop,
        audit,
      ]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Timing summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bin/ci/ci-timing.mjs "$GITHUB_RUN_ID" --summary >> "$GITHUB_STEP_SUMMARY" || true
