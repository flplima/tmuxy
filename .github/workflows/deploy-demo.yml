name: Deploy Demo

on:
  push:
    branches: [main]
    paths:
      - 'packages/tmuxy-demo/**'
      - 'packages/tmuxy-ui/src/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `npm install`): deploy exactly the locked tree.
      - name: Install dependencies
        run: npm ci

      - name: Build demo
        run: npm run build -w tmuxy-demo
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

      # upload-pages-artifact has no if-no-files-found input, so the
      # equivalent guard is explicit: never deploy an empty export.
      - name: Fail if the demo produced no output
        run: |
          test -d packages/tmuxy-demo/out || { echo "demo export missing"; exit 1; }
          test -n "$(ls -A packages/tmuxy-demo/out)" || { echo "demo export is empty"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/tmuxy-demo/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
