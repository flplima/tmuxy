name: Deploy Demo

on:
  push:
    branches: [main]
    paths:
      - 'packages/tmuxy-demo/**'
      - 'packages/tmuxy-ui/src/**'
      # The demo runs real tmux in a v86 guest: the engine compiled to wasm,
      # and what the guest's snapshot is built from, ship with it.
      - 'packages/tmuxy-core/**'
      - 'packages/tmuxy-wasm/**'
      - 'packages/tmuxy-ui/scripts/build-v86-snapshot.mjs'
      - 'packages/tmuxy-ui/scripts/fetch-v86-image.mjs'
      # The CheerpX guest's image, and what goes into it.
      - 'packages/tmuxy-ui/scripts/build-cheerpx-image.mjs'
      - 'packages/tmuxy-ui/scripts/lib/guest.mjs'
      - 'packages/tmuxy-ui/cheerpx/**'
      - 'packages/tmuxy-pty/**'
      - 'packages/tmuxy-group/**'
      - 'packages/tmuxy-cli/bin/tmuxy-cli'
      - 'packages/tmuxy-cli/bin/tmuxy/**'
      - 'packages/tmuxy-core/assets/tmuxy.defaults.conf'
      # The docs for agents (/llms-full.txt, /search.json) are built from docs/.
      - 'docs/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `npm install`): deploy exactly the locked tree.
      - name: Install dependencies
        run: npm ci

      # The v86 guest the demo runs, built as the storybook-probe job builds it
      # (lint-and-tests.yml): wasm32 for tmuxy-wasm, i686-musl for the guest
      # binaries build-v86-snapshot.mjs cross-compiles on a cache miss.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown,i686-unknown-linux-musl

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The CLI and the crate must agree exactly on the bindgen schema
      # (bin/wasm-bindgen-version reads the lockfile's).
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: echo "version=$(bin/wasm-bindgen-version)" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Build tmuxy-wasm
        run: npm run build:wasm

      # Same key as lint-and-tests.yml, so a snapshot either job built is reused.
      - name: Cache v86 guest assets
        id: v86-assets-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/tmuxy-ui/v86-assets
          key: ${{ runner.os }}-v86-assets-${{ hashFiles('packages/tmuxy-ui/scripts/build-v86-snapshot.mjs', 'packages/tmuxy-ui/scripts/fetch-v86-image.mjs', 'packages/tmuxy-cli/bin/tmuxy-cli', 'packages/tmuxy-cli/bin/tmuxy/**', 'packages/tmuxy-core/assets/tmuxy.defaults.conf', 'packages/tmuxy-core/assets/tmuxy.essentials.conf') }}

      - name: Build v86 guest assets (cache miss)
        if: steps.v86-assets-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd
          npm run fetch:v86-image -w tmuxy-ui
          npm run build:v86-snapshot -w tmuxy-ui

      # The CheerpX guest the demo runs where the page is cross-origin isolated
      # (everywhere a service worker can make it so, public/coi-sw.js): 32-bit
      # Alpine built under Docker, which an x86-64 runner runs natively, with
      # the i686-musl tmuxy-group and tmuxy-pty cross-compiled into it.
      - name: Cache the CheerpX guest image
        id: cheerpx-image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/tmuxy-ui/cheerpx-assets/tmuxy.ext2
          key: ${{ runner.os }}-cheerpx-image-${{ hashFiles('packages/tmuxy-ui/scripts/build-cheerpx-image.mjs', 'packages/tmuxy-ui/scripts/lib/guest.mjs', 'packages/tmuxy-ui/cheerpx/**', 'packages/tmuxy-pty/**', 'packages/tmuxy-group/**', 'packages/tmuxy-core/**', 'Cargo.lock', 'packages/tmuxy-cli/bin/tmuxy-cli', 'packages/tmuxy-cli/bin/tmuxy/**') }}

      - name: Build the CheerpX guest image (cache miss)
        if: steps.cheerpx-image-cache.outputs.cache-hit != 'true'
        run: npm run build:cheerpx-image -w tmuxy-ui

      - name: Build demo
        run: npm run build -w tmuxy-demo
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

      # upload-pages-artifact has no if-no-files-found input, so the
      # equivalent guard is explicit: never deploy an empty export.
      - name: Fail if the demo produced no output
        run: |
          test -d packages/tmuxy-demo/out || { echo "demo export missing"; exit 1; }
          test -n "$(ls -A packages/tmuxy-demo/out)" || { echo "demo export is empty"; exit 1; }
          test -s packages/tmuxy-demo/out/v86-img/tmux-state.bin.gz || { echo "demo export has no v86 snapshot"; exit 1; }
          test -s packages/tmuxy-demo/out/cheerpx-img/tmuxy.ext2 || { echo "demo export has no CheerpX image"; exit 1; }
          test -s packages/tmuxy-demo/out/coi-sw.js || { echo "demo export has no isolation worker"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: packages/tmuxy-demo/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
