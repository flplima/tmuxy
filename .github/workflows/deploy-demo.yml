name: deploy demo

on:
  push:
    branches: [main]
    paths:
      - 'packages/tmuxy-demo/**'
      - 'packages/tmuxy-ui/src/**'
      # The demo runs real tmux in a v86 guest: the engine compiled to wasm,
      # and what the guest's snapshot is built from, ship with it. The crates
      # are cargo's graph (bin/ci/crate-graph.test.mjs).
      - 'packages/tmuxy-core/**'
      - 'packages/vt100/**'
      - 'packages/tmuxy-wasm/**'
      - 'packages/tmuxy-ui/scripts/build-v86-snapshot.mjs'
      - 'packages/tmuxy-ui/scripts/fetch-v86-image.mjs'
      - 'packages/tmuxy-ui/scripts/lib/guest.mjs'
      - 'packages/tmuxy-ui/scripts/lib/guest.gen.json'
      # The showcase baked into the demo's state.
      - 'packages/tmuxy-ui/scripts/demo-showcase/**'
      - 'packages/tmuxy-verbs/**'
      - 'packages/tmuxy-cli/bin/tmuxy-cli'
      - 'packages/tmuxy-cli/bin/tmuxy/**'
      - 'packages/tmuxy-core/assets/tmuxy.defaults.conf'
      # The docs for agents (/llms-full.txt, /search.json) are built from docs/.
      - 'docs/**'
      # The user wiki is published by publish-wiki.yml, not with the demo.
      - '!docs/wiki/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # wasm32 for tmuxy-wasm, i686-musl for the guest binaries the v86
      # snapshot cross-compiles on a cache miss. node_modules by `npm ci`
      # (not a cache): deploy exactly the locked tree.
      - uses: ./.github/actions/setup-node-rust
        with:
          rust: guest
          install-npm: 'false'

      - name: Install dependencies
        run: npm ci

      # The v86 guest the demo runs, built and cached as the storybook-v86-probe
      # job builds it, so a snapshot either job built is reused: the demo's
      # state is built with the stories' one.
      - uses: ./.github/actions/v86-guest

      - name: Build demo
        run: npm run build -w tmuxy-demo
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

      # upload-pages-artifact has no if-no-files-found input, so the
      # equivalent guard is explicit: never deploy an empty export.
      - name: Fail if the demo produced no output
        run: |
          test -d packages/tmuxy-demo/out || { echo "demo export missing"; exit 1; }
          test -n "$(ls -A packages/tmuxy-demo/out)" || { echo "demo export is empty"; exit 1; }
          test -s packages/tmuxy-demo/out/v86-img/demo-state.bin.zst || { echo "demo export has no v86 snapshot"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: packages/tmuxy-demo/out

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
