name: ci lint

# The lint gate, step by step. WHAT is checked lives in bin/lint-gate — the
# same list the pre-commit and pre-push hooks run — so this job cannot drift
# from them; it is split into steps here only so a red run names the step.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust
        with:
          rust-targets: wasm32-unknown-unknown

      - uses: ./.github/actions/install-linux-deps
        with:
          profile: lint

      - name: Repo policy checks
        run: bin/lint-gate check policy

      - name: Prettier
        run: bin/lint-gate check prettier

      - name: Rust format
        run: bin/lint-gate check rustfmt

      - name: ESLint
        run: bin/lint-gate check eslint

      - name: Type checks (tmuxy-ui, tmuxy-demo)
        run: bin/lint-gate check types

      - name: Unused exports, files and dependencies (knip)
        run: bin/lint-gate check knip

      - name: Clippy
        run: bin/lint-gate check clippy

      - name: Clippy (tmuxy-wasm)
        run: bin/lint-gate check clippy-wasm
