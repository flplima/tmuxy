name: sunday sweep

# Every Sunday morning, hands what needs fixing to the Copilot cloud agent
# (bin/ci/sunday-sweep.mjs): open high/critical Dependabot and CodeQL alerts
# become `agent-fix` issues assigned to the agent. A red Dependabot PR is
# only listed: its failing log is output of the code the bump brings in, so a
# person reads it and hands it over by dispatching this workflow with
# `red_prs`, and the agent then gets a task on the PR's branch. At most three
# a run.
#
# The token is a fine-grained PAT for this repository only
# (`COPILOT_AGENT_PAT`: metadata, Dependabot alerts and code scanning alerts
# read; contents, issues and pull requests read/write; agent tasks write) —
# GITHUB_TOKEN can neither read Dependabot alerts nor start the agent. It
# lives in this scheduled job alone, never in anything a pull request can
# trigger. Without it the job says so and stops; a token missing one of
# those permissions sweeps what it can and fails the run, naming the gap.

on:
  schedule:
    # 11:00 UTC on Sundays: 08:00 in Brazil, before the week starts.
    - cron: '0 11 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Say what would be handed over, change nothing
        type: boolean
        default: true
      red_prs:
        description: Hand over red Dependabot PRs too (read their failing logs first)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sunday-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Sweep
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_PAT }}
          GH_REPO: ${{ github.repository }}
          DRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || secrets.COPILOT_AGENT_PAT == '' }}
          RED_PRS: ${{ github.event_name == 'workflow_dispatch' && inputs.red_prs }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "COPILOT_AGENT_PAT is not set: nothing can be read or handed over." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ARGS=()
          if [ "$DRY" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$RED_PRS" = "true" ]; then ARGS+=(--red-prs); fi
          node bin/ci/sunday-sweep.mjs "${ARGS[@]}"
