name: nightly tmux version matrix

# Every other workflow pins ONE tmux (`bin/toolchain tmux-version`), so
# nothing else in CI executes the version-specific paths docs/TMUX.md is full
# of: the 3.5a `neww` crash and the `splitw ; breakp` rewrite, the 3.4
# auto-adopt race on `@tmuxy-window-type`, the control-mode differences the
# router works around. This runs the tmux-facing suites against each
# supported version once a night.
#
# Blocking policy: the RELEASED versions gate this workflow. `HEAD`
# (tmux master) does not — upstream can break, or change behaviour, on any
# commit, and a red nightly nobody can fix is a nightly nobody reads. A HEAD
# failure is reported into the tracking issue and the job still passes.

on:
  schedule:
    # 03:30 UTC — an hour before the v86 sweep, so the two nightlies do not
    # contend for runners.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'The tmux to run against (all: the whole matrix). Only a run of all of them can close the tracking issue.'
        type: choice
        default: all
        options: [all, '3.2a', '3.4', '3.5a', '3.7a', '3.8', HEAD]

permissions:
  contents: read

concurrency:
  group: nightly-tmux-matrix
  cancel-in-progress: false

jobs:
  # The versions this run covers: every one on a schedule or with `version:
  # all`, else the one asked for (`gh workflow run nightly-tmux-matrix.yml -f
  # version=3.4`), which is how a fix for one version is checked without
  # running the other five.
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tmux: ${{ steps.matrix.outputs.tmux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: matrix
        env:
          VERSION: ${{ inputs.version || 'all' }}
        # `version` is the release tag; `soft` marks a version whose failure
        # must not fail the workflow; `pinned` (added from bin/toolchain) the
        # one every per-commit job runs. 3.8 is what Homebrew ships, and prints
        # #{window_layout} as JSON, which session snapshots convert back to
        # the classic string.
        run: |
          all='[
            {"name": "3.2a", "version": "3.2a"},
            {"name": "3.4", "version": "3.4"},
            {"name": "3.5a", "version": "3.5a"},
            {"name": "3.7a", "version": "3.7a"},
            {"name": "3.8", "version": "3.8"},
            {"name": "HEAD", "version": "HEAD", "soft": true}
          ]'
          pin=$(bin/toolchain tmux-version)
          if ! jq -e --arg pin "$pin" 'any(.version == $pin)' <<<"$all" >/dev/null; then
            echo "::error::the pinned tmux $pin is not in the matrix"
            exit 1
          fi
          tmux=$(jq -c --arg v "$VERSION" --arg pin "$pin" \
            'map(select($v == "all" or .version == $v) | .pinned = (.version == $pin))' <<<"$all")
          if [ "$tmux" = "[]" ]; then
            echo "::error::no tmux $VERSION in the matrix"
            exit 1
          fi
          echo "tmux=$tmux" >> "$GITHUB_OUTPUT"

  # The frontend bundle and the release server, built once and handed to
  # every matrix entry — neither depends on the tmux version under test.
  build-artifacts:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/build-frontend

      - uses: ./.github/actions/build-server
        with:
          profile: release

  suites:
    needs: [plan, build-artifacts]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    name: tmux ${{ matrix.tmux.name }}
    permissions:
      contents: read
      # The failure report is written from inside this job so that a soft
      # (HEAD) failure can be reported without failing the workflow.
      issues: write

    strategy:
      fail-fast: false
      matrix:
        tmux: ${{ fromJSON(needs.plan.outputs.tmux) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust

      # A released tmux's build dependencies come with install-tmux, on a
      # cache miss; master's are installed here.
      - name: Install system dependencies
        env:
          HEAD_DEPS: ${{ matrix.tmux.version == 'HEAD' && 'tmux-build-head' || '' }}
        run: |
          bin/ci/apt-get update
          # shellcheck disable=SC2046 # one package per word
          bin/ci/apt-get install -y --no-install-recommends fzf neovim \
            ${HEAD_DEPS:+$(bin/toolchain packages "$HEAD_DEPS")}

      # Released versions are cached exactly like the per-commit jobs cache
      # the pinned one — and the pinned entry shares that cache key, so it
      # costs nothing extra. HEAD is a moving target and is deliberately never
      # cached.
      - uses: ./.github/actions/install-tmux
        if: matrix.tmux.version != 'HEAD'
        with:
          version: ${{ matrix.tmux.version }}

      - name: Build tmux from master
        if: matrix.tmux.version == 'HEAD'
        run: |
          bin/toolchain build-tmux HEAD
          tmux -V

      - uses: ./.github/actions/install-chromium

      # Every test step below is `continue-on-error` so that ALL the suites
      # report on every version — a 3.4 crash in the core tests should not hide
      # whether the snapshot suite also breaks there. The gate step at the end
      # turns the collected outcomes back into a job result.
      # Every integration test, not a list of the ones that start a tmux: a
      # list missed the next one written.
      - name: tmuxy-core integration tests (real tmux)
        id: core
        continue-on-error: true
        run: |
          mkdir -p packages/tmuxy-ui/dist
          cargo test -p tmuxy-core --tests

      # The E2E suites' server, as lint-and-tests.yml starts it: their socket,
      # port, wait scale and snapshot policy, for every step after this one.
      - name: Start server
        id: server
        continue-on-error: true
        uses: ./.github/actions/start-test-server
        with:
          e2e: 'true'

      # Only on HEAD: every push runs these two on the pinned tmux and on 3.4
      # (tests/e2e-suites.json), and the full suite below runs them on every
      # other released version.
      - name: Snapshot suite
        id: snapshots
        if: matrix.tmux.version == 'HEAD'
        continue-on-error: true
        run: npx jest tests/snapshots/

      - name: TUI alternate-screen suite
        id: tui
        if: matrix.tmux.version == 'HEAD'
        continue-on-error: true
        run: npx jest tests/8-tui-alternate-screen.test.js

      # The [nightly] E2E tier (docs/TESTS-LAYERS.md § Tiers): tests a push skips
      # because a cheaper layer already holds their logic, run once a day on
      # the tmux the per-commit jobs pin. Every file is given to jest, which
      # skips what the pattern leaves out, so a file whose every test is
      # tagged needs no listing anywhere.
      - name: Nightly E2E tier
        id: nightly-tier
        if: matrix.tmux.pinned
        continue-on-error: true
        run: npx jest tests/ --testNamePattern '\[nightly\]'

      # The whole E2E suite, on every released version the per-commit jobs do
      # not pin. The two suites above never source a config or run a CLI
      # command that fails, so they missed tmux 3.4 putting a pane into
      # view-mode on run-shell output — after which every key typed went into
      # the mode, and 53 of 88 tests failed on a version Ubuntu 24.04 ships.
      - name: Full E2E suite
        id: full-e2e
        if: ${{ !matrix.tmux.pinned && matrix.tmux.version != 'HEAD' }}
        continue-on-error: true
        run: npx jest --runInBand tests/

      - name: Server logs (debug)
        if: always()
        run: tail -2000 /tmp/tmuxy-server.log || true

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tmux-${{ matrix.tmux.name }}-server-log-${{ github.run_id }}
          path: /tmp/tmuxy-server.log
          if-no-files-found: warn

      - name: Summarise this version
        if: always()
        run: |
          {
            echo "### tmux ${{ matrix.tmux.name }}"
            echo ""
            echo "| suite | result |"
            echo "| --- | --- |"
            echo "| core integration | ${{ steps.core.outcome }} |"
            echo "| server start | ${{ steps.server.outcome }} |"
            echo "| snapshots | ${{ steps.snapshots.outcome }} |"
            echo "| 8-tui-alternate-screen | ${{ steps.tui.outcome }} |"
            echo "| nightly E2E tier | ${{ steps.nightly-tier.outcome }} |"
            echo "| full E2E suite | ${{ steps.full-e2e.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # One issue is kept open and commented on, the same pattern as
      # nightly-v86.yml. Reported from inside the job because a HEAD failure
      # must reach someone WITHOUT the job (or the workflow) going red.
      - name: Open or update the tracking issue
        if: always() && github.event_name == 'schedule' && (steps.core.outcome == 'failure' || steps.server.outcome == 'failure' || steps.snapshots.outcome == 'failure' || steps.tui.outcome == 'failure' || steps.nightly-tier.outcome == 'failure' || steps.full-e2e.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOFT: ${{ matrix.tmux.soft == true }}
        run: |
          set -euo pipefail
          TITLE="Nightly tmux version matrix is failing"
          if [ "$SOFT" = "true" ]; then
            NOTE="tmux \`${{ matrix.tmux.name }}\` is NON-BLOCKING: upstream master can break at any time, so this did not fail the workflow."
          else
            NOTE="tmux \`${{ matrix.tmux.name }}\` is a released, supported version — this failure blocks the nightly."
          fi

          BODY="Nightly tmux matrix failure on **tmux ${{ matrix.tmux.name }}**.

          $NOTE

          | suite | result |
          | --- | --- |
          | core integration | ${{ steps.core.outcome }} |
          | server start | ${{ steps.server.outcome }} |
          | snapshots | ${{ steps.snapshots.outcome }} |
          | 8-tui-alternate-screen | ${{ steps.tui.outcome }} |
          | nightly E2E tier (the pinned tmux only) | ${{ steps.nightly-tier.outcome }} |
          | full E2E suite (not the pinned tmux) | ${{ steps.full-e2e.outcome }} |

          Run: $RUN_URL
          Commit: ${{ github.sha }}

          The server log for this version is attached to that run as an artifact."

          BODY="$BODY" bin/ci/nightly-issue report "$TITLE"

      - name: Gate on the result
        if: always()
        run: |
          failed=""
          if [ "${{ steps.core.outcome }}" = "failure" ]; then failed="$failed core"; fi
          if [ "${{ steps.server.outcome }}" = "failure" ]; then failed="$failed server"; fi
          if [ "${{ steps.snapshots.outcome }}" = "failure" ]; then failed="$failed snapshots"; fi
          if [ "${{ steps.tui.outcome }}" = "failure" ]; then failed="$failed 8-tui"; fi
          if [ "${{ steps.nightly-tier.outcome }}" = "failure" ]; then failed="$failed nightly-tier"; fi
          if [ "${{ steps.full-e2e.outcome }}" = "failure" ]; then failed="$failed full-e2e"; fi

          if [ -z "$failed" ]; then
            echo "all suites passed on tmux ${{ matrix.tmux.name }}"
            exit 0
          fi

          if [ "${{ matrix.tmux.soft == true }}" = "true" ]; then
            echo "::warning title=tmux ${{ matrix.tmux.name }}::failed:$failed (non-blocking — upstream master)"
            exit 0
          fi

          echo "::error title=tmux ${{ matrix.tmux.name }}::failed:$failed"
          exit 1

  # Every released version passed, so the tracking issue is closed, unless a
  # HEAD failure reported into it on this run (bin/ci/nightly-issue). A manual
  # run of the whole matrix counts: re-running it after a fix is how one is
  # confirmed. A run of one version does not: the others did not run.
  resolve-issue:
    needs: suites
    if: (inputs.version || 'all') == 'all'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bin/ci/nightly-issue resolve "Nightly tmux version matrix is failing"
