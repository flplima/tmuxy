name: perf measurements

# Two performance measurements, for the numbers the per-commit jobs
# deliberately do not gate on: one on demand, one nightly. (The file keeps its
# nightly- name from when both ran on the schedule.)
#
# 1. `interaction-baseline` — a manual (workflow_dispatch) run of the Axis-C
#    interaction harness on `ubuntu-latest` whose only product is a refreshed
#    `perf/interaction-baseline.json` for a human to review and commit.
# 2. `soak` — the one job here that IS nightly, because its product is a trend
#    rather than a number: does a long session degrade? Tens of MB of output
#    and 200 split/kill cycles, watching heap, DOM nodes, listeners and server
#    RSS for a plateau. Nothing else in the suite runs long enough to see a
#    leak, since every other tier measures one interaction and a leak keeps
#    each individual interaction fast. It writes its table into the run
#    SUMMARY, not only an artifact — see the note below about why that
#    matters here.
#
# Neither gates anything. Absolute milliseconds from a shared GitHub runner
# are not a merge signal — the ratio gate in the per-commit
# `interaction-latency` job is. (The Axis-A criterion bench and its ratio gate
# run per commit in ci-rust-tests.yml.)
#
# So `interaction-baseline` is ON DEMAND. It exists to hand a human a number:
# the refreshed `perf/interaction-baseline.json` to review and commit. A
# nightly schedule produced nothing of the kind — it wrote artifacts nobody
# opened, and the baseline it exists to feed has never been refreshed from
# one. Run it (Actions → "perf measurements" → Run workflow) when you want
# the number.
#
# `soak` is the exception, and the difference is what it produces. A soak run
# answers a yes/no question about THAT run — did everything plateau — and the
# answer is only interesting as a sequence: one night proves nothing, thirty
# nights show a slope. So it is scheduled, and it prints its verdict table into
# `$GITHUB_STEP_SUMMARY` where it is readable from the run page. That is the
# specific failure of the old nightlies this does not repeat: an artifact is
# only read by someone who already suspects something.

on:
  schedule:
    # 02:30 UTC — an hour before the tmux matrix, two before the v86 sweep, so
    # the three nightlies never contend for runners.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      open_pr:
        description: 'Open a PR with the refreshed interaction baseline'
        type: boolean
        default: true
      soak:
        description: 'Also run the soak job (it is otherwise nightly-only)'
        type: boolean
        default: false

# The interaction-baseline job pushes a branch and opens a PR with the refreshed
# numbers; everything else here only reads.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-perf
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Axis C — generate a linux baseline for perf/interaction-baseline.json.
  #
  # The committed baseline holds only `darwin-arm64`, so the per-commit
  # `interaction-latency` job (which runs on ubuntu-latest) leaves its absolute
  # "baseline p50" column blank and rides on the ratio gate alone.
  #
  # The missing numbers CANNOT be written by hand: milliseconds only mean
  # something when they were measured by this harness, on this platform, on a
  # GitHub runner. So this job measures them where they apply and uploads the
  # result; a human downloads it, reviews it and commits it. CI never pushes a
  # baseline, exactly as docs/PERFORMANCE.md requires.
  #
  # HOW TO ADD / REFRESH THE LINUX BASELINE:
  #   1. Actions → "perf measurements" → Run workflow (workflow_dispatch).
  #   2. It opens a PR with the refreshed perf/interaction-baseline.json — the
  #      script merges rather than replaces, so `darwin-arm64` is left alone.
  #   3. READ THE NUMBERS, then merge. A runner having a bad night produces a
  #      baseline that hides real regressions for as long as it stands.
  #
  # A PR rather than a commit, and manual rather than nightly, for the same
  # reason: a baseline that refreshes itself ratchets to whatever the runner did
  # last, which is the opposite of a baseline. Uncheck `open_pr` for the
  # artifact alone.
  # ---------------------------------------------------------------------------
  interaction-baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libevent-dev libncurses-dev bison

      # Same source-built 3.7a and cache key as every other job: the binding
      # set and the run-shell cost this harness measures are version-sensitive,
      # and the baseline has to describe the tmux the gate job runs against.
      - uses: ./.github/actions/install-tmux

      - name: Install npm dependencies
        run: npm ci

      - uses: ./.github/actions/install-chromium

      - name: Build frontend
        run: npm run build -w tmuxy-ui

      # Release, like the gate job: a debug server's own slowness would be
      # baked into the baseline.
      - name: Build server (release)
        run: cargo build --release -p tmuxy-server

      - name: Link tmuxy CLI onto PATH
        run: sudo ln -sf "$GITHUB_WORKSPACE/bin/tmuxy-cli" /usr/local/bin/tmuxy

      - name: Start server
        run: |
          ./target/release/tmuxy-server 2>/tmp/tmuxy-server.log &
          bin/wait-for-server http://localhost:9000

      # More samples than the 12 the gate job uses: this number is committed
      # and lived with, so it is worth a steadier p50.
      - name: Measure interactions
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run perf:interactions -- \
            --url http://localhost:9000 \
            --samples 25 \
            --label ci-baseline \
            --out perf/interaction-report.json

      # --update-baseline merges this run into the committed file under its own
      # platform key, leaving `darwin-arm64` alone. continue-on-error because
      # the script exits non-zero when a RATIO budget is breached; that is the
      # gate job's business, and here it must not swallow the artifact.
      - name: Write the baseline
        continue-on-error: true
        run: |
          npm run perf:compare -- \
            --report perf/interaction-report.json \
            --update-baseline

      - name: Upload the refreshed baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interaction-baseline-${{ github.run_id }}
          path: |
            perf/interaction-baseline.json
            perf/interaction-report.json
          if-no-files-found: error

      # A PULL REQUEST, not a commit to main. A baseline measured on a runner
      # having a bad night hides real regressions for as long as it stands, so
      # it has to be read by a human before it counts — but reading it should
      # not also mean downloading an artifact and copying a file over by hand,
      # which is why this baseline has never actually been refreshed. The PR
      # keeps the review and removes the chore.
      #
      # `inputs.open_pr` defaults true; uncheck it to get only the artifact.
      - name: Open a PR with the refreshed baseline
        if: inputs.open_pr
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if git diff --quiet -- perf/interaction-baseline.json; then
            echo "Baseline unchanged - nothing to open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="perf/interaction-baseline-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add perf/interaction-baseline.json

          # Bodies come from files: a -m string written inline in a YAML block
          # scalar carries the block's own indentation into the message.
          {
            printf '%s\n\n' "⚡ refresh the linux interaction baseline"
            printf '%s\n' "Measured by the \"perf measurements\" workflow on ubuntu-latest,"
            printf '%s\n\n' "25 samples. Run: $RUN_URL"
            printf '%s\n' "Read the numbers before merging: a runner having a bad night produces"
            printf '%s\n' "a baseline that hides real regressions for as long as it stands."
          } > /tmp/commit-msg
          git commit -F /tmp/commit-msg
          git push origin "$BRANCH"

          {
            printf '%s\n\n' 'Refreshed `perf/interaction-baseline.json` from a measured run on `ubuntu-latest` (25 samples).'
            printf '%s\n\n' 'The script merges rather than replaces, so the existing `darwin-arm64` entry is untouched.'
            printf '%s\n' '**Before merging:** read the milliseconds. This file is what the absolute-ms'
            printf '%s\n\n' 'column compares against, so a slow runner here quietly raises the bar for every future run.'
            printf '%s\n' "Run: $RUN_URL"
          } > /tmp/pr-body

          gh pr create \
            --title "⚡ refresh the linux interaction baseline (run ${{ github.run_id }})" \
            --body-file /tmp/pr-body \
            --base main \
            --head "$BRANCH"

          echo "Opened a PR with the refreshed baseline." >> "$GITHUB_STEP_SUMMARY"

      - name: Say where the baseline went
        if: always()
        run: |
          {
            echo "### Interaction baseline"
            echo ""
            if [ "${{ inputs.open_pr }}" = "true" ]; then
              echo "A PR was opened if the numbers changed; the \`interaction-baseline-${{ github.run_id }}\` artifact has them either way."
            else
              echo "Artifact only (\`open_pr\` was unchecked). Download \`interaction-baseline-${{ github.run_id }}\`,"
              echo "review the numbers, and commit \`perf/interaction-baseline.json\` yourself."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Server logs (debug)
        if: failure()
        run: tail -2000 /tmp/tmuxy-server.log

  # ---------------------------------------------------------------------------
  # Does a long session degrade?
  #
  # Non-blocking on purpose, and `--gate` is deliberately absent: the harness's
  # plateau tolerances are guesses until there is a corpus of nightly runs to
  # calibrate them against, and a guessed threshold on a long job produces a
  # nightly nobody trusts. The step summary carries the numbers every night;
  # once their shape is known, add `--gate` here and the guesses become budgets.
  #
  # Smaller load than the harness defaults: a shared runner is slower than a
  # dev machine at both halves, and the plateau comparison needs the WINDOWS to
  # be clean more than it needs them to be large.
  # ---------------------------------------------------------------------------
  soak:
    if: github.event_name == 'schedule' || inputs.soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libevent-dev libncurses-dev bison

      # The same source-built 3.7a and cache key as every other job: a leak in
      # pane teardown is version-sensitive, and the answer has to be about the
      # tmux the rest of CI runs against.
      - uses: ./.github/actions/install-tmux

      - name: Install npm dependencies
        run: npm ci

      - uses: ./.github/actions/install-chromium

      - name: Build frontend
        run: npm run build -w tmuxy-ui

      # Release: a debug server's own allocation behaviour is not the thing
      # being measured, and its RSS would swamp the signal.
      - name: Build server (release)
        run: cargo build --release -p tmuxy-server

      - name: Link tmuxy CLI onto PATH
        run: sudo ln -sf "$GITHUB_WORKSPACE/bin/tmuxy-cli" /usr/local/bin/tmuxy

      # The pid is captured here rather than discovered: the harness reads
      # server RSS for it, and a wrong pid reports `not measured` rather than
      # failing, which would quietly drop a third of the signal.
      # A socket of its own, not the default `tmuxy`. The runner is empty so
      # nothing would collide today, but the harness types into whichever pane
      # is active and splits panes in the session it is given — on any machine
      # that is not empty, the default socket is someone's working session.
      - name: Start server
        run: |
          TMUX_SOCKET=tmuxy-soak ./target/release/tmuxy-server 2>/tmp/tmuxy-server.log &
          echo "TMUXY_SERVER_PID=$!" >> "$GITHUB_ENV"
          bin/wait-for-server http://localhost:9000

      - name: Soak the session
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run perf:soak -- \
            --url http://localhost:9000 \
            --output-mb 16 \
            --cycles 120 \
            --windows 8 \
            --label ci-nightly \
            --server-pid "$TMUXY_SERVER_PID" \
            --out perf/soak-report.json \
            | tee /tmp/soak.log

      # The point of the job: readable from the run page, without downloading
      # anything. A reader who has to fetch an artifact to find out whether
      # last night was fine does not find out.
      - name: Summarise
        if: always()
        run: |
          {
            echo '## Soak — does a long session degrade?'
            echo
            echo '16MB of output, 120 split/kill cycles, 8 sample windows per phase.'
            echo 'Each measure compares the second half of the run to the first:'
            echo 'growth within tolerance is a plateau, above it is a possible leak.'
            echo 'Not gating yet — see the harness header.'
            echo
            echo '```'
            sed -n '/^output:/,$p' /tmp/soak.log || echo '(no table — the run failed before measuring)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the soak report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-report-${{ github.run_id }}
          path: perf/soak-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Server logs (debug)
        if: failure()
        run: tail -2000 /tmp/tmuxy-server.log
