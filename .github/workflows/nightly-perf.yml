name: nightly perf

# The perf measurements (docs/PERFORMANCE.md has the reasoning for each):
#
#   interaction-baseline  on demand — measures Axis C on ubuntu-26.04 and
#                         opens a PR with a refreshed tests/perf/interaction-baseline.json
#   interaction-latency   nightly — Axis C, web and desktop: the ratio budgets
#                         in compare-interactions.mjs fail the run
#   core-bench            nightly — Axis A: the parse → aggregate → delta
#                         pipeline bench; its ratio budget fails the run
#   soak                  nightly — Axis D, does a long session degrade; its
#                         verdict table goes into the run summary
#
# Nightly, not per commit: with no branch protection a per-commit gate is
# informational anyway, and together they cost ~6 runner minutes per push, 3
# of them on the critical path (the desktop measurement needs the release
# Tauri build). A regression shows the next morning, as a red nightly.

on:
  schedule:
    # 02:30 UTC — an hour before the tmux matrix, two before the v86 sweep, so
    # the three nightlies never contend for runners.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      open_pr:
        description: 'Open a PR with the refreshed interaction baseline'
        type: boolean
        default: true
      soak:
        description: 'Also run the soak job (it is otherwise nightly-only)'
        type: boolean
        default: false
      gates:
        description: 'Also run the nightly gates (interaction latency, core bench)'
        type: boolean
        default: false

# The interaction-baseline job pushes a branch and opens a PR with the refreshed
# numbers, so it alone asks for write; everything else here only reads, and
# the nightly jobs build and run third-party code on a schedule.
permissions:
  contents: read

concurrency:
  group: nightly-perf
  cancel-in-progress: false

jobs:
  # The frontend and the release server, built once for every job below that
  # drives them. Release, not debug or the per-commit `ci` profile: a slower
  # server's own cost would swamp the differences between interactions these
  # harnesses exist to see, and a baseline has to describe what ships. Every
  # trigger runs at least one consumer, so this job has no condition.
  build-artifacts:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/build-frontend

      - uses: ./.github/actions/build-server
        with:
          profile: release

  # Axis C on the platform the gate job runs on. Actions → "nightly perf"
  # → Run workflow; read the numbers in the PR it opens, then merge. Uncheck
  # `open_pr` for the artifact alone.
  interaction-baseline:
    if: github.event_name == 'workflow_dispatch'
    needs: build-artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust
        with:
          rust: none

      # Same source-built pinned tmux and cache key as every other job: the binding
      # set and the run-shell cost this harness measures are version-sensitive,
      # and the baseline has to describe the tmux the gate job runs against.
      - uses: ./.github/actions/install-tmux

      - uses: ./.github/actions/install-chromium
        with:
          export-path: 'true'

      - uses: ./.github/actions/start-test-server

      # More samples than the 12 the gate job uses: this number is committed
      # and lived with, so it is worth a steadier p50.
      - name: Measure interactions
        run: |
          npm run perf:interactions -- \
            --url http://localhost:9000 \
            --samples 25 \
            --label ci-baseline \
            --out tests/perf/interaction-report.json

      # --update-baseline merges this run into the committed file under its own
      # platform key, leaving `darwin-arm64` alone. continue-on-error because
      # the script exits non-zero when a RATIO budget is breached; that is the
      # gate job's business, and here it must not swallow the artifact.
      - name: Write the baseline
        continue-on-error: true
        run: |
          npm run perf:compare -- \
            --report tests/perf/interaction-report.json \
            --update-baseline

      - name: Upload the refreshed baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: interaction-baseline-${{ github.run_id }}
          path: |
            tests/perf/interaction-baseline.json
            tests/perf/interaction-report.json
          if-no-files-found: error

      # A pull request, not a commit to main: the numbers are read before they
      # count (docs/PERFORMANCE.md, Axis C "Running it").
      - name: Open a PR with the refreshed baseline
        if: inputs.open_pr
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if git diff --quiet -- tests/perf/interaction-baseline.json; then
            echo "Baseline unchanged - nothing to open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="perf/interaction-baseline-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tests/perf/interaction-baseline.json

          # Bodies come from files: a -m string written inline in a YAML block
          # scalar carries the block's own indentation into the message.
          {
            printf '%s\n\n' "⚡ refresh the linux interaction baseline"
            printf '%s\n' "Measured by the \"nightly perf\" workflow on ubuntu-26.04,"
            printf '%s\n\n' "25 samples. Run: $RUN_URL"
            printf '%s\n' "Read the numbers before merging: a runner having a bad night produces"
            printf '%s\n' "a baseline that hides real regressions for as long as it stands."
          } > /tmp/commit-msg
          git commit -F /tmp/commit-msg
          # --no-verify: the repo's pre-push hook (installed by `npm ci`) runs
          # clippy over every crate, and this runner has no GTK headers for the
          # desktop one, so the push died in `glib-sys`. The branch holds one
          # JSON file, and the PR runs the full CI before anyone merges it.
          git push --no-verify origin "$BRANCH"

          {
            printf '%s\n\n' 'Refreshed `tests/perf/interaction-baseline.json` from a measured run on `ubuntu-26.04` (25 samples).'
            printf '%s\n\n' 'The script merges rather than replaces, so the existing `darwin-arm64` entry is untouched.'
            printf '%s\n' '**Before merging:** read the milliseconds. This file is what the absolute-ms'
            printf '%s\n\n' 'column compares against, so a slow runner here quietly raises the bar for every future run.'
            printf '%s\n' "Run: $RUN_URL"
          } > /tmp/pr-body

          gh pr create \
            --title "⚡ refresh the linux interaction baseline (run ${{ github.run_id }})" \
            --body-file /tmp/pr-body \
            --base main \
            --head "$BRANCH"

          echo "Opened a PR with the refreshed baseline." >> "$GITHUB_STEP_SUMMARY"

      - name: Say where the baseline went
        if: always()
        run: |
          {
            echo "### Interaction baseline"
            echo ""
            if [ "${{ inputs.open_pr }}" = "true" ]; then
              echo "A PR was opened if the numbers changed; the \`interaction-baseline-${{ github.run_id }}\` artifact has them either way."
            else
              echo "Artifact only (\`open_pr\` was unchecked). Download \`interaction-baseline-${{ github.run_id }}\`,"
              echo "review the numbers, and commit \`tests/perf/interaction-baseline.json\` yourself."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Server logs (debug)
        if: failure()
        run: tail -2000 /tmp/tmuxy-server.log

  # Axis C, web. Gates on the ratio of each interaction to this run's own
  # keystroke echo (compare-interactions.mjs); absolute milliseconds only warn.
  interaction-latency:
    if: github.event_name == 'schedule' || inputs.gates
    needs: build-artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust
        with:
          rust: none

      # Same tmux the e2e job pins — the binding set and the run-shell cost
      # this harness measures are version-sensitive.
      - uses: ./.github/actions/install-tmux

      - uses: ./.github/actions/install-chromium
        with:
          export-path: 'true'

      - uses: ./.github/actions/start-test-server

      - name: Measure interactions
        run: |
          npm run perf:interactions -- \
            --url http://localhost:9000 \
            --samples 12 \
            --label ci \
            --out tests/perf/interaction-report.json

      - name: Compare against budgets and baseline
        run: npm run perf:compare -- --report tests/perf/interaction-report.json

      - name: Upload interaction report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: interaction-latency-${{ github.run_id }}
          path: tests/perf/interaction-report.json

      - name: Server logs (debug)
        if: failure()
        run: tail -2000 /tmp/tmuxy-server.log

  # Axis C, desktop: the same interactions over Tauri IPC instead of POST +
  # SSE — a different transport with a different cost. Needs the release
  # Tauri binary (a debug build's own slowness would swamp the signal), which
  # the per-commit `desktop` job does not build.
  #
  # Its own tmux socket (`tmuxy-perf`, set by the harness).
  interaction-latency-desktop:
    if: github.event_name == 'schedule' || inputs.gates
    needs: build-artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust

      - uses: ./.github/actions/install-desktop-test-deps

      - uses: ./.github/actions/install-tmux

      - name: Download frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: packages/tmuxy-ui/dist

      - name: Build Tauri app (release)
        run: npx tauri build --no-bundle --config '{"build":{"beforeBuildCommand":""}}'
        working-directory: packages/tmuxy-tauri-app

      - uses: ./.github/actions/start-xvfb

      - name: Measure interaction latency (desktop)
        env:
          DISPLAY: ':99'
        run: |
          npm run perf:interactions:tauri -- \
            --binary "$GITHUB_WORKSPACE/target/release/tmuxy" \
            --samples 12 \
            --label ci-desktop \
            --out tests/perf/interaction-report-tauri.json

      - name: Compare against budgets and baseline (desktop)
        run: npm run perf:compare -- --report tests/perf/interaction-report-tauri.json

      # Also the source a human promotes into tests/perf/interaction-baseline.json
      # for the `linux-x64/tauri` key; CI never writes a baseline itself.
      - name: Upload desktop interaction report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: interaction-latency-desktop-${{ github.run_id }}
          path: tests/perf/interaction-report-tauri.json

      - name: Stop Xvfb
        if: always()
        run: kill "$XVFB_PID" 2>/dev/null || true

  # Axis A: the parse → aggregate → delta pipeline, the exact code tmuxy-wasm
  # runs. The ratio budget in compare-core-bench.mjs fails the run if a
  # metadata-only delta ever costs like a full snapshot again; the absolute
  # nanoseconds only warn against tests/perf/core-pipeline-baseline.json.
  core-bench:
    if: github.event_name == 'schedule' || inputs.gates
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust
        with:
          install-npm: 'false'

      - uses: ./.github/actions/install-linux-deps

      - name: Frontend dist placeholder
        run: mkdir -p packages/tmuxy-ui/dist

      - name: Core pipeline bench
        run: cargo bench -p tmuxy-core --bench core_pipeline

      - name: Compare bench ratios and baseline
        run: node tests/perf/compare-core-bench.mjs --threshold 20

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-pipeline-bench-${{ github.run_id }}
          path: tests/perf/core-pipeline-report.json
          if-no-files-found: error

  # Axis D. `--gate` is absent on purpose: the plateau tolerances are guesses
  # until a corpus of nightly runs calibrates them (docs/PERFORMANCE.md).
  soak:
    if: github.event_name == 'schedule' || inputs.soak
    needs: build-artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust
        with:
          rust: none

      # The same source-built pinned tmux and cache key as every other job: a leak in
      # pane teardown is version-sensitive, and the answer has to be about the
      # tmux the rest of CI runs against.
      - uses: ./.github/actions/install-tmux

      - uses: ./.github/actions/install-chromium
        with:
          export-path: 'true'

      # The pid (TMUXY_SERVER_PID) is the one the action started rather than
      # one discovered: the harness reads server RSS for it, and a wrong pid
      # reports `not measured` rather than failing, which would quietly drop a
      # third of the signal.
      # A socket of its own, not the default `tmuxy`. The runner is empty so
      # nothing would collide today, but the harness types into whichever pane
      # is active and splits panes in the session it is given — on any machine
      # that is not empty, the default socket is someone's working session.
      - uses: ./.github/actions/start-test-server
        env:
          TMUX_SOCKET: tmuxy-soak

      # The socket again, for the harness's own CLI calls: the step above
      # sets it for the server only. Without it the CLI looked on the default
      # socket, found no pane, and the run stopped at its first line with the
      # job still green (`| tee` hid the exit status, hence pipefail).
      - name: Soak the session
        run: |
          set -o pipefail
          npm run perf:soak -- \
            --url http://localhost:9000 \
            --socket tmuxy-soak \
            --output-mb 16 \
            --cycles 120 \
            --windows 8 \
            --label ci-nightly \
            --server-pid "$TMUXY_SERVER_PID" \
            --out tests/perf/soak-report.json \
            | tee /tmp/soak.log

      - name: Summarise
        if: always()
        run: |
          {
            echo '## Soak — does a long session degrade?'
            echo
            echo '16MB of output, 120 split/kill cycles, 8 sample windows per phase.'
            echo 'Each measure compares the second half of the run to the first:'
            echo 'growth within tolerance is a plateau, above it is a possible leak.'
            echo 'Not gating yet — see the harness header.'
            echo
            echo '```'
            sed -n '/^output:/,$p' /tmp/soak.log || echo '(no table — the run failed before measuring)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the soak report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: soak-report-${{ github.run_id }}
          path: tests/perf/soak-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Server logs (debug)
        if: failure()
        run: tail -2000 /tmp/tmuxy-server.log
