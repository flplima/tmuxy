name: ci rust tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-rust
        with:
          install-npm: 'false'

      - uses: ./.github/actions/install-linux-deps
        with:
          profile: rust

      - name: Cache tmux 3.7a
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/bin/tmux
            /usr/local/share/tmux
          key: ${{ runner.os }}-tmux-3.7a-v1

      - name: Build tmux 3.7a (cache miss)
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/tmux/tmux/releases/download/3.7a/tmux-3.7a.tar.gz | tar xz
          cd tmux-3.7a && ./configure && make -j$(nproc) && sudo make install
          cd .. && rm -rf tmux-3.7a

      - name: Confirm tmux version
        run: tmux -V

      - name: Frontend dist placeholder
        run: mkdir -p packages/tmuxy-ui/dist

      - name: Cargo test
        run: cargo test --workspace

      # Axis A (docs/PERFORMANCE.md): the parse → aggregate → delta pipeline,
      # the exact code tmuxy-wasm runs. `criterion_group!` caps measurement at
      # 3s per benchmark, so the measuring is well under a minute on top of the
      # release compile.
      #
      # It runs here, per commit, rather than only in the on-demand perf
      # workflow, because the thing it guards is structural: the ratio budget
      # in compare-core-bench.mjs fails if a metadata-only delta ever costs
      # like a full snapshot again. That needs no baseline and is immune to
      # runner load, so it is a legitimate merge gate — unlike the absolute
      # nanoseconds, which stay warn-only.
      - name: Core pipeline bench
        run: cargo bench -p tmuxy-core --bench core_pipeline

      - name: Compare bench ratios and baseline
        run: node perf/compare-core-bench.mjs --threshold 20

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-pipeline-bench-${{ github.sha }}
          path: perf/core-pipeline-report.json
          if-no-files-found: warn
