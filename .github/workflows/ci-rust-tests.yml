name: ci rust tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust
        with:
          install-npm: 'false'

      - uses: ./.github/actions/install-linux-deps

      - uses: ./.github/actions/install-tmux

      - name: Frontend dist placeholder
        run: mkdir -p packages/tmuxy-ui/dist

      - name: Cargo test
        run: cargo test --workspace
