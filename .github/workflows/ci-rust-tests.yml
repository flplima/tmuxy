name: ci rust tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-rust
        with:
          install-npm: 'false'

      - uses: ./.github/actions/install-linux-deps
        with:
          profile: rust

      - uses: ./.github/actions/install-tmux

      - name: Frontend dist placeholder
        run: mkdir -p packages/tmuxy-ui/dist

      # The Axis A bench (docs/PERFORMANCE.md) is not here: it compiles
      # tmuxy-core a second time under the release profile for a ratio that
      # has not moved in months. It runs nightly in nightly-perf.yml, where
      # its ratio budget still fails the run.
      - name: Cargo test
        run: cargo test --workspace
