name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/**
      - bin/bootstrap
      - bin/install-dev-tools
      - bin/toolchain
      - package-lock.json
      - Cargo.lock
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/**
      - bin/bootstrap
      - bin/install-dev-tools
      - bin/toolchain
      - package-lock.json
      - Cargo.lock

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-26.04
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-rust
        with:
          rust: guest

      - uses: ./.github/actions/install-linux-deps

      # The same list the devcontainer image installs, so the two agent
      # environments cannot drift apart.
      - name: Install shared agent tooling
        run: bash bin/install-dev-tools

      - uses: ./.github/actions/install-tmux

      - name: Bootstrap repository for agents
        run: bash bin/bootstrap
