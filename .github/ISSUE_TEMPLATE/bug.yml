name: Bug Report
description: Something in tmuxy does not work as it should
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the existing issues first.

        [Reporting an issue](https://github.com/flplima/tmuxy/blob/main/docs/REPORTING-ISSUES.md) says what helps most, and how to attach an action trace without sharing anything private. A security problem goes in a [private advisory](https://github.com/flplima/tmuxy/security/advisories/new), not here.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: In order, from a fresh start if you can.
      placeholder: |
        1. Run `...`
        2. Click on `...`
        3. See error
    validations:
      required: true
  - type: input
    id: tmux-version
    attributes:
      label: tmux version
      description: 'Output of `tmux -V`. The most important one: each tmux version has control-mode bugs of its own.'
      placeholder: 'tmux 3.5a'
    validations:
      required: true
  - type: input
    id: tmuxy-version
    attributes:
      label: tmuxy version
      description: Output of `tmuxy --version`
      placeholder: 'tmuxy 0.1.6'
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: How you run tmuxy
      options:
        - Desktop app
        - Web app, in a browser on the same machine
        - Web app, from another machine (VPN, SSH tunnel, reverse proxy)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      description: Of the machine running tmuxy.
      options:
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How you installed it
      description: Homebrew, a .dmg, an AppImage, a .deb, built from source…
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser
      description: For the web app.
      placeholder: 'Firefox 140 on Android'
    validations:
      required: false
  - type: textarea
    id: trace
    attributes:
      label: Trace slice
      description: |
        Optional, and the fastest way to see what tmuxy did. Taken at the `Shape` level with `tmuxy trace --last 20 > tmuxy-trace-slice.ndjson`, and checked as [Reporting an issue](https://github.com/flplima/tmuxy/blob/main/docs/REPORTING-ISSUES.md) says. Drag the file here.
    validations:
      required: false
  - type: checkboxes
    id: trace-checked
    attributes:
      label: Before attaching a trace
      options:
        - label: I took it at the `Shape` level and read it, and it holds nothing I would not post publicly.
          required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Anything else
      description: Screenshots, the browser console's errors, `tmuxy.log` lines. Read logs before posting them; they can quote a command or a folder name.
    validations:
      required: false
