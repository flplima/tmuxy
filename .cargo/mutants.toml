# cargo-mutants — does the Rust suite actually bite?
#
# A passing test suite says the code does what the tests check. It does not say
# the tests check anything: a test that asserts a function was called, or that
# re-states the implementation, passes whatever the function does. Mutation
# testing answers the other question by breaking the code on purpose — flip a
# comparison, return a default, drop a branch — and seeing whether any test
# notices. A mutant that survives names a line nothing is really testing.
#
# ## Scoped on purpose
#
# The whole workspace would take hours and report mostly on code whose
# correctness is not load-bearing. These four files are where a silent wrong
# answer is worst:
#
#   * command_router.rs — decides which tmux commands a client may run. A
#     mutant that survives here is a security boundary nothing tests.
#   * request_guard.rs — the HTTP-side half of the same question: which
#     requests are allowed to reach the command path at all.
#   * control_mode/parser.rs — turns tmux's control-mode stream into events.
#     Everything downstream believes whatever this says.
#
# (The fourth critical module, the frontend's deltaProtocol, is TypeScript and
# runs under Stryker instead — `npm run mutants:ui`.)
#
# ## Reading the result
#
# CAUGHT is good: a test failed, so that line is really tested. MISSED means
# the suite passed with the code broken. UNVIABLE (did not compile) and TIMEOUT
# are not findings — the first is a mutant the type system already rejects, the
# second usually an infinite loop the mutation created.
#
# `--baseline=skip` is NOT set: the unmutated tree is tested first on purpose,
# so a report can never be a long list of "missed" produced by a suite that was
# already broken.

# Only the modules above. cargo-mutants takes globs relative to the workspace
# root; naming files rather than a directory keeps the scope honest when
# someone adds a module next to them.
examine_globs = [
    "packages/tmuxy-core/src/command_router.rs",
    "packages/tmuxy-core/src/control_mode/parser.rs",
    "packages/tmuxy-server/src/request_guard.rs",
]

# The suite needs a frontend bundle to exist (the server embeds it) and a
# terminal type, the same two things `cargo test --workspace` needs in CI.
additional_cargo_args = ["--workspace"]

# A mutant that hangs is not a finding, and a handful of them otherwise
# dominate the run. 20s is well above the whole suite's own 0.4s; the flag
# equivalent is `--timeout 20`.
minimum_test_timeout = 20

# Mutations in the derived-trait impls say nothing about behaviour: a Debug
# string or a Default that returns something else is not a bug these tests
# exist to catch.
exclude_re = [
    "impl Debug",
    "impl Default",
    "impl Display",
]
