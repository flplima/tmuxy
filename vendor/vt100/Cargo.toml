# The tmuxy fork of vt100 0.16.2 — see README.md and PATCHES.md. The version
# stays at upstream's so `[patch.crates-io]` in the root Cargo.toml matches
# tmuxy-core's `vt100 = "0.16"` requirement.

[package]
edition = "2021"
rust-version = "1.70"
name = "vt100"
version = "0.16.2"
authors = ["Jesse Luehrs <doy@tozt.net>"]
description = "Library for parsing terminal data"
homepage = "https://github.com/doy/vt100-rust"
readme = "README.md"
license = "MIT"
repository = "https://github.com/doy/vt100-rust"

[lib]
name = "vt100"
path = "src/lib.rs"

[dependencies]
itoa = "1.0.15"
unicode-width = "0.2.1"
vte = "0.15.0"

[dev-dependencies]
nix = { version = "0.30.1", features = ["term"] }
quickcheck = "1.0"
rand = "0.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
terminal_size = "0.4.2"

[workspace]
