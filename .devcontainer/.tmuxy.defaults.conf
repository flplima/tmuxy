# Tmuxy Application Configuration
# This config is used by the tmuxy web application when managing tmux sessions
# Includes sane defaults commonly used by developers
#
# NOTE: Critical settings (pane-border-status, mouse, focus-events, etc.)
# are enforced per-session by the Rust server's enforce_settings() on each
# control mode connection. They are NOT set here as globals to avoid a
# tmux 3.5a bug where global settings + control mode + new-session crashes.

# ============================================
# Tmuxy Command Aliases
# ============================================

# Pane group operations (run-shell scripts with tmux format strings).
# Scripts are mirrored to $HOME/.config/tmuxy/bin/ on launch so paths are
# stable regardless of the .app's working directory (which is `/` when
# launched from Finder/Spotlight on macOS).
set -s command-alias[100] 'tmuxy-pane-group-add=run-shell "$HOME/.config/tmuxy/bin/tmuxy/pane-group-add #{pane_id} #{pane_width} #{pane_height}"'
set -s command-alias[101] 'tmuxy-pane-group-prev=run-shell "$HOME/.config/tmuxy/bin/tmuxy/pane-group-prev #{pane_id}"'
set -s command-alias[102] 'tmuxy-pane-group-next=run-shell "$HOME/.config/tmuxy/bin/tmuxy/pane-group-next #{pane_id}"'

# Unified navigation (group members → splits → sidebar columns)
set -s command-alias[110] 'tmuxy-nav-left=run-shell "bash $HOME/.config/tmuxy/bin/tmuxy/nav left #{pane_id}"'
set -s command-alias[111] 'tmuxy-nav-right=run-shell "bash $HOME/.config/tmuxy/bin/tmuxy/nav right #{pane_id}"'
set -s command-alias[112] 'tmuxy-nav-up=run-shell "bash $HOME/.config/tmuxy/bin/tmuxy/nav up #{pane_id}"'
set -s command-alias[113] 'tmuxy-nav-down=run-shell "bash $HOME/.config/tmuxy/bin/tmuxy/nav down #{pane_id}"'
set -s command-alias[114] 'tmuxy-nav-next=run-shell "bash $HOME/.config/tmuxy/bin/tmuxy/nav next #{pane_id}"'
set -s command-alias[115] 'tmuxy-nav-prev=run-shell "bash $HOME/.config/tmuxy/bin/tmuxy/nav prev #{pane_id}"'

# Collapsible panes (zellij-style stacks): add a first-level row and turn the
# window collapsible; `-off` turns it off and evens the rows back out, and
# `-toggle` flips whichever way the window is currently set.
set -s command-alias[120] 'tmuxy-stack=run-shell "bash $HOME/.config/tmuxy/bin/tmuxy/stack new #{pane_id}"'
set -s command-alias[121] 'tmuxy-stack-off=run-shell "bash $HOME/.config/tmuxy/bin/tmuxy/stack off #{window_id}"'
set -s command-alias[122] 'tmuxy-stack-toggle=run-shell "bash $HOME/.config/tmuxy/bin/tmuxy/stack toggle #{window_id}"'


# ============================================
# Tmuxy Window Appearance (Tauri desktop app)
# ============================================

# Appearance — how much of each surface's background is painted
# (0.0 = fully transparent, 1.0 = fully opaque). Same on the desktop app and
# the web UI; what shows through the remainder is the blurred desktop (macOS),
# the desktop (Linux) or the theme background (browser).
#
# Window chrome: title bar, sidebar, the gaps between panes.
set -g @tmuxy-opacity 0.7
# Pane surfaces (the theme's terminal background).
set -g @tmuxy-active-pane-opacity 1
set -g @tmuxy-inactive-pane-opacity 0.7
# Pane content (header + text) — the inactive dim is the focus cue.
set -g @tmuxy-active-text-opacity 1
set -g @tmuxy-inactive-text-opacity 0.7

# Native blur behind the window (macOS only; accepted and ignored elsewhere).
set -g @tmuxy-blur on
# Layout animations: pane morphs on split/close, swaps, resizes, float keyframes.
set -g @tmuxy-animations on
# Blinking cursor. An application asking for a steady cursor (DECSCUSR 2/4/6)
# still gets one; off makes every cursor steady. Toggle it from View > Blinking
# Cursor and the choice is remembered.
set -g @tmuxy-cursor-blink on
# Cards per row in the "all tabs" view (ctrl+0), 1–12. Phone-width windows
# show at most 2.
set -g @tmuxy-tab-overview-cols 3
# Trackpad gestures. The view follows the fingers while they move and the
# action lands when they lift; turning one off hands the gesture back to the
# browser or webview.
# Two-finger slide left/right: next / previous tab.
set -g @tmuxy-gesture-swipe-tabs on
# Pinch out on a pane: zoom it. Pinch in while zoomed: unzoom.
set -g @tmuxy-gesture-pinch-zoom on
# Pinch in on an unzoomed tab: open the "all tabs" view.
set -g @tmuxy-gesture-pinch-overview on

# ============================================
# Terminal Settings
# ============================================

# Use 256 colors with true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# No delay for escape sequences (important for vim/neovim)
set -sg escape-time 0

# Faster key repeat
set -g repeat-time 300

# Large scrollback history
set -g history-limit 100000

# ============================================
# Prefix Key: Ctrl+a (screen-style)
# ============================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Double Ctrl+a sends literal Ctrl+a to application
bind a send-prefix

# ============================================
# Window & Pane Numbering
# ============================================

# Start windows and panes at 1 (easier keyboard access)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# ============================================
# Vi Mode & Copy Mode
# ============================================

# Vi mode for copy mode and status line editing
setw -g mode-keys vi
set -g status-keys vi

# Vi-style copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel

# Releasing a mouse drag copies the selection and leaves copy mode, as tmux
# does by default. tmuxy's client-side copy mode does the same on release, and
# blinks the copied text first.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Search in copy mode (vi-style)
bind-key -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""

# ============================================
# Intuitive Split Bindings
# ============================================

# Split with - and | (opens in current directory)
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# Also bind " and % to use current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# ============================================
# Pane Navigation (Unified: group members → splits → sidebar columns)
# ============================================

# Alt+hjkl - unified navigation without prefix.
#
# NOT Ctrl+hjkl. Those four belong to the terminal and to readline: Ctrl+L
# clears the screen, Ctrl+K kills to end of line, Ctrl+H is backspace, and vim
# uses all four for its own window moves. Binding them at the root took them
# away from every program in every pane, with no passthrough, which is a worse
# trade than a less familiar nav key. Alt+hjkl collides with nothing readline
# or vim claims, and the frontend already translates macOS's Option+hjkl
# characters into M-h/j/k/l (see MACOS_OPTION_KEY_MAP in keyboardActor.ts).
bind -n M-h tmuxy-nav-left
bind -n M-j tmuxy-nav-down
bind -n M-k tmuxy-nav-up
bind -n M-l tmuxy-nav-right

# Ctrl+arrow keys - unified navigation without prefix
bind -n C-Left tmuxy-nav-left
bind -n C-Right tmuxy-nav-right
bind -n C-Up tmuxy-nav-up
bind -n C-Down tmuxy-nav-down

# ============================================
# Pane Resizing
# ============================================

# Prefix + HJKL for resizing panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Prefix + arrow keys for fine-grained resizing
bind -r Left resize-pane -L 2
bind -r Down resize-pane -D 2
bind -r Up resize-pane -U 2
bind -r Right resize-pane -R 2

# ============================================
# Tab Selection (Ctrl+number, without prefix)
# ============================================

# ctrl+0..9 are handled by the tmuxy client, not here: ctrl+1..9 select a tab
# by its position in the tab strip (tmux window indices have gaps where
# tmuxy's chrome windows sit) and ctrl+0 opens the Tab Overview.

# Tab navigation (Ctrl+Tab / Ctrl+Shift+Tab)
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# prefix t - toggle the left sidebar. The sidebar is a client-side React tree
# (SidebarTree) with no tmux window/pane; the web UI and Tauri app intercept
# `t` in the keyboard actor and flip the drawer locally, so there is no
# server-side binding to run. Unbind (rather than leave the old
# `run-shell sidebar-create` binding, whose script no longer exists — its
# error output would open a view/copy-mode pane) so a raw native tmux client
# (`tmux -L tmuxy attach`), which has no sidebar, just no-ops on `prefix t`.
# `unbind` also clears the stale binding when this config is reloaded.
unbind t

# ============================================
# Useful Shortcuts
# ============================================

# Reload config
bind r source-file ~/.config/tmuxy/tmuxy.conf \; display "Config reloaded!"


# Add pane to group (tmuxy tabs)
bind = tmuxy-pane-group-add

# Collapsible panes (zellij-style stacks): prefix + s adds a first-level row
# and turns the window collapsible — only the row holding the active pane is
# expanded, the others collapse to their headers, and focus moves the expanded
# row. prefix + S is the switch on its own: it stacks the rows the window
# already has, and unstacks them again, so the same key gets you both ways.
# Nested panes inside a row are never touched. The backend does the reshaping
# (tmuxy-core `layout.rs`), so there is no hook here.
bind s tmuxy-stack
bind S tmuxy-stack-toggle

# Quick pane swap
bind > swap-pane -D
bind < swap-pane -U

# Zoom pane (already default: prefix + z)
# Break pane to new window (already default: prefix + !)
# Join pane from another window
bind j choose-window "join-pane -h -s '%%'"

# ============================================
# Hooks
# ============================================


# ============================================
# Activity Monitoring
# ============================================

setw -g monitor-activity on
set -g visual-activity off

# ============================================
# Status Bar (Tmuxy manages the UI status)
# ============================================

set -g status on
set -g status-interval 1
set -g status-style 'bg=green,fg=black'
set -g status-left '#[bold][#S] '
set -g status-left-length 30
set -g status-right '#(whoami)@#H'
set -g status-right-length 50

# Window list hidden - managed by tmuxy UI
setw -g window-status-format ''
setw -g window-status-current-format ''

# ============================================
# Pane Appearance
# ============================================

# Pane borders (cosmetic — not the critical border-status settings)
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# pane-border-status, pane-border-format, mouse, focus-events,
# allow-passthrough, allow-rename, set-titles, window-size, and
# aggressive-resize are enforced per-session by the Rust server.

# ============================================
# Window Settings
# ============================================

# Automatic window rename based on running command
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
