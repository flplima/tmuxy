[workspace]
resolver = "2"
members = [
    "packages/tmuxy-core",
    "packages/tmuxy-tauri-app",
    "packages/tmuxy-server",
    "packages/tmuxy-wasm",
    "packages/tmuxy-tree",
    "packages/tmuxy-group",
]

[workspace.package]
version = "0.0.10-alpha.70"
edition = "2021"
authors = ["Felipe"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.release.package.tmuxy-tauri-app]
strip = false

# The server the E2E suites run against on CI: optimised like a release
# build, but without the fat-LTO, single-codegen-unit link, which is most of
# a minute on a runner and buys nothing a functional test can see. The
# binary that ships is still built with `release`, by build-app.yml.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

[patch.crates-io]
vt100 = { path = "vendor/vt100" }
