[workspace]
resolver = "2"
members = [
    "packages/tmuxy-core",
    "packages/tmuxy-tauri-app",
    "packages/tmuxy-server",
    "packages/tmuxy-wasm",
    "packages/tmuxy-group",
    "packages/tmuxy-pty",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["Felipe"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Pinned once for the crates that share them (a crate adds its own features).
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6.0"
nix = { version = "0.29", features = ["process"] }
thiserror = "2"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.release.package.tmuxy-tauri-app]
strip = false

# The server the E2E suites run against on CI: optimised like a release
# build, but without the fat-LTO, single-codegen-unit link, which is most of
# a minute on a runner and buys nothing a functional test can see. The
# binary that ships is still built with `release`, by build-app.yml.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

[patch.crates-io]
vt100 = { path = "packages/vt100" }

# Debug builds (`cargo build`, `cargo test`, clippy's check builds) keep only
# file:line tables for this workspace's crates and no debug info for
# dependencies: backtraces still name the line, while a fresh test build of the
# workspace shrinks from 2.9 GB to 2.0 GB and from 75 s to 60 s. For a debugger
# session on tmuxy's own code, build with CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
