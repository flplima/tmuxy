[package]
name = "tmuxy-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WASM binding over tmuxy-core's sans-IO control-mode parser + state aggregator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pure core only — no native (tokio/pty/nix) transport.
tmuxy-core = { path = "../tmuxy-core", default-features = false }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
base64.workspace = true
# tmuxy-core's tokens draw from `crypto.getRandomValues` in the browser.
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
