<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tmuxy CheerpX smoke</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #ddd;
        font:
          13px/1.3 ui-monospace,
          monospace;
      }
      pre {
        margin: 0;
        padding: 8px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #status {
        padding: 4px 8px;
        background: #222;
        color: #9f9;
      }
    </style>
  </head>
  <body>
    <div id="status">loading cx.esm.js…</div>
    <pre id="out"></pre>
    <script type="module">
      // The guest image under CheerpX, driven from outside: `window.cxType(text)`
      // feeds the console, `window.cxText()` returns everything it printed,
      // `window.cxStatus` is the boot phase. Served by scripts/serve-cheerpx-smoke.mjs.
      import * as CheerpX from 'https://cxrtnc.leaningtech.com/1.4.0/cx.esm.js';

      const out = document.getElementById('out');
      const status = document.getElementById('status');
      const setStatus = (s) => {
        status.textContent = s;
        window.cxStatus = s;
      };
      const log = (s) => {
        out.textContent += s;
      };
      window.cxText = () => out.textContent;
      window.cxClear = () => {
        out.textContent = '';
      };

      try {
        const t0 = performance.now();
        setStatus('opening the disk image');
        const disk = await CheerpX.HttpBytesDevice.create('/assets/tmuxy.ext2');
        // A smoke run starts from the image as built, so the overlay is a new
        // database every load; the previous loads' databases are dropped
        // (a delete can only be refused while a page still holds one open).
        const IDB = `tmuxy-cheerpx-smoke-${Date.now()}`;
        for (const { name } of await indexedDB.databases()) {
          if (name?.startsWith('tmuxy-cheerpx-smoke-')) indexedDB.deleteDatabase(name);
        }
        const idb = await CheerpX.IDBDevice.create(IDB);
        const overlay = await CheerpX.OverlayDevice.create(disk, idb);
        setStatus('creating the machine');
        // /mnt takes files from the page: `await window.cxPut('probe')` copies
        // /assets/probe into the guest as /mnt/probe, for one-off diagnostics.
        const data = await CheerpX.DataDevice.create();
        window.cxPut = async (name) => {
          const bytes = new Uint8Array(await (await fetch(`/assets/${name}`)).arrayBuffer());
          await data.writeFile(`/${name}`, bytes);
          return bytes.length;
        };
        const cx = await CheerpX.Linux.create({
          mounts: [
            { type: 'ext2', path: '/', dev: overlay },
            { type: 'dir', path: '/mnt', dev: data },
            { type: 'devs', path: '/dev' },
            // Undocumented but what WebVM mounts; without it openpty has no
            // slave to open and tmux cannot spawn a pane.
            { type: 'devpts', path: '/dev/pts' },
            { type: 'proc', path: '/proc' },
            { type: 'sys', path: '/sys' },
          ],
        });
        const decoder = new TextDecoder();
        const send = cx.setCustomConsole((buf) => log(decoder.decode(buf)), 100, 30);
        window.cxType = (text) => {
          for (const byte of new TextEncoder().encode(text)) send(byte);
        };
        // `?control` runs the tmux control-mode relay on the console instead
        // of a login shell: what the console then carries is the stream tmuxy reads.
        const control = new URLSearchParams(location.search).has('control');
        const [program, args] = control
          ? ['/usr/local/bin/tmuxy-console', []]
          : ['/bin/bash', ['--login']];
        setStatus(`running ${program} (${((performance.now() - t0) / 1000).toFixed(1)}s to here)`);
        const rc = await cx.run(program, args, {
          env: [
            'HOME=/root',
            'USER=root',
            'SHELL=/bin/bash',
            'TERM=xterm-256color',
            'LANG=C.UTF-8',
          ],
          cwd: '/root',
          uid: 0,
          gid: 0,
        });
        setStatus(`bash exited ${rc}`);
      } catch (e) {
        setStatus(`error: ${e?.message ?? e}`);
        log(`\n[error] ${e?.stack ?? e}`);
      }
    </script>
  </body>
</html>
