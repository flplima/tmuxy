<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>tmuxy</title>
    <!-- The rounded icon twice: a browser that shows no SVG favicon, as an
         older Safari, takes the ICO; `sizes` keeps the others on the SVG. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable on a phone's home screen as a standalone app (docs/ARCHITECTURE.md § Phone). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="tmuxy" />
    <!-- The status bar above the page, not over it: drawn over it
         (black-translucent), iOS 26 blurs the top of the app and never runs
         the check that leaves an opaque top edge alone (standalone.css). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- `?kindle` leaves for the e-ink page before the app's bundle runs. -->
    <script src="/kindle-redirect.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
