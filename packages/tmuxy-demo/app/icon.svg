<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- tmuxy: the pane grid on its green band, a rounded square on the dark macOS plate (824 on 1024) -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#323235"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fd11f"/>
      <stop offset="1" stop-color="#009e00"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55555a"/>
      <stop offset="1" stop-color="#404044"/>
    </linearGradient>
    <clipPath id="logoClip"><rect x="212" y="212" width="600" height="600" rx="134.7"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>
  <g filter="url(#logoShadow)">
    <rect x="212" y="212" width="600" height="600" rx="134.7" fill="url(#body)"/>
  </g>
  <g clip-path="url(#logoClip)">
    <rect x="212" y="657.9" width="600" height="154.1" fill="url(#green)"/>
    <rect x="212" y="212" width="288.3" height="422.5" fill="url(#pane)"/>
    <rect x="523.7" y="212" width="288.3" height="199.2" fill="url(#pane)"/>
    <rect x="523.7" y="434.7" width="288.3" height="199.8" fill="url(#pane)"/>
  </g>
  <rect x="213" y="213" width="598" height="598" rx="133.7" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="2"/>
</svg>
