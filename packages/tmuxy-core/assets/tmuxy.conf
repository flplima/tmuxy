# tmuxy.conf: your overrides for tmuxy's tmux server.
#
# This file is yours. tmuxy wrote it once, on the first run, and never touches
# it again; this whole directory is yours and safe to keep in a dotfiles repo.
# Delete the file and tmuxy runs on its defaults.
#
# tmuxy sources its own defaults BEFORE this file and its essentials (the few
# settings it cannot work without) AFTER it, so put only what you want to
# change here. `tmuxy config paths` lists every file tmuxy reads and writes.
#
# An @tmuxy-* option set here is pinned: the app's menus leave it alone, and
# show it as "set in tmuxy.conf". That holds for @tmuxy-theme,
# @tmuxy-theme-mode, @tmuxy-transparency, @tmuxy-cursor-blink and
# @tmuxy-send-ask, the options the menus can change.
#
# Saving the file applies it to the running app.
#
# Examples:
#
#   set -g @tmuxy-theme nord
#   set -g @tmuxy-opacity 0.85
#   set -g @tmuxy-inactive-pane-opacity 0.6
#   set -g @tmuxy-blur off
#   set -g @tmuxy-animations off
#   set -g @tmuxy-cursor-blink off
#   unbind C-a
#   set -g prefix C-Space
#   bind C-Space send-prefix
