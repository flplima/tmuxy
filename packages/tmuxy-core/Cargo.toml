[package]
name = "tmuxy-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core tmux interaction library for tmuxy"

# The control-mode parser + state aggregator (parser/state/osc/images/octal +
# the Tmux*/Delta types) are sans-IO and compile to wasm32. The synchronous
# tmux-command layer (session/executor/debug_log) is the `cli` feature, and the
# async/pty transport (monitor/connection/transport) on top of it is the
# default `native` feature, so the pure core can build with
# --no-default-features for the WASM (tmuxy-wasm) crate and the v86 guest's
# tmuxy-group binary can take `cli` without tokio.
[dependencies]
# Pure path — always compiled, wasm-safe.
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror = "2"
# NDJSON trace Layer (docs/TELEMETRY.md). Native-only — the wasm build does not
# write trace files and compiles with --no-default-features.
tracing-subscriber = { workspace = true, optional = true }
vt100 = "0.16"
# Pure-Rust SIXEL decoder so the backend can convert palette-based DCS sequences
# into PNG bytes the frontend can render via the standard /api/images endpoint.
icy_sixel = "0.5"
# PNG encoding for sixel + kitty-RGBA outputs.
png = "0.18"
# Standards-compliant base64 decoder for kitty/iTerm2 image payloads.
base64 = "0.22"

# `cli`: the user's config directory.
dirs = { version = "6.0", optional = true }
# `native`: the async transport.
tokio = { workspace = true, optional = true }
pty-process = { version = "0.5", features = ["async"], optional = true }

# wasm-compatible Instant (performance.now()) for the settling debounce timer.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[features]
default = ["native"]
# Running tmux as a subprocess and the user's config directory (session,
# executor, debug_log): what a CLI verb needs, and all tmuxy-group takes.
cli = ["dep:dirs"]
# The async/pty transport (monitor, connection, transport, snapshots, trace)
# on top of `cli`. Off for the wasm build.
native = ["cli", "dep:tokio", "dep:pty-process", "dep:tracing-subscriber"]

[lints]
workspace = true

# Axis-A core-pipeline benchmark (criterion). See benches/core_pipeline.rs and
# docs/PERFORMANCE.md.
[[bench]]
name = "core_pipeline"
harness = false
