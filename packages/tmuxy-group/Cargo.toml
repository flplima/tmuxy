[package]
name = "tmuxy-group"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The pane-group operations (`tmuxy-group <verb>`, `tmuxy-server group <verb>`) — standalone so the in-browser v86 guest (i686-musl) can run them too"

[lib]
name = "tmuxy_group"

[[bin]]
name = "tmuxy-group"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Only the group rules, the ids and the subprocess helpers: `cli` leaves the
# async transport (tokio, the pty) out of the i686-musl guest binary.
tmuxy-core = { path = "../tmuxy-core", default-features = false, features = ["cli"] }

[lints]
workspace = true
