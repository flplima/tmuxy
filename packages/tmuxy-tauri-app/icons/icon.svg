  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  </g>
  <g clip-path="url(#clip)">
    <rect x="100" y="712" width="824" height="212" fill="url(#green)"/>
    <rect x="100" y="100" width="396" height="580" fill="url(#pane)"/>
    <rect x="528" y="100" width="396" height="274" fill="url(#pane)"/>
    <rect x="528" y="406" width="396" height="274" fill="url(#pane)"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="2"/>
</svg>
