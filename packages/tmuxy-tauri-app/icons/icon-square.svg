<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- tmuxy, full-bleed: the system rounds the square into the plate -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#323235"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fd11f"/>
      <stop offset="1" stop-color="#009e00"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55555a"/>
      <stop offset="1" stop-color="#404044"/>
    </linearGradient>
    <clipPath id="logoClip"><rect x="139.2" y="139.2" width="745.6" height="745.6" rx="167.4"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12.4" stdDeviation="19.9" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#plate)"/>
  <g filter="url(#logoShadow)">
    <rect x="139.2" y="139.2" width="745.6" height="745.6" rx="167.4" fill="url(#body)"/>
  </g>
  <g clip-path="url(#logoClip)">
    <rect x="139.2" y="693.3" width="745.6" height="191.5" fill="url(#green)"/>
    <rect x="139.2" y="139.2" width="358.3" height="525" fill="url(#pane)"/>
    <rect x="526.6" y="139.2" width="358.3" height="247.6" fill="url(#pane)"/>
    <rect x="526.6" y="415.9" width="358.3" height="248.3" fill="url(#pane)"/>
  </g>
  <rect x="140.2" y="140.2" width="743.6" height="743.6" rx="166.4" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="2"/>
</svg>
