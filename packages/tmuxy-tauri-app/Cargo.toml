[package]
name = "tmuxy-tauri-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Tmuxy Tauri desktop application"

[[bin]]
name = "tmuxy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tracing.workspace = true
tauri = { version = "2.0", features = ["macos-private-api"] }
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tmuxy-core = { path = "../tmuxy-core" }
tmuxy-server = { path = "../tmuxy-server" }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-webdriver = { version = "0.2", optional = true }

[features]
webdriver = ["tauri-plugin-webdriver"]

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process"] }

# Native title-bar chrome (traffic-light placement, double-click preference) — see src/titlebar.rs
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSUserDefaults"] }
