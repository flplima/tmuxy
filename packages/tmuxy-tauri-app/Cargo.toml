[package]
name = "tmuxy-tauri-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tmuxy Tauri desktop application"

[[bin]]
name = "tmuxy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tracing.workspace = true
tauri = { version = "2.0", features = ["macos-private-api"] }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tmuxy-core = { path = "../tmuxy-core" }
tmuxy-server = { path = "../tmuxy-server" }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-webdriver = { version = "0.2", optional = true }
tauri-plugin-window-state = "2"

[features]
webdriver = ["tauri-plugin-webdriver"]

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process"] }

# A native error dialog before any window exists (no tmux, or one too old).
# Linux shows it with GTK directly (src/startup_error.rs): rfd's Linux
# backends need `zenity`, or run GTK on a thread of their own that deadlocks
# against the event loop tauri's setup is blocking.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

# Native title-bar chrome (traffic-light placement, double-click preference) — see src/titlebar.rs,
# and the scroll-wheel event monitor behind the two-finger slide — see src/gestures.rs
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSButton", "NSControl", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSUserDefaults"] }
# Same crate tauri applies window effects with; used directly to clear the blur (tauri only clears on Windows)
window-vibrancy = "0.6"

# The scroll-event hook on the WebKitGTK widget behind the two-finger slide — see src/gestures.rs
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
