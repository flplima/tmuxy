[package]
name = "tmuxy-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tmuxy server with embedded frontend and dev mode"

[lints]
workspace = true

[[bin]]
name = "tmuxy-server"
path = "src/main.rs"

[dependencies]
tmuxy-core = { path = "../tmuxy-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8" }
# HTTP Basic auth: decode the `Authorization: Basic <base64>` header.
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
dirs = "6.0"
futures-util = "0.3"
# The `--dev` proxy to Vite.
reqwest = { version = "0.12", default-features = false }
tower = { version = "0.5", features = ["util"] }
async-stream = "0.3"
tmuxy-tree = { path = "../tmuxy-tree" }
tmuxy-group = { path = "../tmuxy-group" }
# The `tmuxy connect` form (src/connect.rs).
ratatui = "0.30"
chromiumoxide = "0.9"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
libc = "0.2"

