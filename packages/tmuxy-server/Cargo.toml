[package]
name = "tmuxy-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tmuxy server with embedded frontend and dev mode"

[lints]
workspace = true

[[bin]]
name = "tmuxy-server"
path = "src/main.rs"

[dependencies]
tmuxy-core = { path = "../tmuxy-core" }
serde.workspace = true
# preserve_order: `tmuxy agent install` rewrites the user's own agent
# settings, which must keep the order they were written in.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8" }
# HTTP Basic auth: decode the `Authorization: Basic <base64>` header.
base64.workspace = true
clap.workspace = true
rust-embed = "8"
dirs.workspace = true
futures-util = "0.3"
# The `--dev` proxy to Vite, and web push to a browser's push service over
# HTTPS (`push`), with rustls and the Mozilla roots: no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Web push (`push`): VAPID's ES256 and RFC 8291's ECDH from ring (already
# rustls's), its HKDF and AES-GCM from RustCrypto.
ring = "0.17"
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
tower = { version = "0.5", features = ["util"] }
async-stream = "0.3"
tmuxy-group = { path = "../tmuxy-group" }
# `pane_wait_for` on `/mcp`: wait until a pane's screen matches a pattern.
regex = "1"

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "hostname"] }
libc = "0.2"

