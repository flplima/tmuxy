[package]
name = "tmuxy-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tmuxy server with embedded frontend and dev mode"

[lints]
workspace = true

[[bin]]
name = "tmuxy-server"
path = "src/main.rs"

[dependencies]
tmuxy-core = { path = "../tmuxy-core" }
serde.workspace = true
# preserve_order: `tmuxy agent install` rewrites the user's own agent
# settings, which must keep the order they were written in.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8" }
# HTTP Basic auth: decode the `Authorization: Basic <base64>` header and
# compare SHA-256 digests in constant time without leaking password length.
base64.workspace = true
sha2 = "0.10"
clap.workspace = true
rust-embed = "8"
dirs.workspace = true
futures-util = "0.3"
# The `--dev` proxy to Vite.
reqwest = { version = "0.12", default-features = false }
tower = { version = "0.5", features = ["util"] }
async-stream = "0.3"
tmuxy-group = { path = "../tmuxy-group" }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "hostname"] }
libc = "0.2"

