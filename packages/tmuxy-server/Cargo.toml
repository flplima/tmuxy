[package]
name = "tmuxy-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tmuxy server with embedded frontend and dev mode"

[lints]
workspace = true

[[bin]]
name = "tmuxy-server"
path = "src/main.rs"

[dependencies]
tmuxy-core = { path = "../tmuxy-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
thiserror.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8" }
base64.workspace = true
clap.workspace = true
rust-embed = "8"
dirs.workspace = true
futures-util = "0.3"
# The `--dev` proxy to Vite, and web push to a browser's push service over
# HTTPS (`push`), with rustls and the Mozilla roots: no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Web push (`push`): VAPID's ES256 and RFC 8291's ECDH from ring (already
# rustls's), its HKDF and AES-GCM from RustCrypto.
ring = "0.17"
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
tower = { version = "0.5", features = ["util"] }
async-stream = "0.3"
tmuxy-verbs = { path = "../tmuxy-verbs" }
regex = "1"

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }
libc = "0.2"


[dev-dependencies]
# Paused time: the grace and hold tests advance the clock instead of sleeping.
tokio = { workspace = true, features = ["test-util"] }
